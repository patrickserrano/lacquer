name: Deploy docs to Cloudflare

# OPTIONAL second publishing target for the documentation sites. GitHub Pages is
# the default and needs no secrets; this deploys the same composed `gh-pages`
# tree to Cloudflare Workers Static Assets, and does nothing at all until the
# project sets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#
# Core-owned rather than per-profile, because it is stack-agnostic: it deploys
# whatever the stacks composed, so one deployer covers a repo with any mix of
# iOS, web, and supabase components.

on:
  # NOT `push: branches: [gh-pages]`, which is the obvious trigger and would
  # never fire: scripts/publish-docs.sh pushes with GITHUB_TOKEN, and a push made
  # with GITHUB_TOKEN does not trigger workflows. workflow_run keys off the
  # publishing workflow itself instead.
  #
  # Naming a workflow a project does not have is harmless — it simply never
  # matches — so this one list covers every combination of profiles.
  #
  # SECURITY: workflow_run runs from the default branch WITH secrets, even when
  # the run that triggered it came from a fork — the classic way a fork PR
  # reaches a privileged job. That path does not exist here: all three named
  # workflows trigger only on `schedule` and `workflow_dispatch`, never on
  # pull_request. Neither can be initiated by a fork at all, so the fork route
  # is closed at the source. Keep it that way.
  #
  # If a docs workflow ever gains a PR trigger, gate this job on the upstream
  # event — but gate it on what the docs workflows actually use. The obvious
  # `github.event.workflow_run.event == 'push'` would disable this deployer
  # entirely: a cron-triggered run reports `schedule`, not `push`, so the one
  # path that fires in practice would stop matching. (That comparison was
  # correct when the docs workflows ran on push to main; they were moved to an
  # overnight cron, which is exactly how a security note goes quietly stale.)
  workflow_run:
    workflows: ["iOS Docs", "Web Docs", "Supabase Docs"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read # clone gh-pages; the deploy authenticates to Cloudflare, not GitHub

# Shared with the stacks' publish jobs so a deploy never reads gh-pages while a
# stack is mid-push. Never cancel: the last deploy is the one that matters, and a
# cancelled one leaves Cloudflare serving a stale tree with nothing to retry it.
concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    # A failed docs build published nothing; deploying anyway would push the
    # previous tree again and report success, which reads as "the new docs are
    # live". workflow_dispatch has no upstream run, hence the second clause.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # Cloudflare is opt-in, so a project that has not set the secrets must get
      # a clean skip, not a red X — the same lesson as the Claude-powered
      # workflows: an unattended job that fails on a missing optional credential
      # trains you to stop reading the Actions tab. `secrets` is unavailable in a
      # job-level `if`, so this is a step that exports an output.
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CF_TOKEN:-}" ] && [ -n "${CF_ACCOUNT:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Cloudflare deployment is not configured — the docs are published to GitHub Pages only. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable it."

      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/deploy-docs-cloudflare.sh

      - name: Link the deployment
        if: steps.creds.outputs.present == 'true'
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "### Docs deployed to Cloudflare"
            echo ""
            echo "Worker: \`${repo}-docs\` — see the deploy step for the resolved URL."
            echo ""
            echo "The site is served under \`/${repo}/\` so that DocC's baked-in"
            echo "hosting base path matches GitHub Pages exactly; the bare domain"
            echo "redirects there."
          } >> "$GITHUB_STEP_SUMMARY"
