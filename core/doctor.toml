# Self-tests for core — the layer every project gets regardless of stack.
#
# These had nowhere to live until doctor learned about the core layer, which
# meant the single highest-stakes check in the harness, the secrets scanner, was
# the one thing nothing tested. It ships to every repo and runs on every commit;
# if its regex ever stops matching it fails open, silently, and the only signal
# is a credential in a public repo.
#
# Each probe stages a known-bad file in a scratch git repo and asserts the
# scanner REJECTS it — and, since every one of them reaches the scanner through
# `bash {component}/scripts/check-secrets.sh`, asserts WHICH rejection it got.
#
# That second half is not decoration. `expect = "fail"` on its own is satisfied
# by any non-zero exit, and bash produces one for every way this probe can go
# wrong that has nothing to do with the scanner: the script deleted (exit 127,
# "No such file or directory"), unreadable, or carrying a syntax error. All five
# of these probes would have reported OK in that state, on the check the header
# above calls the highest-stakes in the harness. `requires` does not close it —
# bash and git are both present, and the thing that is missing is the subject.
#
# So each probe below names the report its own fixture produces: which of the
# two scans fired, in which file, on which credential. Delete the script and
# they go red on the assertion rather than green on the exit code.

[[probe]]
name = "the secrets scanner rejects a provider-prefixed credential"
why = """
The scanner's original regex only fired when the VARIABLE was named like a
secret (api_key, password, access_token...). It said nothing about the value, so
a real key bound to an ordinary name passed straight through:

    anthropic_key_for_proxy=sk-ant-api03-...

Seven live credentials were found in a dotfile in exactly that shape —
sk-ant-api03-, sbp_, ghp_, perm- — every one bound to a name the scanner did not
recognise. Value-side patterns were added for that reason; this probe is what
keeps them working.
"""
file = "leak.swift"
content = """
let token = "sk-ant-api03-AAAABBBBCCCCDDDDEEEEFFFFGGGGHHHH"
"""
requires = ["git", "bash"]
argv = ["bash", "-c", """
set -e
cd {dir}
git init -q .
git add leak.swift
bash {component}/scripts/check-secrets.sh
"""]
expect = "fail"
# The VALUE-side scan, named explicitly: its report line differs from the
# name-based scan's, so this cannot be satisfied by the other half firing.
expect_output = '(?s)Provider credential found in staged files:.*leak\.swift:[0-9]+:sk-ant-api03-'

[[probe]]
name = "the secrets scanner rejects a named-assignment secret"
why = """
The other half of the scanner: `api_key = "..."`-shaped assignments. Both halves
are load-bearing and they fail independently — a regex edit that fixes one can
silently break the other, which is why each has its own probe rather than one
fixture standing in for both.
"""
file = "leak.swift"
content = """
let api_key = "abcdefgh12345678"
"""
requires = ["git", "bash"]
argv = ["bash", "-c", """
set -e
cd {dir}
git init -q .
git add leak.swift
bash {component}/scripts/check-secrets.sh
"""]
expect = "fail"
# The NAME-side scan. `api_key = "..."` matches no provider prefix, so only the
# assignment regex can produce this report — which is the half being proved.
expect_output = '(?s)Potential hardcoded secrets found in staged files:.*leak\.swift:[0-9]+:api_key = "abcdefgh'

[[probe]]
name = "the secrets scanner sees a credential inside markup"
why = """
The value-side patterns were added so a key bound to an ordinary name could not
hide. They were then piped through a placeholder filter copied verbatim from the
name-based block above them — including a bare `<.*>`, matched against grep's
whole output line. Any line carrying angle brackets satisfies that: a <meta>
tag, a JSX prop, an SVG attribute, an HTML comment. The credential was found and
then thrown away, and the hook exited 0.

The filter now applies to the matched VALUE alone, which no provider pattern
lets contain a `<`. This probe is the difference between the two behaviours.
"""
file = "leak.html"
content = """
<meta name="anthropic" content="sk-ant-api03-AAAABBBBCCCCDDDDEEEEFFFFGGGGHHHH">
"""
requires = ["git", "bash"]
argv = ["bash", "-c", """
set -e
cd {dir}
git init -q .
git add leak.html
bash {component}/scripts/check-secrets.sh
"""]
expect = "fail"
# Naming the .html file is the point: the bug this probe covers threw the
# credential away because the LINE carried angle brackets, so an assertion that
# only said "something was rejected" would not distinguish the fix from any
# other reason bash exited non-zero.
expect_output = '(?s)Provider credential found in staged files:.*leak\.html:[0-9]+:sk-ant-api03-'

[[probe]]
name = "the secrets scanner sees a credential under examples/"
why = """
The same copied filter carried `example`, and grep prefixes every output line
with `path:lineno:`. So the word only had to appear in the PATH: a live key in
any file under an examples/ directory was dropped before it could be reported.
Note this is not covered by the `.example` suffix exclusion in the staged-file
list — that skips template files by name, which is deliberate; this was a
directory anywhere in the tree silently exempting real source.

The second file is load-bearing, not padding. grep prints the filename only
when it is given more than one file to search, so with a single staged file the
path never reaches the filter and even the old scanner catches this. It takes a
commit touching two files — which is to say nearly every real commit — for the
bug to appear at all. A one-file fixture here would pass against both the broken
and the fixed script and prove nothing.
"""
file = "leak.swift"
content = """
let token = "sk-ant-api03-AAAABBBBCCCCDDDDEEEEFFFFGGGGHHHH"
"""
requires = ["git", "bash"]
argv = ["bash", "-c", """
set -e
cd {dir}
git init -q .
mkdir -p examples
mv leak.swift examples/leak.swift
printf 'let unrelated = 1\n' > other.swift
git add examples/leak.swift other.swift
bash {component}/scripts/check-secrets.sh
"""]
expect = "fail"
# The path must appear WITH its examples/ prefix: the old filter matched the
# word `example` in grep's path prefix and dropped the finding, so the prefix is
# precisely what has to survive into the report.
expect_output = '(?s)Provider credential found in staged files:.*examples/leak\.swift:[0-9]+:sk-ant-api03-'

[[probe]]
name = "the secrets scanner fails loudly when it cannot run"
why = """
The scan was written as `grep … 2>/dev/null | … || true`, which erases the two
things that distinguish "found nothing" from "never ran": the diagnostic on
stderr and the exit status. grep exits 0 on a match, 1 on none, and >=2 when it
could not run — an unreadable file, an argument list too long for the kernel, a
pattern the platform's grep rejects. All three collapsed into empty output, read
as clean, and the commit went through.

The fixture stages two files and deletes one from the worktree, so grep is handed
a path that is not there and exits 2. That is deterministic and does not depend
on the probe's uid — a chmod-based fixture would silently stop testing anything
the moment it ran as root, which is the same class of bug as the one here.
"""
file = "a.swift"
content = """
let x = 1
"""
requires = ["git", "bash"]
argv = ["bash", "-c", """
set -e
cd {dir}
git init -q .
printf 'let y = 2\n' > b.swift
git add a.swift b.swift
rm -f a.swift
bash {component}/scripts/check-secrets.sh
"""]
expect = "fail"
# This is the probe the exit code could never have proved. It asserts the
# scanner NOTICED that it could not run and said so; a bare expect="fail" is
# satisfied by the scanner not running at all, which is the failure mode.
expect_output = 'check-secrets: the scan could not run \(grep exit [0-9]+\) — refusing to report a pass\.'

[[probe]]
name = "the secrets scanner accepts ordinary source"
why = """
A scanner that rejects everything gets uninstalled within a week, and an
uninstalled scanner catches nothing. This fixture mentions a key prefix in prose
with a placeholder — exactly what a README or an .example file looks like — and
must NOT trip. Without this probe the only pressure on the patterns is toward
broader, and broader is how a check gets switched off.

This is the one probe here with no `expect_output`, and the gap is real rather
than an oversight: the scanner is SILENT on success by design, so there is
nothing it prints that could be asserted. That leaves one way for this probe to
pass wrongly — the staged-file filter growing until it excludes docs.swift, so
the scan exits 0 having looked at nothing. Closing it means making the script
say what it scanned, which is a change to core/root/scripts/check-secrets.sh
rather than to this file.
"""
file = "docs.swift"
content = """
// A key looks like sk-ant-api03-your_key_here — see Secrets.xcconfig.example.
let greeting = "hello"
"""
requires = ["git", "bash"]
argv = ["bash", "-c", """
set -e
cd {dir}
git init -q .
git add docs.swift
bash {component}/scripts/check-secrets.sh
"""]
expect = "pass"

[[probe]]
name = "the secrets scanner accepts Supabase's env() indirection syntax"
why = """
`supabase init` and every subsequent `supabase gen` write config.toml entries
like `openai_api_key = "env(OPENAI_API_KEY)"` — that is Supabase CLI's own
documented syntax for "read this from the environment," not a literal value.
It satisfied the assignment regex (a `..._api_key` name bound to an 8+
character quoted string) and none of the placeholder terms, so a config.toml
every Supabase project ships unmodified failed every commit.

The fixture mirrors the two lines the bug report gave verbatim: a value that
IS exactly `env(VAR_NAME)` must pass, and it sits next to a value that only
ends with that shape must not launder a real secret through it — an
`expect = "pass"` fixture proves the former; that latter guarantee is not
re-proved here because it would require a SECOND probe asserting `fail`, and
the assignment/prefixed probes above already hold that a quoted 8+ character
value is caught regardless of what follows it.
"""
file = "supabase_config.toml"
content = """
[functions.hello]
openai_api_key = "env(OPENAI_API_KEY)"
anthropic_api_key = "env(ANTHROPIC_API_KEY)"
"""
requires = ["git", "bash"]
argv = ["bash", "-c", """
set -e
cd {dir}
git init -q .
git add supabase_config.toml
bash {component}/scripts/check-secrets.sh
"""]
expect = "pass"
