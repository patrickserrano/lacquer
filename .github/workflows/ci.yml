name: CI

on:
  pull_request:
    # No `branches` filter, deliberately. It used to be `branches: [main]`, which
    # meant a STACKED pr — one based on another feature branch, the normal way to
    # split a large change into reviewable pieces — got no checks at all. Not a
    # failing check: none, so `gh pr checks` reported "no checks reported" and the
    # VERSION guard, the conventional-title check and the tests all silently did
    # not run. A gate that does not run is the failure mode this repo keeps
    # finding; it should not be in its own CI.
    # `edited` is not in the default set (opened, synchronize, reopened), and
    # without it the title and body guards below would be evaluated once at open
    # and never again — while the title and body are exactly what a person edits
    # afterwards. A green check would then attest to text that no longer exists,
    # and since both feed the squash commit, the version is derived from the
    # edited text, not the checked one.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # VERSION is machine-assigned (see .github/workflows/version.yml). Rejecting
  # hand edits in a PR is what makes collisions impossible to author: two open PRs
  # both bumping 70 -> 71 merge CLEANLY, because both sides made the identical
  # change, and nothing else would ever complain.
  version-guard:
    name: VERSION is machine-assigned
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject manual VERSION edits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # -qx: an exact whole-line match, so a path like docs/VERSION.md can't
          # trip this.
          # THREE-dot: diff against the MERGE BASE, not main's tip. Two-dot
          # compares the two commits directly, so once main advances the PR's
          # diff includes main's own commits inverted — and since every merge
          # here releases, main advances with a `chore: bump VERSION` commit
          # constantly. Every PR opened before a release then looked like it had
          # reverted VERSION and failed this guard. Verified on #95: two-dot
          # listed VERSION, three-dot listed only the PR's two real files.
          if git diff --name-only "$BASE...$HEAD" | grep -qx 'VERSION'; then
            echo "::error::Remove the VERSION edit — it is bumped automatically on merge to main from conventional commits (.github/workflows/version.yml). Hand-picked numbers are how two PRs end up claiming the same version, which git merges without complaint. To set it deliberately (e.g. graduating to 1.0.0), push to main directly."
            exit 1
          fi
          echo "VERSION untouched."

  # The version is derived from commit messages, so it is only as good as they
  # are — and this repo squash-merges, which makes the PR TITLE the commit subject
  # on main. At the time this was added, 3 of the last 12 subjects on main were
  # not conventional (e.g. "Assert a project baseline instead of observing one
  # (#87)"). Each of those merges would compute no bump and silently release
  # nothing, which is the missed-bump bug returning through the one door the rest
  # of this design leaves open.
  commit-convention:
    name: PR title is a conventional commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the PR title
        env:
          # Untrusted input: read via env, never interpolated into the script.
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          types='feat|fix|docs|chore|ci|build|refactor|perf|style|test|revert'

          if ! printf '%s' "$TITLE" | grep -qE "^(${types})(\([^)]+\))?!?: .+"; then
            echo "::error::PR title must be a conventional commit — it becomes the squash-merge subject on main, and the release version is derived from it. Expected '<type>(<scope>)?: <description>', e.g. 'feat(core): add X'. Types: ${types}."
            exit 1
          fi

          # Material change = content this repo ships into projects. Such a change
          # must release, or `lacquer status` keeps telling projects they are
          # current while the content has moved. docs:/chore:/ci: do NOT release,
          # so they are not allowed to carry one. (#88 was `docs(core):` and
          # changed core/CLAUDE.core.md — exactly this mistake.)
          # Three-dot for the same reason as the VERSION guard above.
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(core|profiles)/'; then
            if ! printf '%s' "$TITLE" | grep -qE "^(feat|fix)(\([^)]+\))?!?: |^(${types})(\([^)]+\))?!: "; then
              echo "::error::This PR changes shipped content under core/ or profiles/, which projects consume — so it must produce a release. Use 'feat:' or 'fix:' (or a breaking '!'), not a non-releasing type. Prose counts: a rule change in CLAUDE.core.md is material even though it reads like docs."
              exit 1
            fi
          fi
          echo "PR title OK."

      # Squash-merge puts the PR BODY into the commit message, and svu decides
      # "breaking" by substring-searching that body:
      #
      #   breakingBody = regexp.MustCompile("(?m).*BREAKING[ -]CHANGE:.*")
      #   func isBreaking(c git.Commit) bool {
      #       return breakingBody.MatchString(c.Body) || breaking.MatchString(c.Title)
      #   }
      #
      # It is not a footer check and it is not anchored, so merely *quoting* the
      # convention declares it. #89 shipped a table row reading
      # "| `feat!:` / `BREAKING CHANGE:` | major |" as documentation, and svu
      # proposed 1.0.0 off a 0.72.0 base — a major release authored by a legend
      # in a markdown table. Note the asymmetry that makes this a trap: breaking
      # is the ONLY check that reads the body; feat:/fix: are title-only, so
      # nothing else in a PR description can move the version.
      - name: Reject a stray breaking-change marker in the PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # Case-sensitive and the same character class svu uses, so this
          # matches exactly what svu will match — no more, no less.
          if printf '%s' "$BODY" | grep -qE 'BREAKING[ -]CHANGE:'; then
            if ! printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([^)]+\))?!: '; then
              echo "::error::The PR body contains a breaking-change marker, and the body becomes the squash commit message — svu will read it as a declaration and bump the MAJOR version, even if it only appears inside a code span or a table. If the change really is breaking, say so in the title with '!' (e.g. 'feat!: ...'). If you are only referring to the convention, break up the string so it no longer matches, or drop the trailing colon."
              exit 1
            fi
          fi
          echo "No stray breaking-change marker."

      # The site's rule pages are hand-maintained mirrors of the shipped rule
      # files, and nothing compared them, so they drifted silently:
      # agent-rules.md documented `exclude = ["lefthook.yml"]` for months after
      # core/CLAUDE.core.md moved to the attributed `{ path, reason, until }`
      # form — the published docs handing readers config the tool no longer
      # accepts. This is the floor: it does not prove the two agree, it only
      # removes the failure that actually happened, which is editing one and
      # forgetting the other. The content check is
      # internal/docsmirror.TestMirrorsShowNoCodeTheSourceDoesNot, in the `test`
      # job below.
      #
      # Lives in this job rather than a new one because a job is billed at a
      # one-minute minimum, so job COUNT is the cost. This job already checks
      # out at fetch-depth 0 and already has BASE/HEAD.
      #
      # The PAIRS list is duplicated from internal/docsmirror.Pairs, and
      # TestWorkflowPairsMatchPairs parses this file and fails if the two ever
      # disagree — a drift checker that has itself drifted is worse than none.
      # Keep the tab-separated `source<TAB>mirror` shape it greps for.
      - name: Rule-file mirrors change together
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Three-dot for the same reason as the guards above: two-dot would
          # include main's own commits inverted once main advances.
          changed=$(git diff --name-only "$BASE...$HEAD")
          rc=0
          # `while read` + heredoc, not `for x in $var`: the paths are read one
          # line at a time regardless of how the shell word-splits.
          while IFS=$'\t' read -r src mirror; do
            [ -n "$src" ] || continue
            # -qxF: exact whole-line, fixed-string. A path that merely CONTAINS
            # another must not satisfy it.
            if printf '%s\n' "$changed" | grep -qxF "$src" \
               && ! printf '%s\n' "$changed" | grep -qxF "$mirror"; then
              echo "::error file=${src}::${src} changed but ${mirror} did not. That page restates this file for readers of the published docs, and nothing else compares them — leaving it behind is how it ended up documenting config the tool no longer accepts. Update the mirror in this change, or say in the PR why the edit does not reach it."
              rc=1
            fi
          done <<'PAIRS'
          core/CLAUDE.core.md	site/src/content/docs/guides/agent-rules.md
          profiles/ios/CLAUDE.ios.md	site/src/content/docs/guides/ios-rules.md
          profiles/web/CLAUDE.web.md	site/src/content/docs/guides/web-rules.md
          profiles/supabase/CLAUDE.supabase.md	site/src/content/docs/guides/supabase-rules.md
          PAIRS
          if [ "$rc" -ne 0 ]; then
            exit 1
          fi
          echo "Rule-file mirrors OK."

  test:
    # The only job worth moving to the self-hosted Synology runner --
    # ~8-10 min per run, the dominant cost of this workflow. The two fast
    # checks above (VERSION, PR title) stay on ubuntu-latest: they're a few
    # seconds each, GitHub-hosted cost is negligible, and this repo only
    # has 2 dedicated self-hosted slots (synology-personal-1/2) -- reserving
    # them for the expensive job avoids queueing the trivial ones behind it
    # when multiple PRs are open at once.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race
