name: Version

# Derives VERSION from conventional commits when shipped content lands on main,
# so no human ever picks it — and so VERSION and the release tag can never drift,
# because release.yml tags exactly what this writes.
#
# Two real failures motivated this, both caused by a human choosing the value
# inside a PR:
#   - Missed bumps. Content shipped without a bump, so `lacquer status` told
#     projects they were current when they weren't — and because release.yml keys
#     off VERSION, the release was skipped too. v0.69.0 does not exist: #86 had to
#     correct two missed bumps at once, and that gap is permanent.
#   - Collisions. Two open PRs both bumped 70 -> 71. Git merges that CLEANLY
#     (both sides made the identical change), so nothing complains, and two
#     different shipped contents end up sharing one version.

on:
  push:
    branches: [main]
    # Only content that `lacquer sync` actually distributes. Deliberately broad
    # (all of core/ and profiles/) rather than an exact list of asset
    # subdirectories: an exact list must be updated whenever a new asset category
    # is added, and forgetting shows up as a silent missed bump — the very thing
    # this workflow exists to prevent. Broad means we occasionally bump for a
    # harness-only file (e.g. profiles/ios/baseline.toml, which is policy rather
    # than synced content). That over-reports staleness by one version, which is
    # the harmless direction.
    paths:
      - "core/**"
      - "profiles/**"

permissions:
  contents: write # commit and push the bump
  actions: write # dispatch release.yml (see the last step)

# Never cancel, and never run two at once: each qualifying push must get exactly
# one bump, and a cancelled run would silently drop one.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # svu reads tags and history; a shallow clone gives wrong answers

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compute the next version
        id: next
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # If this push already set VERSION, it was deliberate (a direct push, or
          # a correction like #86). Don't bump on top of it. `before` is all-zeros
          # on a branch's first push and stale after a force-push, so fall back to
          # the single-commit diff rather than trusting it blindly.
          if git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null; then
            range="${BEFORE}..${AFTER}"
          else
            range="${AFTER}^..${AFTER}"
          fi
          if git diff --name-only "$range" -- VERSION | grep -qx 'VERSION'; then
            echo "VERSION was set by this push; leaving it alone."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cur=$(tr -d '[:space:]' < VERSION)
          # Normalize the legacy bare counter (N -> 0.N.0), matching what
          # internal/version.Parse does, so this keeps working on an old checkout.
          case "$cur" in
            *.*.*) ;;
            '' ) echo "::error::VERSION is empty"; exit 1 ;;
            *[!0-9]* ) echo "::error::VERSION is not a version: '$cur'"; exit 1 ;;
            * ) cur="0.${cur}.0" ;;
          esac

          # --always is REQUIRED, not cosmetic. svu bumps nothing for docs:,
          # chore:, ci:, or refactor: — and shipped-prose changes are usually
          # exactly those (#88 was `docs(core):`). Without it a content change
          # produces no new version, which is the missed-bump bug through a new
          # door. Verified against svu v3.4.1: docs: -> no bump, docs: --always ->
          # patch. (A `.svu.yaml` with `always: true` was tried and had NO effect
          # in v3.4.1, so the flag is the only mechanism relied on here.)
          cand=$(go run github.com/caarlos0/svu/v3@latest next --always)
          cand=${cand#v}
          echo "svu proposed: ${cand} (current: ${cur})"

          # Stay in 0.x. svu takes a `feat!:`/BREAKING CHANGE straight to 1.0.0 —
          # it does NOT apply the 0.x convention where a breaking change is a minor
          # bump. Graduating to 1.0.0 should be a deliberate act, not a side effect
          # of one commit's punctuation, so clamp it back to a minor bump.
          # To graduate on purpose: set VERSION to 1.0.0 in a direct push (the
          # guard above then leaves it alone) and delete this clamp.
          case "$cand" in
            0.*) ;;
            *)
              minor=$(echo "$cur" | cut -d. -f2)
              cand="0.$((minor + 1)).0"
              echo "clamped to ${cand} to stay in 0.x"
              ;;
          esac

          if [ "$cand" = "$cur" ]; then
            echo "no version change computed; nothing to do."
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$cand" > VERSION
          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "version=${cand}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.next.outputs.bump == 'true'
        env:
          NEXT: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump VERSION to ${NEXT}"

          # The concurrency group serializes this workflow, but main is shared with
          # humans and other automation, so a push can still race. Rebase and
          # retry rather than failing and leaving the bump unlanded.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected; rebasing onto main and retrying"
            git pull --rebase --autostash origin main
          done
          echo "::error::could not push the VERSION bump after 3 attempts"
          exit 1

      - name: Trigger the release
        if: steps.next.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # release.yml triggers on a push to main touching VERSION — but a push
          # made with GITHUB_TOKEN does NOT trigger workflows (GitHub's recursion
          # guard). Without this explicit dispatch the bump would land and the
          # release would never be cut, which is strictly worse than the missed
          # bumps this workflow replaces. release.yml skips when the tag already
          # exists, so a duplicate dispatch is a no-op.
          gh workflow run release.yml --ref main
          echo "dispatched release.yml"
