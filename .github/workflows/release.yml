name: Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  # version.yml bumps VERSION and pushes with GITHUB_TOKEN, and such a push does
  # NOT trigger workflows (GitHub's recursion guard) — so the push trigger above
  # never fires for an automated bump. version.yml dispatches this workflow
  # explicitly instead. Keep both: the push trigger still covers a human editing
  # VERSION directly. The tag check below makes a duplicate run a no-op.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          # VERSION is semver, so the tag is it verbatim — one value, so the file
          # and the tag cannot drift. It used to be the formula v0.${VERSION}.0
          # over an integer counter; a bare integer is still normalized that way so
          # this keeps working if VERSION is ever set to a legacy value.
          case "$version" in
            *.*.*) ;;
            '') echo "::error::VERSION is empty"; exit 1 ;;
            *[!0-9]*) echo "::error::VERSION is not a version: '$version'"; exit 1 ;;
            *) version="0.${version}.0" ;;
          esac
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  release:
    needs: tag
    if: needs.tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
