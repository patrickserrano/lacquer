# An iOS app with a watchOS companion, generated by XcodeGen and with NO
# committed project.pbxproj: the shape every watch app in the fleet this was
# built for is in. The audit used to read only the pbxproj, so on a clean
# checkout a watch test bundle that nothing ran was invisible here.
#
# Deliberately declares no [project.watch_tests]: the uncovered watch bundle is
# the finding the audit must make from project.yml alone.

[project]
name = "Watchapp"
project_name = "Watchapp"
scheme = "Watchapp"
xcodeproj = "Watchapp.xcodeproj"
swift_version = "6"
bundle_id = "com.example.watchapp"
asc_app_id = "1000000004"
github_org = "example-org"
stack = "ios"
tools = ["claude"]

[[component]]
path = "."
profiles = ["ios"]
