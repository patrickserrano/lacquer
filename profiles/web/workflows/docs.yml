name: Web Docs

# Publishes the TypeDoc site to https://<owner>.github.io/<repo>/api/.
#
# Validation lives in web-ci.yml's `Docs` job — branch protection points at a
# single required check (CI OK), and a job in another workflow cannot be one of
# its `needs`. This workflow only publishes what CI already proved builds clean.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "{{COMPONENT_PREFIX}}**"

permissions:
  contents: write # scripts/publish-docs.sh pushes the gh-pages branch

# Shared with every other stack's docs workflow in this repo so two stacks never
# push gh-pages concurrently. Never cancel — a cancelled publish leaves the
# branch without this commit's docs and nothing retries it.
concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish TypeDoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "{{COMPONENT_PREFIX}}package-lock.json"

      - run: npm ci
        working-directory: "{{COMPONENT_PREFIX}}."

      # Unlike DocC, TypeDoc emits relative asset URLs, so the site works at any
      # depth and needs no base-path setting to match the /api/ subdirectory.
      # Honour [baseline.relax] documentation, exactly as the CI Docs job and the
      # local hooks do. This workflow did NOT, so a project with a valid,
      # unexpired relaxation went green on its PR and then failed on main the
      # moment it merged — which is precisely the "a lot of failures on main"
      # symptom. Third place this same relaxation had to be taught.
      - name: Read the documentation relaxation
        id: relax
        run: |
          set -euo pipefail
          state=$(scripts/docs-relaxation.sh .lacquer.toml 2>/dev/null || echo none)
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          case "$state" in
            expired)   echo "::error::The documentation relaxation in .lacquer.toml has expired."; exit 1 ;;
            malformed) echo "::error::The [baseline.relax] documentation entry is malformed."; exit 1 ;;
            relaxed)   echo "::warning::Documentation is relaxed — publishing what builds, not gating on completeness." ;;
          esac

      - name: Build documentation
        working-directory: "{{COMPONENT_PREFIX}}."
        # typedoc exits 4 on validation warnings. When relaxed, still publish —
        # the PR's Docs job is the gate, this is the deploy.
        #
        # The relaxed branch used to be `npx typedoc || echo "publishing anyway"`,
        # which could never work. "Publish the site it produced anyway" assumed
        # typedoc produces a site and then reports; it does not.
        # treatValidationWarningsAsErrors makes it ABORT before writing anything,
        # so swallowing the exit code left nothing to publish and
        # publish-docs.sh correctly refused with "'docs-site' is not a directory
        # — nothing was built". Every run of this workflow on a relaxed project
        # failed that way, from the day it shipped.
        #
        # Measured on a real project: escalation on -> exit 4, no docs-site;
        # escalation off -> exit 0, a full site, and all 930 warnings still
        # printed. So turn the escalation OFF for the relaxed build rather than
        # ignoring a failure after the fact — the warnings stay visible either
        # way, and there is something to deploy.
        run: |
          set -euo pipefail
          if [ "${{ steps.relax.outputs.state }}" = "relaxed" ]; then
            npx typedoc --treatValidationWarningsAsErrors false
          else
            npx typedoc
          fi

      - name: Publish to gh-pages/api
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-docs.sh api "{{COMPONENT_PREFIX}}docs-site"

      - name: Link the published site
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "### Documentation published"
            echo ""
            echo "https://${owner}.github.io/${repo}/api/"
            echo ""
            echo "If that 404s, Pages is not serving this branch yet — set"
            echo "Settings → Pages → Source to *Deploy from a branch*, gh-pages, / (root)."
          } >> "$GITHUB_STEP_SUMMARY"
