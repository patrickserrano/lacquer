name: Web Docs

# Publishes the TypeDoc site to https://<owner>.github.io/<repo>/api/.
#
# Validation lives in web-ci.yml's `Docs` job — branch protection points at a
# single required check (CI OK), and a job in another workflow cannot be one of
# its `needs`. This workflow only publishes what CI already proved builds clean.

on:
  workflow_dispatch:
  schedule:
    # Overnight. Publishing docs is never urgent; the work that queues behind it
    # is. 03:00 UTC clears before the 07:00 / 08:00 / 09:00 dailies start.
    - cron: '0 3 * * *'

permissions:
  contents: write # scripts/publish-docs.sh pushes the gh-pages branch

# Shared with every other stack's docs workflow in this repo so two stacks never
# push gh-pages concurrently. Never cancel — a cancelled publish leaves the
# branch without this commit's docs and nothing retries it.
concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  # A cheap gate on a hosted runner, so the expensive job never starts when the
  # published docs already match the source.
  #
  # A job-level `if` rather than per-step conditions: a skipped job never
  # occupies a runner at all. That is the whole point for iOS, where the build
  # takes ~38 minutes on the fleet's ONE self-hosted Mac and everything else —
  # CI, releases — queues behind it.
  publish:
    name: Build and publish TypeDoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: the staleness check below asks for the last commit
          # that touched this component; a depth-1 clone reports none and
          # would skip forever.
          fetch-depth: 0

      - id: stale
        run: |
          set -euo pipefail
          current=$(git log -1 --format=%H -- "{{COMPONENT_PREFIX}}" || true)
          if [ -z "$current" ]; then
            echo "No commits touching this component — nothing to publish."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          published=""
          if git fetch --quiet --depth 1 origin gh-pages 2>/dev/null; then
            # A missing file, a missing branch and a first-ever run all land here
            # and all mean "publish". That is the safe direction: a spurious
            # build costs runner time, a spurious skip serves stale docs
            # indefinitely with nothing reporting it.
            published=$(git show FETCH_HEAD:api/.docs-source 2>/dev/null || true)
          fi

          if [ "$current" = "$published" ]; then
            echo "Published docs are already built from $current — skipping."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Source at $current, published at ${published:-<none>} — rebuilding."
            {
              echo "needed=true"
              echo "sha=$current"
            } >> "$GITHUB_OUTPUT"
          fi

      # BEFORE setup-node, not after. `cache: pnpm` asks setup-node to locate the
      # pnpm store, which it does by running pnpm — so pnpm has to exist first.
      # Reversed, the run fails with "Unable to locate executable file: pnpm",
      # which reads like a missing dependency rather than an ordering mistake.
      #
      # No `version:` here on purpose: pnpm/action-setup reads the
      # `packageManager` field from package.json, so the version CI uses and the
      # version a developer's corepack uses are the same string in one place. A
      # version pinned here as well would be a second source of truth, and the
      # two would drift silently — CI resolving one tree and the developer
      # another is precisely the class of bug a lockfile exists to prevent.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.stale.outputs.needed == 'true'
        with:
          # The action reads `packageManager` from the REPO ROOT package.json by
          # default. A component in a subdirectory keeps its package.json there,
          # so without this the action reads the wrong file — or no file — and
          # the version pin silently stops applying.
          package_json_file: "{{COMPONENT_PREFIX}}package.json"

      - uses: actions/setup-node@v7.0.0
        if: steps.stale.outputs.needed == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "{{COMPONENT_PREFIX}}pnpm-lock.yaml"

      - run: pnpm install --frozen-lockfile
        if: steps.stale.outputs.needed == 'true'
        working-directory: "{{COMPONENT_PREFIX}}."

      # Unlike DocC, TypeDoc emits relative asset URLs, so the site works at any
      # depth and needs no base-path setting to match the /api/ subdirectory.
      # Honour [baseline.relax] documentation, exactly as the CI Docs job and the
      # local hooks do. This workflow did NOT, so a project with a valid,
      # unexpired relaxation went green on its PR and then failed on main the
      # moment it merged — which is precisely the "a lot of failures on main"
      # symptom. Third place this same relaxation had to be taught.
      - name: Read the documentation relaxation
        if: steps.stale.outputs.needed == 'true'
        id: relax
        run: |
          set -euo pipefail
          state=$(scripts/docs-relaxation.sh .lacquer.toml 2>/dev/null || echo none)
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          case "$state" in
            expired)   echo "::error::The documentation relaxation in .lacquer.toml has expired."; exit 1 ;;
            malformed) echo "::error::The [baseline.relax] documentation entry is malformed."; exit 1 ;;
            relaxed)   echo "::warning::Documentation is relaxed — publishing what builds, not gating on completeness." ;;
          esac

      - name: Build documentation
        if: steps.stale.outputs.needed == 'true'
        working-directory: "{{COMPONENT_PREFIX}}."
        # typedoc exits 4 on validation warnings. When relaxed, still publish —
        # the PR's Docs job is the gate, this is the deploy.
        #
        # The relaxed branch used to be `npx typedoc || echo "publishing anyway"`,
        # which could never work. "Publish the site it produced anyway" assumed
        # typedoc produces a site and then reports; it does not.
        # treatValidationWarningsAsErrors makes it ABORT before writing anything,
        # so swallowing the exit code left nothing to publish and
        # publish-docs.sh correctly refused with "'docs-site' is not a directory
        # — nothing was built". Every run of this workflow on a relaxed project
        # failed that way, from the day it shipped.
        #
        # Measured on a real project: escalation on -> exit 4, no docs-site;
        # escalation off -> exit 0, a full site, and all 930 warnings still
        # printed. So turn the escalation OFF for the relaxed build rather than
        # ignoring a failure after the fact — the warnings stay visible either
        # way, and there is something to deploy.
        run: |
          set -euo pipefail
          if [ "${{ steps.relax.outputs.state }}" = "relaxed" ]; then
            # The LOCAL binary, not `npx typedoc`: npx downloads an arbitrary
            # version when the project has none, so a project missing typedoc
            # still publishes docs built by whatever npm served that minute.
            # The doctor probes have always named the local path; the workflow
            # had not, so the two disagreed about what was even being run.
            ./node_modules/.bin/typedoc --treatValidationWarningsAsErrors false
          else
            ./node_modules/.bin/typedoc
          fi

      - name: Publish to gh-pages/api
        if: steps.stale.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_SOURCE_SHA: ${{ steps.stale.outputs.sha }}
        run: scripts/publish-docs.sh api "{{COMPONENT_PREFIX}}docs-site"

      - name: Link the published site
        if: steps.stale.outputs.needed == 'true'
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "### Documentation published"
            echo ""
            echo "https://${owner}.github.io/${repo}/api/"
            echo ""
            echo "If that 404s, Pages is not serving this branch yet — set"
            echo "Settings → Pages → Source to *Deploy from a branch*, gh-pages, / (root)."
          } >> "$GITHUB_STEP_SUMMARY"
