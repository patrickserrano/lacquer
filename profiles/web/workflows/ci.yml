name: Web CI

# Web work runs on GitHub-hosted runners (no Apple toolchain). Assumes the
# component's package.json defines: typecheck, test:coverage, build.

on:
  workflow_dispatch:
  pull_request:
    # No path filter on purpose: the workflow must run on EVERY PR so the single
    # required check (CI OK) always reports. A path-filtered workflow that doesn't
    # run leaves required checks stuck "pending" and blocks docs-only PRs (forcing
    # an admin bypass). The heavy `check` job is instead gated at the job level via
    # the `changes` job's `code` output. Mirrors the iOS profile.
    branches: [main, develop, 'feat/*', 'fix/*']
  push:
    branches: [main]
    paths:
      - "{{COMPONENT_PREFIX}}**"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    # Pure git diff — no toolchain — so it always runs and lets CI OK report even
    # on docs-only PRs where the heavy check is skipped.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        name: Check for code changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push / manual dispatch: treat as a code change so the check job runs.
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Three-dot: against the merge base, not the base branch tip. Two-dot
          # folds in whatever landed on main after the PR opened, so a docs-only
          # PR starts reporting code changes and wakes the heavy Mac jobs.
          changed="$(git diff --name-only "$base...$head")"
          # `code` gates the heavy check job: run it unless the PR is docs-only, so
          # CI OK still reports green on docs PRs (no admin bypass). This is an
          # INVERTED deny-list (any non-docs change -> code=true) on purpose: a path
          # ALLOWLIST anchored on {{COMPONENT_PREFIX}} produces the regex `^(|...)`
          # for a root-layout project (empty prefix) — an empty ERE alternative that
          # some greps reject. The deny-list has no prefix and no empty alternative,
          # so it is layout-independent and fails safe (over-run, not under-run). It
          # is written portably (`-cv` count, no `-qv`) so it behaves the same on
          # this job's ubuntu GNU grep and on the self-hosted runner's ugrep.
          nondocs=$(echo "$changed" | grep -cvE '(\.md$|^docs/|^LICENSE$|^\.gitignore$)' || true)
          if [ "${nondocs:-0}" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint · Types · Test · Build
    runs-on: ubuntu-latest
    needs: changes
    # Skip on docs-only PRs. Skipped counts as passing for the CI OK aggregator.
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: "{{COMPONENT_PREFIX}}."
    # Per-project build-time secrets, from [project].build_env in .lacquer.toml.
    # Renders to nothing when that list is empty, which is the common case.
    #
    # This slot exists because its absence cost a project the whole workflow:
    # pixelfoxstudio.com's `npm run build` statically collects page data and
    # throws without NEXT_PUBLIC_SANITY_*, so the shared job could never build
    # it. With nowhere to name five secrets, the only escape was
    # [project].exclude on this entire file — opting out of the shared CI to add
    # five lines, then hand-carrying a full copy that drifts every time this one
    # changes. An escape hatch that wide means the shared asset was missing a
    # seam, not that the project was unusual.
{{WEB_BUILD_ENV}}
    steps:
      - uses: actions/checkout@v7.0.1

      # BEFORE setup-node, not after. `cache: pnpm` asks setup-node to locate the
      # pnpm store, which it does by running pnpm — so pnpm has to exist first.
      # Reversed, the run fails with "Unable to locate executable file: pnpm",
      # which reads like a missing dependency rather than an ordering mistake.
      #
      # No `version:` here on purpose: pnpm/action-setup reads the
      # `packageManager` field from package.json, so the version CI uses and the
      # version a developer's corepack uses are the same string in one place. A
      # version pinned here as well would be a second source of truth, and the
      # two would drift silently — CI resolving one tree and the developer
      # another is precisely the class of bug a lockfile exists to prevent.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # The action reads `packageManager` from the REPO ROOT package.json by
          # default. A component in a subdirectory keeps its package.json there,
          # so without this the action reads the wrong file — or no file — and
          # the version pin silently stops applying.
          package_json_file: "{{COMPONENT_PREFIX}}package.json"

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "{{COMPONENT_PREFIX}}pnpm-lock.yaml"

      - run: pnpm install --frozen-lockfile

      # Biome: format + lint in check mode (no writes).
      #
      # --error-on-warnings, because without it `biome ci` gates on ERRORS only
      # and every warning-severity rule prints and passes. The shipped
      # biome.json sets three deliberately (noExcessiveCognitiveComplexity,
      # noArrayIndexKey, useSemanticElements) and `recommended: true` brings
      # more (noNonNullAssertion among them) — measured: one repo was green here
      # with 11 warnings outstanding. That is the SwiftLint --strict story in a
      # different language: a warning nothing ever escalates is not a finding,
      # it is a comment.
      #
      # The lefthook pre-commit hook carries the same flag. Local and CI
      # disagreeing is the defect this repo keeps rediscovering.
      - name: Biome
        # The LOCAL binary, not `npx biome`. npx silently downloads and runs an
        # arbitrary biome when the project has none installed, so a project that
        # never added @biomejs/biome still gets a green Biome step — linted by
        # whatever version npm served that minute, against rules nobody chose.
        # sleevetap was in exactly that state: biome.json synced, biome absent
        # from every package.json, Biome step green, and only `lacquer doctor`
        # noticing that the check could not be running at all.
        #
        # This also removes a subtler version drift: with a local install npx
        # prefers it, so the two agreed by luck rather than by construction.
        run: ./node_modules/.bin/biome ci --error-on-warnings .

      - name: Type check
        run: pnpm run typecheck

      - name: Test (coverage)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      # Block only on CRITICAL advisories by default — transitive highs are often
      # unfixable; tighten to `high` (and/or add npm `overrides`) per project.
      - name: Dependency audit
        run: pnpm audit --audit-level=critical

      # Prove the checks above can actually FAIL. Everything else in this job
      # asks "does this project pass?"; doctor asks "would these checks notice
      # if it didn't?" — the question nobody was asking while `swiftlint --path`
      # (a removed flag), `DOCC_FLAGS` (silently ignored) and two npx-resolved
      # web probes all reported green over nothing.
      #
      # It runs HERE, in the job that already has the stack toolchain, because a
      # probe whose tool is missing is reported as a missing tool — correct, but
      # useless as a gate on a runner that was never going to have it.
      #
      # working-directory is pinned to the repo root: this job may default to a
      # component subdirectory, and .lacquer.toml lives at the root.
      - uses: actions/checkout@v7.0.1
        with:
          repository: patrickserrano/lacquer
          path: .lacquer-checkout
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .lacquer-checkout/go.mod
          cache-dependency-path: .lacquer-checkout/go.sum
      - name: Prove the checks can fail
        working-directory: .
        run: |
          set -euo pipefail
          if [ ! -f .lacquer.toml ]; then
            echo "::notice::No .lacquer.toml — this project is not lacquer-managed."
            exit 0
          fi
          (cd .lacquer-checkout && go build -o "$RUNNER_TEMP/lacquer" ./cmd/lacquer)
          LACQUER_ROOT="$PWD/.lacquer-checkout" "$RUNNER_TEMP/lacquer" doctor --profile web

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    # Same gate as `check`: a docs-only PR changes no export and builds no site.
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # BEFORE setup-node, not after. `cache: pnpm` asks setup-node to locate the
      # pnpm store, which it does by running pnpm — so pnpm has to exist first.
      # Reversed, the run fails with "Unable to locate executable file: pnpm",
      # which reads like a missing dependency rather than an ordering mistake.
      #
      # No `version:` here on purpose: pnpm/action-setup reads the
      # `packageManager` field from package.json, so the version CI uses and the
      # version a developer's corepack uses are the same string in one place. A
      # version pinned here as well would be a second source of truth, and the
      # two would drift silently — CI resolving one tree and the developer
      # another is precisely the class of bug a lockfile exists to prevent.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # The action reads `packageManager` from the REPO ROOT package.json by
          # default. A component in a subdirectory keeps its package.json there,
          # so without this the action reads the wrong file — or no file — and
          # the version pin silently stops applying.
          package_json_file: "{{COMPONENT_PREFIX}}package.json"

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: "{{COMPONENT_PREFIX}}pnpm-lock.yaml"

      # No `defaults.working-directory` on this job on purpose: .lacquer.toml and
      # scripts/ live at the REPO root while package.json lives in the component,
      # and a default would silently resolve the relaxation lookup against the
      # wrong directory — reading "no relaxation" for a project that has one.
      - name: Read the documentation relaxation
        id: relax
        run: |
          set -euo pipefail
          state=$(scripts/docs-relaxation.sh .lacquer.toml)
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          case "$state" in
            none)    echo "No documentation relaxation — enforcing." ;;
            relaxed) echo "::warning::Documentation checks are relaxed by [baseline.relax] in .lacquer.toml. They still run, but do not block." ;;
            expired) echo "::error::The documentation relaxation in .lacquer.toml has expired. Document the exports or extend the relaxation deliberately."; exit 1 ;;
            malformed)
              echo "::error::The [baseline.relax] documentation entry in .lacquer.toml is malformed. Both fields are required: documentation = { until = \"YYYY-MM-DD\", reason = \"why, with a tracking issue\" }."
              exit 1 ;;
            *) echo "::error::Unexpected relaxation state '$state'"; exit 1 ;;
          esac

      - run: pnpm install --frozen-lockfile
        working-directory: "{{COMPONENT_PREFIX}}."

      # One command covers both halves of the standard: TypeDoc's
      # `validation.notDocumented` asserts every export HAS a TSDoc comment, and
      # `invalidLink` asserts the links in those comments RESOLVE. See the
      # reasoning in typedoc.json for why validation warnings are escalated
      # rather than all warnings.
      - name: Documentation builds clean
        id: typedoc
        continue-on-error: ${{ steps.relax.outputs.state == 'relaxed' }}
        working-directory: "{{COMPONENT_PREFIX}}."
        run: ./node_modules/.bin/typedoc

      # continue-on-error reports a failed step as successful at the JOB level,
      # so an unrelaxed failure needs an explicit re-assertion or the gate leaks.
      - name: Enforce the result
        if: steps.relax.outputs.state != 'relaxed'
        run: |
          set -euo pipefail
          if [ "${{ steps.typedoc.outcome }}" != "success" ]; then
            echo "::error::Documentation checks failed and this project has no active [baseline.relax] documentation entry."
            exit 1
          fi
          echo "Documentation baseline met."

  drift:
    name: No lacquer drift
    # Pure Go + a git checkout — no stack toolchain — so it runs on a
    # GitHub-hosted runner rather than tying up the dedicated Mac.
    runs-on: ubuntu-latest
    # Always: a drifted hook or workflow is exactly the kind of change that
    # arrives in an otherwise docs-only PR, and it costs a minute.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      # lacquer is a public repo, so this needs no token.
      - uses: actions/checkout@v7.0.1
        with:
          repository: patrickserrano/lacquer
          path: .lacquer-checkout

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .lacquer-checkout/go.mod
          # Without this, the module cache restore probes the PROJECT root for
          # go.mod and warns on every run.
          cache-dependency-path: .lacquer-checkout/go.sum

      - name: Audit for drift
        run: |
          set -euo pipefail
          if [ ! -f .lacquer.toml ]; then
            echo "::notice::No .lacquer.toml — this project is not lacquer-managed."
            exit 0
          fi
          if [ ! -f .lacquer.lock ]; then
            # Without a lock baseline, audit cannot tell "the project edited this"
            # from "the lacquer moved on", so every unit reads as untracked and
            # nothing can block. Say so instead of reporting a green pass.
            echo "::warning::No .lacquer.lock — this project has never been synced, so drift cannot be attributed. Run \`lacquer sync\` to establish the baseline."
          fi
          # Build from INSIDE the checkout. `go build ./.lacquer-checkout/cmd/lacquer`
          # from the project root fails with "go.mod file not found in current
          # directory or any parent directory" — a Go package path is resolved
          # against the current MODULE, and a Swift/TS project root is not one.
          # This job therefore failed in every repo, on every PR, for a reason that
          # had nothing to do with drift.
          (cd .lacquer-checkout && go build -o /tmp/lacquer ./cmd/lacquer)

          set +e
          LACQUER_ROOT="$PWD/.lacquer-checkout" /tmp/lacquer audit
          code=$?
          set -e

          case "$code" in
            0) echo "No drift." ;;
            3) echo "::error::A lacquer-managed file was edited in this project. These files are rendered from the lacquer, so a local edit silently diverges from what every other project gets — which is how a pre-commit hook ends up weaker than CI. Fix it in the lacquer repo and re-sync, or, if this project genuinely owns the file, add it to [project].exclude in .lacquer.toml so the lacquer stops managing it."
               exit 1 ;;
            4) echo "::error::The project baseline is not met. See the audit output above."
               exit 1 ;;
            # Detection ran once, at `lacquer init`, and never again — so a
            # project that grew a stack afterwards was unmanaged for it forever,
            # with nothing reporting the gap: no hooks, no CI, no error. `audit`
            # re-detects on every run now, and this is what makes that visible on
            # the PR that introduces the stack rather than a year later.
            6) echo "::error::This project runs a stack .lacquer.toml does not declare, so nothing gates it — no hooks, no CI, no CLAUDE region. Run \`lacquer adopt\` to record it and re-sync, or add the path to [project].exclude if the project deliberately keeps it unmanaged."
               exit 1 ;;
            *) echo "::error::lacquer audit failed (exit $code)."
               exit 1 ;;
          esac

  ci-ok:
    name: CI OK
    # Just aggregates the needs[] results — no toolchain — so it always runs and
    # always reports. This is the single required status check (branch protection
    # points at "CI OK", not at the check job), so it never gets stuck "pending"
    # on a docs-only PR where the check job skips. Fails only if a required job
    # actually FAILED or was CANCELLED; a skipped job counts as OK.
    runs-on: ubuntu-latest
    needs: [changes, check, docs, drift]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Verify required jobs passed (or were skipped)
        run: |
          echo "changes=${{ needs.changes.result }} check=${{ needs.check.result }} docs=${{ needs.docs.result }} drift=${{ needs.drift.result }}"
          for r in \
            "${{ needs.changes.result }}" \
            "${{ needs.check.result }}" \
            "${{ needs.docs.result }}" \
            "${{ needs.drift.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass (result=$r)"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
