# Git hooks (lefthook). Install once with `{{WEB_EXEC}} lefthook install`.
# Assumes the project package.json defines: typecheck, test, test:coverage, build.
#
# `root: "{{COMPONENT_PREFIX}}"` scopes each command to its component. For a
# nested layout it renders `root: "ios/"`: lefthook cds into that directory (so a
# component with no ROOT package.json still finds its own) and filters
# {staged_files} to that subtree, cutting the prefix — so a commit that doesn't
# touch the component skips these hooks. For a root layout it renders `root: ""`,
# which lefthook treats as the repo root with no file filtering. The secrets scan
# is intentionally NOT scoped: the shared script reads the full staged set itself.

# A component with a turbo.json is a pnpm workspace holding more than one app.
# Each of the three commands below dispatches through turbo exactly as the
# `check` job in web-ci.yml does, so the hook covers every package CI covers.
# Without this the hook checks the component's own package.json alone and is
# silently weaker than CI in a monorepo — the local/CI split this repo keeps
# rediscovering, in the direction that looks green locally and fails on push.
#
# `./node_modules/.bin/turbo`, never `pnpm exec turbo`: see the resolver-dispatch
# ban in internal/shipped/shipped_test.go.

pre-commit:
  parallel: false
  commands:
    # Format + lint staged files with Biome and re-stage the fixes.
    biome:
      root: "{{COMPONENT_PREFIX}}"
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      # --error-on-warnings mirrors the CI `Lint` step. Without it the hook
      # gates on errors only, so a warning-severity violation is committed
      # locally and rejected by CI — the local/CI split this repo keeps finding.
      #
      # The LOCAL binary for the same reason. `npx biome` downloads a version
      # when the project has none, so the hook would pass using whatever npm
      # served while CI — which now calls the local path — fails. That is the
      # same split one layer down, and the harder one to diagnose because the
      # developer's machine is the one that looks fine.
      run: ./node_modules/.bin/biome check --write --error-on-warnings --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      root: "{{COMPONENT_PREFIX}}"
      run: |
        if [ -f turbo.json ]; then
          ./node_modules/.bin/turbo run typecheck
        else
          {{WEB_RUN}} typecheck
        fi
    # Scan every staged file for hardcoded secrets — repo-wide, not component-
    # scoped: check-secrets.sh reads `git diff --cached` itself (no root, no
    # {staged_files}). Mirrors the iOS profile's `no-secrets` pre-commit hook.
    secrets:
      run: scripts/check-secrets.sh

    # BRIDGE TO THE iOS PROFILE'S HOOKS. A repo with both an iOS and a
    # web/supabase component carries `.pre-commit-config.yaml` AND this file,
    # and `pre-commit install` and `lefthook install` each overwrite
    # `.git/hooks/pre-commit`. Only one wins, so half the gates silently vanish
    # — and every signal a human checks says the repo is healthy, because a hook
    # exists and commits do get gated. Worse, the answer flips whenever somebody
    # re-runs an install for unrelated reasons.
    #
    # Resolution: lefthook owns `.git/hooks` and calls pre-commit from here, so
    # one installed hook runs both rule sets. Byte-identical in the web and
    # supabase fragments on purpose — the merge keeps one copy of a command two
    # profiles ship the SAME way, so an ios+web+supabase repo bridges once, not
    # twice.
    #
    # `commit-msg` needs no bridge: the iOS `conventional-commit` hook and this
    # file's `conventional` command both run scripts/check-commit-msg.sh, so
    # whichever manager owns that hook runs the identical check.
    #
    # No `root:` — the iOS hooks carry their own `files:` patterns and filter
    # the staged set themselves.
    ios-pre-commit:
      run: |
        # No iOS component here: nothing to bridge, and this must not fail a
        # single-stack web/supabase repo.
        [ -f .pre-commit-config.yaml ] || exit 0
        if ! command -v pre-commit >/dev/null 2>&1; then
          echo "lefthook owns .git/hooks in this mixed repo and bridges to pre-commit," >&2
          echo "but pre-commit is not installed, so the iOS gates (SwiftLint, SwiftFormat," >&2
          echo "secret scan) would run on nothing. Install it: brew install pre-commit" >&2
          exit 1
        fi
        pre-commit run --hook-stage pre-commit --files {staged_files}

pre-push:
  parallel: true
  commands:
    test:
      root: "{{COMPONENT_PREFIX}}"
      run: |
        if [ -f turbo.json ]; then
          ./node_modules/.bin/turbo run test
        else
          {{WEB_RUN}} test:coverage
        fi
    build:
      root: "{{COMPONENT_PREFIX}}"
      run: |
        if [ -f turbo.json ]; then
          ./node_modules/.bin/turbo run build
        else
          {{WEB_RUN}} build
        fi
    # The documentation baseline, and now the whole of it: this used to mirror a
    # `Docs` job in web-ci.yml, and that job is gone. Not at pre-commit: TypeDoc
    # reads the whole entry-point graph, so running it per staged file would be
    # both slow and wrong (an export documented in a file you didn't stage still
    # counts).
      # Honours [baseline.relax] documentation, as the CI job did. That was
      # first added because the LOCAL hook was otherwise stricter than CI — a
      # project with a valid, unexpired relaxation passed CI and could not push
      # — and it stays because a time-boxed exemption the tooling ignores is not
      # an exemption. Only `relaxed` skips: an expired or malformed entry runs
      # TypeDoc as normal, because the point of a time-boxed exemption is that
      # time runs out.
    docs:
      root: "{{COMPONENT_PREFIX}}"
      run: |
        state=$(scripts/docs-relaxation.sh .lacquer.toml 2>/dev/null || echo none)
        if [ "$state" = "relaxed" ]; then
          echo "docs: relaxed by [baseline.relax] in .lacquer.toml — skipping"
        else
          ./node_modules/.bin/typedoc
        fi
    # Mirrors the audit step in web-ci.yml's `check` job, at the same level.
    # Here rather than pre-commit because it hits the network.
    audit:
      root: "{{COMPONENT_PREFIX}}"
      run: {{WEB_AUDIT}}

commit-msg:
  commands:
    # Conventional Commits — the same shared check the iOS profile uses
    # (scripts/check-commit-msg.sh is synced from the lacquer core).
    conventional:
      run: scripts/check-commit-msg.sh {1}
