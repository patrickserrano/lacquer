# Self-tests for the web profile — see profiles/ios/doctor.toml for the contract:
# every probe feeds KNOWN-BAD input and asserts the check rejects it.
#
# Every probe here names its binary explicitly under {component}/node_modules/.bin
# and declares it in `requires`. Both are load-bearing, and the previous version
# of this file did neither.
#
# It ran `npx --no-install biome …` from the scratch directory. That directory has
# no node_modules, so npx resolved biome from whatever happened to be reachable —
# on a developer machine with Homebrew's biome, the GLOBAL binary rather than the
# version the project pins. On a machine without one, npx exits non-zero with
# "npx canceled due to missing packages" — and `expect = "fail"` reads any
# non-zero exit as "the check correctly rejected the bad input". A probe that
# reports OK precisely because the tool is missing is the exact defect doctor
# exists to catch, and it was sitting inside doctor.
#
# (It also tried to install `biome@0.3.3` — an unrelated package that owns the
# bare `biome` name on npm. The linter is `@biomejs/biome`.)
#
# `requires` closes it: a missing tool is reported as a missing tool whatever the
# probe expects. Exit codes below were observed against biome 2.5.3 and TypeDoc
# 0.28.20, not assumed.
#
# The three biome probes had a SECOND version of the same defect, and it survived
# the fix above. biome.json sets `vcs.useIgnoreFile: true` with no `vcs.root`, so
# biome looked for an ignore file beside the config, found none, and aborted:
# "Biome couldn't find an ignore file… Biome exited because the configuration
# resulted in errors." That is exit 1, and `expect = "fail"` reads any non-zero
# exit as "the check correctly rejected the bad input" — so all three reported OK
# without biome ever having linted the fixture. Measured in this exact probe
# shape (biome 2.5.5, scratch cwd, absolute --config-path): before, the run
# aborted and noExplicitAny never fired; after `vcs.root` was added to the
# shipped biome.json, the abort is gone and the fixture is rejected on
# noExplicitAny, which is what the probe claims to be testing.
#
# A probe that reports OK because the tool never ran is the exact defect doctor
# exists to catch. That is now twice for this file; if a third arrives, the
# expect="fail" contract itself needs to assert WHY it failed, not just that it
# did.

[[probe]]
name = "biome ci rejects an error-severity lint violation"
why = """
`./node_modules/.bin/biome ci .` is the lint gate in web-ci.yml. A config that fails to load, a
rules block that stops matching, or a severity quietly dropped all show up as a
green run over unlinted code. noExplicitAny is "error" in the shipped
biome.json, so this fixture must be rejected. Observed: exit 1.
"""
file = "probe.ts"
content = """
export const value: any = 1
"""
requires = ["{component}/node_modules/.bin/biome"]
argv = ["{component}/node_modules/.bin/biome", "ci", "--error-on-warnings", "--config-path", "{component}", "{dir}"]
expect = "fail"

[[probe]]
name = "biome ci rejects a WARNING-severity violation"
why = """
Plain `biome ci` gates on error-severity rules only. Every warning-severity rule
— the three this config sets deliberately (noExcessiveCognitiveComplexity,
noArrayIndexKey, useSemanticElements) plus the ones `recommended: true` brings,
like noNonNullAssertion — printed and passed. One repo was green with 11
warnings outstanding. `--error-on-warnings` in web-ci.yml and lefthook.yml is
what closes that, and this probe is what proves the flag is still there and
still doing something.

The fixture is deliberately warning-ONLY: it exits 0 without the flag and 1 with
it (observed). A fixture that also trips an error-severity rule would be
rejected either way and would prove nothing about the flag — the same mistake
the ios line-length probe made by exceeding the error threshold.
"""
file = "probe.ts"
content = """
const maybe: string | undefined = process.env.HOME
export const value = maybe!
"""
requires = ["{component}/node_modules/.bin/biome"]
argv = ["{component}/node_modules/.bin/biome", "ci", "--error-on-warnings", "--config-path", "{component}", "{dir}"]
expect = "fail"

[[probe]]
name = "biome ci rejects unformatted code"
why = """
The formatter half of `biome ci` is separately losable: `formatter.enabled`
false, or a lint-only invocation, leaves the linter gating while formatting
silently stops being checked. A formatter check that accepts anything is
indistinguishable from no check. Observed: exit 1 on wrong spacing and quote
style.
"""
file = "probe.ts"
content = """
export const value   =    "double quoted and badly spaced"
"""
requires = ["{component}/node_modules/.bin/biome"]
argv = ["{component}/node_modules/.bin/biome", "ci", "--error-on-warnings", "--config-path", "{component}", "{dir}"]
expect = "fail"

[[probe]]
name = "TypeDoc can parse the shipped typedoc.json"
why = """
typedoc.json carries fourteen lines of comments explaining why each validation
key is set. JSON proper has no comments — if TypeDoc's parser rejected them,
every docs build in every web project would break on a config the lacquer
distributes. That was asserted and never verified: the command meant to check it
hung for three days on a `cp -i` prompt and was killed without ever running.
Observed: TypeDoc 0.28 accepts the comments and exits 0 on a documented export.
"""
file = "probe.ts"
content = """
/** A documented export, so `notDocumented` has nothing to report. */
export const answer = 42
"""
requires = ["{component}/node_modules/.bin/typedoc"]
argv = ["sh", "-c", """
set -e
printf '%s' '{"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"bundler","strict":true},"include":["probe.ts"]}' > tsconfig.json
exec {component}/node_modules/.bin/typedoc --options {component}/typedoc.json --entryPoints ./probe.ts --out ./out --tsconfig ./tsconfig.json
"""]
expect = "pass"

[[probe]]
name = "TypeDoc rejects an undocumented export"
why = """
`validation.notDocumented` plus `treatValidationWarningsAsErrors` is what makes
the Docs job a standard rather than a site generator. Drop either and TypeDoc
happily renders a page of bare signatures and exits 0 — a docs gate that has
stopped gating looks exactly like one that is passing. Observed: exit 4, "does
not have any documentation".
"""
file = "probe.ts"
content = """
export const undocumented = 1
"""
requires = ["{component}/node_modules/.bin/typedoc"]
argv = ["sh", "-c", """
set -e
printf '%s' '{"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"bundler","strict":true},"include":["probe.ts"]}' > tsconfig.json
exec {component}/node_modules/.bin/typedoc --options {component}/typedoc.json --entryPoints ./probe.ts --out ./out --tsconfig ./tsconfig.json
"""]
expect = "fail"

[[probe]]
name = "a relaxed docs build still produces a site"
why = """
The relaxed branch of web-docs.yml used to be `typedoc || echo "publishing
anyway"`. It could never work: treatValidationWarningsAsErrors makes TypeDoc
ABORT before writing docs-site, so swallowing the exit code left nothing to
publish and publish-docs.sh refused with "'docs-site' is not a directory —
nothing was built". Every run on a relaxed project failed that way from the day
it shipped, and the comment above it asserted the opposite.

This probe is the assertion that was missing: an UNDOCUMENTED export — the exact
input a relaxation exists to tolerate — must still yield a directory. Re-escalate
validation on the relaxed path and this goes red. Observed: exit 0, 4 entries.
"""
file = "probe.ts"
content = """
export const undocumented = 1
"""
requires = ["{component}/node_modules/.bin/typedoc"]
argv = ["sh", "-c", """
set -e
printf '%s' '{"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"bundler","strict":true},"include":["probe.ts"]}' > tsconfig.json
{component}/node_modules/.bin/typedoc --options {component}/typedoc.json --entryPoints ./probe.ts --out ./out --tsconfig ./tsconfig.json --treatValidationWarningsAsErrors false
test -d ./out
"""]
expect = "pass"

[[probe]]
name = "the shipped biome.json uses no deprecated configuration"
why = """
biome.json set `"recommended": true`, which Biome deprecated: "will be removed
in the next major version. Use preset instead." It reports at INFO severity, so
`biome ci` exits 0 and nothing anywhere said a word — the config would simply
have stopped loading at Biome 3, in every web project at once, on a routine
dependency bump.

The fix was `"preset": "recommended"`. Verified behaviour-preserving before
shipping: a fixture tripping six distinct rules produced byte-identical findings
under both spellings.

This probe is the general form — it fails on ANY deprecation Biome reports for
the synced config, so the next one surfaces while it is still a warning rather
than when it becomes a breakage. It lints the config file directly: passing
--config-path instead suppresses the diagnostic, because the config is then not
part of the file set being checked (which is how this probe first appeared to
pass against a config that was in fact deprecated).
"""
requires = ["{component}/node_modules/.bin/biome"]
argv = ["sh", "-c", "cd {component} && ! ./node_modules/.bin/biome check biome.json 2>&1 | grep -q DEPRECATED"]
expect = "pass"
