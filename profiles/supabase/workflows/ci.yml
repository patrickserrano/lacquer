name: Supabase CI

# Deno backend — runs on GitHub-hosted runners (no Apple toolchain to worry
# about). Previously routed to the fleet's self-hosted Synology/Pi, but both
# proved too weak for this profile's workloads (see the lint-database job
# below) and the fleet-wide self-hosted Linux experiment was abandoned.

on:
  workflow_dispatch:
  pull_request:
    # No path filter on purpose: the workflow must run on EVERY PR so the single
    # required check (CI OK) always reports. A path-filtered workflow that doesn't
    # run leaves required checks stuck "pending" and blocks docs-only PRs (forcing
    # an admin bypass). The heavy `check` job is instead gated at the job level via
    # the `changes` job's `code` output. Mirrors the iOS profile.
    branches: [main, develop, 'feat/*', 'fix/*']
  push:
    branches: [main]
    paths:
      - "{{COMPONENT_PREFIX}}**"

permissions:
  contents: read

concurrency:
  group: supabase-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    # Always runs — a diff, plus (only when the `lacquer` filter fires) the drift
    # audit folded in at the end — so CI OK still reports on docs-only PRs where
    # the heavy jobs are skipped.
    runs-on: ubuntu-latest
    # Bounded because this job now builds and runs `lacquer audit` when the
    # `lacquer` filter fires; it used to be a diff and nothing else.
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      db: ${{ steps.filter.outputs.db }}
      lacquer: ${{ steps.filter.outputs.lacquer }}
      # Empty when the drift audit below did not run; `pass` or `fail` when it did.
      drift: ${{ steps.drift.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        name: Check for code changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push / manual dispatch: treat as a code change so the check job
            # runs. `lacquer` is unconditionally true here on purpose — a push to
            # main is the backstop that catches the drift a PR gate cannot see
            # (an exclusion or baseline relaxation whose expiry simply passed).
            # `db` is unconditionally true here too, and for a load-bearing
            # reason rather than symmetry: `deploy-database` needs [check,
            # lint-database, test-database], and a skipped need skips it. A push
            # that gated `db` on paths could therefore skip the deploy of a
            # migration this very push added. The `push:` trigger already carries
            # a `paths:` filter on the component, so this is not the unbounded
            # case it looks like.
            {
              echo "code=true"
              echo "db=true"
              echo "lacquer=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Three-dot: against the merge base, not the base branch tip. Two-dot
          # folds in whatever landed on main after the PR opened, so a docs-only
          # PR starts reporting code changes and wakes the heavy Mac jobs.
          changed="$(git diff --name-only "$base...$head")"
          # `code` gates the heavy check job: run it unless the PR is docs-only, so
          # CI OK still reports green on docs PRs (no admin bypass). This is an
          # INVERTED deny-list (any non-docs change -> code=true) on purpose: a path
          # ALLOWLIST anchored on {{COMPONENT_PREFIX}} produces the regex `^(|...)`
          # for a root-layout project (empty prefix) — an empty ERE alternative that
          # some greps reject. The deny-list has no prefix and no empty alternative,
          # so it is layout-independent and fails safe (over-run, not under-run). It
          # is written portably (`-cv` count, no `-qv`) so it behaves the same on
          # this job's ubuntu GNU grep and on the self-hosted runner's ugrep.
          nondocs=$(echo "$changed" | grep -cvE '(\.md$|^docs/|^LICENSE$|^\.gitignore$)' || true)
          if [ "${nondocs:-0}" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # `db` gates DB Lint (Splinter) and DB Tests (pgTAP). Both boot a full
          # local Supabase stack — Postgres plus ~8 auxiliary services — which is
          # ~3 minutes of billed runner each, twice per PR, so they are the two
          # most expensive jobs this profile has.
          #
          # They used to be gated on `code`, which is the INVERTED deny-list
          # above: true for anything that is not a `.md`, `docs/`, LICENSE or
          # .gitignore change. In a repo that carries a Supabase component
          # alongside an iOS or web one — which is most of this fleet's larger
          # projects — that means every pure-SwiftUI PR booted the whole stack
          # twice to lint a schema nobody touched. Measured on the two repos that
          # have this shape: 47 of 58 PR-triggered runs in one six-day window.
          #
          # So this is an ALLOWLIST, for the same reason `lacquer` below is one:
          # a deny-list wakes these jobs on nearly every PR, which is the cost
          # being removed. It is matched at any depth with `(^|/)` rather than
          # anchored on {{COMPONENT_PREFIX}} — see the `code` comment above for
          # why anchoring is the trap: an empty prefix produces the regex
          # `^(|...)`, an empty ERE alternative some greps reject. Written
          # portably (`-qE`, never `-qv`) so GNU grep and ugrep agree.
          #
          # Deliberately wider than the schema itself, because the two failure
          # modes are not symmetric: a false positive costs a few minutes, a
          # false negative silently stops testing the database. It covers every
          # input those two jobs actually consume:
          #   * everything under supabase/ at any depth — config.toml (the stack
          #     `supabase start` boots), migrations/ (the schema being linted),
          #     tests/ (the pgTAP suite), seed.sql, functions/;
          #   * any *.sql and any migrations/ or seed/ directory ANYWHERE, for a
          #     project that keeps schema outside supabase/;
          #   * .lacquer.toml, which holds the [baseline.relax] pgtap entry that
          #     decides whether an empty suite passes or fails — removing or
          #     expiring it flips test-database's verdict with no .sql touched;
          #   * scripts/, which is where docs-relaxation.sh (executed by the
          #     "Read the pgTAP relaxation" step) lives.
          #
          # Two entries are deliberately NARROWER than the `lacquer` filter's
          # equivalents, because a false positive here costs ~6 billed minutes
          # rather than one:
          #   * .github/workflows/supabase-, not all of .github/workflows/. sync
          #     writes each profile's workflows to `.github/workflows/<profile>-`,
          #     so this covers every workflow that could define or affect these
          #     jobs and excludes the ios-*/web-* ones that cannot. Measured: 4
          #     of 14 matching PRs in the sample window were Dependabot bumps
          #     touching iOS workflows only.
          #   * .lacquer.toml but not .lacquer.lock — the lock is the drift
          #     baseline and is read by `audit`, not by either DB job.
          db_paths='(^|/)supabase/|\.sql$|(^|/)migrations?/|(^|/)seeds?/|(^|/)\.lacquer\.toml$|(^|/)scripts/|(^|/)\.github/workflows/supabase-'
          if echo "$changed" | grep -qE "$db_paths"; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
          fi
          # `lacquer` gates the drift audit at the end of this job, which clones
          # the lacquer, sets up Go, builds the binary and runs `lacquer audit`.
          # That used to be a job of its own and so cost a whole billed minute
          # (Actions bills a one-minute MINIMUM per job) on a PR that cannot
          # possibly have drifted; it is now three steps here, and this filter is
          # what keeps them from running at all. Unlike `code` above this is an
          # ALLOWLIST: a source-only PR is not docs-only, so the deny-list shape
          # would keep waking the audit on nearly every PR, which is the cost
          # being removed.
          # It is deliberately WIDER than the set audit actually reads — a false
          # positive costs one minute, a false negative silently stops detecting
          # drift — and covers all three classes of audit input:
          #   1. every destination `lacquer sync` writes: the skills/commands/
          #      agents dirs (.claude, .codex, .agents), .github/**, scripts/**,
          #      the managed CLAUDE.md / AGENTS.md and .gitignore regions, and each profile's
          #      config files (.swiftlint.yml, biome.json, deno.jsonc, ...), which
          #      land under the component dir rather than the repo root;
          #   2. .lacquer.toml and .lacquer.lock, which drive every token, every
          #      exclusion and every baseline relaxation;
          #   3. the markers `audit` RE-DETECTS stacks from and the pbxproj the
          #      baseline check reads — audit exits 6 (undeclared stack) or 4
          #      (baseline violation) on those with no managed file touched at all.
          # Matched at any depth with `(^|/)` rather than anchored on the
          # component prefix, for the same reason the deny-list above carries no
          # prefix: an empty prefix produces the empty ERE alternative `^(|...)`
          # that some greps reject.
          lacquer_paths='(^|/)\.gitignore$|(^|/)\.lacquer\.(toml|lock)$|(^|/)(CLAUDE|AGENTS)\.md$|(^|/)\.(claude|codex|agents|github)/|(^|/)scripts/|(^|/)(Brewfile|lefthook\.yml|\.mcp\.json|\.pre-commit-config\.yaml)$|(^|/)(\.swiftlint\.yml|\.swiftlint-docs\.yml|\.swiftformat|Secrets\.xcconfig\.example)$|(^|/)(\.env\.schema|tsconfig\.base\.json|typedoc\.json|biome\.json|deno\.jsonc)$|(^|/)(package\.json|Cargo\.toml|go\.mod|Package\.swift|project\.yml)$|(^|/)supabase/config\.toml$|\.xcodeproj/'
          if echo "$changed" | grep -qE "$lacquer_paths"; then
            echo "lacquer=true" >> "$GITHUB_OUTPUT"
          else
            echo "lacquer=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- lacquer drift ----
      #
      # This used to be a separate `No lacquer drift` job. It is one checkout, a
      # Go build and one `lacquer audit` — a measured ~24s median across the
      # fleet — and Actions bills a MINIMUM OF ONE MINUTE PER JOB, so as its own
      # job it spent a whole billed minute on 24 seconds of work every time it
      # fired. Cost here is job COUNT, not job duration, so the only way to make
      # it cheaper is to stop it being a job. Folded in, it costs nothing at all
      # when `lacquer` is false, and shares this job's already-billed minute when
      # it is true — this job's own median is 13s, so the pair still lands inside
      # one minute on the large majority of runs.
      #
      # The trade-off, stated plainly: drift is no longer a separately-named
      # status check. That is safe only while no repo requires it BY NAME in
      # branch protection — checked across the whole fleet before this landed:
      # every protected repo requires "CI OK" (one legacy repo requires iOS job
      # names), none requires "No lacquer drift", and there are no rulesets at
      # repo or org level. If a repo ever does require it by name, this has to go
      # back to being its own job.
      #
      # The verdict leaves via an OUTPUT rather than by failing this job. Failing
      # `changes` would skip every job that `needs` it, so a drift finding would
      # suppress the lint/test results on the very PR you need them for. The
      # audit therefore never exits non-zero; `ci-ok` — the required check —
      # reads the output and fails on it.
      - name: Fetch the lacquer
        # lacquer is a public repo, so this needs no token.
        if: steps.filter.outputs.lacquer == 'true'
        uses: actions/checkout@v7
        with:
          repository: patrickserrano/lacquer
          path: .lacquer-checkout
        # continue-on-error on the two SETUP steps, not on the audit. Now that
        # this shares a job with the path filter, a GitHub-side hiccup fetching
        # the lacquer or restoring the Go cache must not take the whole workflow
        # down with it. The audit step below detects the missing toolchain and
        # reports a drift FAILURE — never a silent pass.
        continue-on-error: true

      - name: Set up Go for the audit
        if: steps.filter.outputs.lacquer == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: .lacquer-checkout/go.mod
          # Without this, the module cache restore probes the PROJECT root for
          # go.mod and warns on every run.
          cache-dependency-path: .lacquer-checkout/go.sum
        continue-on-error: true

      - name: Audit for drift
        id: drift
        if: steps.filter.outputs.lacquer == 'true'
        run: |
          # `-e` is deliberately absent: this step must never exit non-zero (see
          # the block comment above). `result` starts at `fail` and the EXIT trap
          # publishes whatever it holds, so every path that leaves this script
          # early is reported as a failure rather than as a silent pass.
          set -uo pipefail
          result=fail
          publish() { echo "result=$result" >> "$GITHUB_OUTPUT"; }
          trap publish EXIT

          if [ ! -f .lacquer.toml ]; then
            echo "::notice::No .lacquer.toml — this project is not lacquer-managed."
            result=pass
            exit 0
          fi
          if [ ! -f .lacquer-checkout/go.mod ] || ! command -v go >/dev/null 2>&1; then
            echo "::error::The drift audit could not be set up — the lacquer checkout or the Go toolchain is missing, so drift was NOT checked on this PR."
            exit 0
          fi
          if [ ! -f .lacquer.lock ]; then
            # Without a lock baseline, audit cannot tell "the project edited this"
            # from "the lacquer moved on", so every unit reads as untracked and
            # nothing can block. Say so instead of reporting a green pass.
            echo "::warning::No .lacquer.lock — this project has never been synced, so drift cannot be attributed. Run \`lacquer sync\` to establish the baseline."
          fi
          # Build from INSIDE the checkout. `go build ./.lacquer-checkout/cmd/lacquer`
          # from the project root fails with "go.mod file not found in current
          # directory or any parent directory" — a Go package path is resolved
          # against the current MODULE, and a Swift/TS project root is not one.
          if ! (cd .lacquer-checkout && go build -o "$RUNNER_TEMP/lacquer" ./cmd/lacquer); then
            echo "::error::Building lacquer failed, so drift was NOT checked on this PR."
            exit 0
          fi

          LACQUER_ROOT="$PWD/.lacquer-checkout" "$RUNNER_TEMP/lacquer" audit
          code=$?

          case "$code" in
            0) echo "No drift."; result=pass ;;
            3) echo "::error::A lacquer-managed file was edited in this project. These files are rendered from the lacquer, so a local edit silently diverges from what every other project gets — which is how a pre-commit hook ends up weaker than CI. Fix it in the lacquer repo and re-sync, or, if this project genuinely owns the file, add it to [project].exclude in .lacquer.toml so the lacquer stops managing it." ;;
            4) echo "::error::The project baseline is not met. See the audit output above." ;;
            # Detection ran once, at `lacquer init`, and never again — so a
            # project that grew a stack afterwards was unmanaged for it forever,
            # with nothing reporting the gap: no hooks, no CI, no error. `audit`
            # re-detects on every run now, and this is what makes that visible on
            # the PR that introduces the stack rather than a year later.
            6) echo "::error::This project runs a stack .lacquer.toml does not declare, so nothing gates it — no hooks, no CI, no CLAUDE region. Run \`lacquer adopt\` to record it and re-sync, or add the path to [project].exclude if the project deliberately keeps it unmanaged." ;;
            *) echo "::error::lacquer audit failed (exit $code)." ;;
          esac
          exit 0

  check:
    name: Format · Lint · Test
    runs-on: ubuntu-latest
    needs: changes
    # Skip on docs-only PRs. Skipped counts as passing for the CI OK aggregator.
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: "{{COMPONENT_PREFIX}}."
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check supabase/functions/*/index.ts

      - name: Test
        # `deno test` exits 1 with "No test modules found" on an empty set, so a
        # supabase component that has not written its first edge-function test
        # yet cannot pass CI at all — a new project has to fail before it can
        # succeed. That is the state momfriend was in; the fmt step happened to
        # fail first, so this one never got the chance to report it.
        #
        # `--permit-no-files` alone would fix that by making zero tests pass
        # silently, which is the "check that cannot fail" defect this profile
        # exists to prevent. So permit the empty set AND say so out loud: the
        # project stays unblocked, and nobody mistakes green for tested.
        run: |
          set -euo pipefail
          count=$(find supabase/functions \
            \( -name '*_test.ts' -o -name '*.test.ts' \) | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::warning::No Deno tests found under supabase/functions/ — edge functions are shipping untested."
          fi
          deno test --allow-all --permit-no-files supabase/functions/

      # Prove the checks above can actually FAIL. Everything else in this job
      # asks "does this project pass?"; doctor asks "would these checks notice
      # if it didn't?" — the question nobody was asking while `swiftlint --path`
      # (a removed flag), `DOCC_FLAGS` (silently ignored) and two npx-resolved
      # web probes all reported green over nothing.
      #
      # It runs HERE, in the job that already has the stack toolchain, because a
      # probe whose tool is missing is reported as a missing tool — correct, but
      # useless as a gate on a runner that was never going to have it.
      #
      # working-directory is pinned to the repo root: this job may default to a
      # component subdirectory, and .lacquer.toml lives at the root.
      - uses: actions/checkout@v7
        with:
          repository: patrickserrano/lacquer
          path: .lacquer-checkout
      - uses: actions/setup-go@v7
        with:
          go-version-file: .lacquer-checkout/go.mod
          cache-dependency-path: .lacquer-checkout/go.sum
      - name: Prove the checks can fail
        working-directory: .
        run: |
          set -euo pipefail
          if [ ! -f .lacquer.toml ]; then
            echo "::notice::No .lacquer.toml — this project is not lacquer-managed."
            exit 0
          fi
          (cd .lacquer-checkout && go build -o "$RUNNER_TEMP/lacquer" ./cmd/lacquer)
          LACQUER_ROOT="$PWD/.lacquer-checkout" "$RUNNER_TEMP/lacquer" doctor --profile supabase

  lint-database:
    name: DB Lint (Splinter)
    # CLAUDE.supabase.md calls RLS "the security boundary" — Splinter (supabase db
    # lint) is what actually enforces it in CI, catching missing-RLS and
    # security-definer issues the Edge-Function checks never see.
    #
    # GitHub-hosted, like every job in this file. Called out here because this
    # is the job that ended the fleet's self-hosted Linux experiment, and the
    # measurement below is what should stop anyone from retrying it:
    #
    #   * Synology (x64) -- too weak to boot the full local Supabase stack
    #     (Postgres plus ~8 auxiliary services) inside `supabase start`'s own
    #     timeout. Measured on PixelFoxStudio/rail: "Starting database..." ran
    #     ~145s before it gave up with ECONNREFUSED. A cold-start cost, not a
    #     networking bug -- confirmed by the container still being
    #     mid-migration, not crashed or unreachable, when it was killed.
    #   * Raspberry Pi (arm64) -- tried next, also not viable. On rail it got
    #     further (containers coming up rather than refusing) but was killed by
    #     the job's own 10-minute timeout while still inside `Start local
    #     stack`, having never reached the lint step.
    #
    # Two boxes, same wall: the stack is simply too large for either, and
    # slower-but-arm64 did not help. So the experiment was abandoned
    # fleet-wide -- too weak for the heavier profiles' actual workloads to be
    # worth the operational cost of running it. A red CI that cannot run is
    # worth less than a small bill.
    runs-on: ubuntu-latest
    needs: changes
    # `db`, not `code`. `code` is the deny-list — true for any non-docs change —
    # so in a repo that carries a Supabase component next to an iOS or web one
    # this booted the whole stack on every Swift PR. See the `db` filter in the
    # changes job for the allowlist and why it is shaped the way it is.
    if: needs.changes.outputs.db == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "{{COMPONENT_PREFIX}}."
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Boots Postgres + applies migrations; a broken migration fails here (desired).
      - name: Start local stack
        run: supabase start

      - name: Lint database schema
        run: supabase db lint --level warning

      # `supabase start`'s containers are created on the RUNNER'S Docker host,
      # not scoped to this job's own lifecycle -- on a GitHub-hosted runner
      # that host is a fresh, disposable VM, so nothing needed cleaning up. On
      # a self-hosted runner, every job shares the SAME long-lived Docker
      # daemon, so a stack left running collides with the next run of this
      # same job ("container name already in use"). always() so a failed
      # lint still tears the stack down -- otherwise the FIRST failure here
      # permanently wedges every run after it.
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

  test-database:
    name: DB Tests (pgTAP)
    # GitHub-hosted for the same reason as lint-database above: neither
    # self-hosted Linux box can boot the Supabase stack.
    runs-on: ubuntu-latest
    # Serialized after lint-database rather than running parallel on `changes`
    # alone. NOTE this is now vestigial: both jobs' `supabase start` create
    # identically-named containers (derived from the project, not randomized),
    # which was a real collision when they shared one self-hosted Docker host
    # ("Conflict. The container name ... is already in use", observed live) --
    # but on GitHub-hosted runners each job gets its own VM, so the names
    # cannot collide. Kept for now because dropping it changes scheduling for
    # every supabase project; it is safe to remove in its own change.
    needs: [changes, lint-database]
    # `!cancelled()`, not the bare code check alone: a job's custom `if:`
    # replaces the implicit `success()` GitHub adds by default, but ONLY when
    # the expression itself calls one of success()/failure()/cancelled()/
    # always() -- otherwise `success()` is implicitly ANDed back in, which
    # would skip this job whenever lint-database FAILS. That's not the
    # relationship intended here: lint-database is a `needs` purely to
    # SERIALIZE the two jobs' `supabase start` (see its comment above), not a
    # real "must pass first" gate -- a lint failure should not silently skip
    # the pgTAP suite too.
    #
    # Gated on `db` rather than `code` for the same reason as lint-database
    # above: `code` is the non-docs deny-list, and this job boots a full
    # Postgres stack.
    if: needs.changes.outputs.db == 'true' && !cancelled()
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "{{COMPONENT_PREFIX}}."
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local stack
        run: supabase start

      # This step used to echo "no pgTAP tests yet" and exit 0 on an empty
      # directory, which meant the job booted a full Postgres stack and reported
      # green having asserted nothing — for however many months it took someone
      # to notice. `supabase test db` exits 0 over a matchless glob all by
      # itself, so the emptiness has to be caught here or not at all.
      #
      # An empty suite is therefore a failure, with the same time-boxed escape
      # hatch every other baseline carries for a project that genuinely cannot
      # comply yet. RLS is this profile's security boundary and Splinter only
      # catches a *missing* policy — a wrong one is caught by a test or by
      # nobody, so "no tests" is a real finding rather than a neutral state.
      #
      # No `defaults.working-directory` applies to the relaxation step: the
      # manifest and scripts/ live at the REPO root while supabase/ lives in the
      # component, exactly as in the `docs` job below.
      - name: Read the pgTAP relaxation
        id: relax
        working-directory: "."
        run: |
          set -euo pipefail
          state=$(RELAX_KEY=pgtap scripts/docs-relaxation.sh .lacquer.toml)
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          case "$state" in
            none)    echo "No pgTAP relaxation — an empty suite fails." ;;
            relaxed) echo "::warning::pgTAP tests are relaxed by [baseline.relax] in .lacquer.toml. Write RLS tests before the date passes — an expired relaxation is a hard failure." ;;
            expired) echo "::error::The pgtap relaxation in .lacquer.toml has expired. Add pgTAP tests, or extend the relaxation deliberately."; exit 1 ;;
            malformed)
              echo "::error::The [baseline.relax] pgtap entry in .lacquer.toml is malformed. Both fields are required: pgtap = { until = \"YYYY-MM-DD\", reason = \"why, with a tracking issue\" }."
              exit 1 ;;
            *) echo "::error::Unexpected relaxation state '$state'"; exit 1 ;;
          esac

      - name: Run pgTAP tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The same glob pg_prove is handed, so this counts what would actually
          # run rather than what someone hoped was there.
          tests=(supabase/tests/*.sql)
          if (( ${#tests[@]} == 0 )); then
            if [ "${RELAX_STATE}" = "relaxed" ]; then
              echo "::warning::No pgTAP tests in supabase/tests/ — permitted by the time-boxed pgtap relaxation."
              exit 0
            fi
            echo "::error::No pgTAP tests in supabase/tests/ — this gate would pass vacuously. Add tests asserting RLS denies cross-user access, or add a time-boxed [baseline.relax] pgtap entry to .lacquer.toml."
            exit 1
          fi
          echo "Running ${#tests[@]} pgTAP test file(s)."
          supabase test db
        env:
          RELAX_STATE: ${{ steps.relax.outputs.state }}

      # See lint-database's identical step for why this exists on a
      # self-hosted runner and didn't on GitHub-hosted.
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

  deploy-database:
    name: Deploy migrations
    runs-on: ubuntu-latest
    # Only a merge to main, and only behind the schema jobs. `supabase db push`
    # is the one step here that touches production, so it must not be reachable
    # from a PR, and a migration must never land there without the lint and the
    # pgTAP suite having passed on it first — that ordering is the whole reason
    # this job lives in ci.yml rather than in a deploy workflow of its own,
    # which could not express `needs` across files.
    #
    # Those jobs are themselves gated on `changes`, so a docs-only push skips
    # them and skips this with them. That is correct: no migration, no deploy.
    needs: [check, lint-database, test-database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    # Never two at once. Concurrent pushes would race `db push` against the same
    # project, and a partially applied migration is not something re-running
    # fixes. Never cancel a run in progress either — cancelling mid-push is how
    # you get that half-applied state deliberately.
    concurrency:
      group: supabase-db-push
      cancel-in-progress: false
    defaults:
      run:
        working-directory: "{{COMPONENT_PREFIX}}."
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Skip rather than fail when the project has not wired deployment up. A
      # permanently red main is noise that trains you to stop reading the
      # Actions tab, which is precisely how a missing deploy goes unnoticed —
      # so this says so loudly, in the log and the job summary, and stays green.
      # Two ways to reach the remote database, because `db push` needs a real
      # Postgres connection and the two routes need different things:
      #
      #   SUPABASE_DB_URL      one secret, connects directly, no linking step
      #   TOKEN + REF + PASSWORD  links via the Management API, then pushes
      #
      # The db-url route is preferred where present: it is one secret instead of
      # three, and it removes the link step entirely, which is where a missing
      # database password otherwise surfaces as an interactive prompt that hangs
      # a runner rather than failing it.
      - name: Check deploy configuration
        id: cfg
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -n "$DB_URL" ]; then
            echo "route=db-url" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$TOKEN" ] && [ -n "$PROJECT_REF" ] && [ -n "$DB_PASSWORD" ]; then
            echo "route=linked" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "route=none" >> "$GITHUB_OUTPUT"
          echo "::warning::Migrations were NOT deployed — deployment is not configured."
          {
            echo "### Supabase migrations were not deployed"
            echo
            echo 'Set **either** a direct connection string:'
            echo
            echo '```sh'
            echo 'gh secret set SUPABASE_DB_URL -R <owner>/<repo>   # Dashboard -> Settings -> Database -> Connection string'
            echo '```'
            echo
            echo 'or all three of:'
            echo
            echo '```sh'
            echo 'gh secret set SUPABASE_ACCESS_TOKEN -R <owner>/<repo>    # supabase.com/dashboard/account/tokens'
            echo 'gh secret set SUPABASE_DB_PASSWORD -R <owner>/<repo>     # the database password'
            echo 'gh variable set SUPABASE_PROJECT_REF -R <owner>/<repo>   # the ref in your project URL (not a secret)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `--project-ref` is NOT a flag on `db push` — it belongs to `link`, and
      # passing it to push fails with "Unrecognized flag" and a usage dump. The
      # first version of this job used it, copied from a hand-rolled workflow
      # written against an older CLI where it was accepted, and it failed on its
      # first merge to main. `--linked` is how push names an already-linked
      # project.
      - name: Push migrations
        if: steps.cfg.outputs.route != 'none'
        env:
          ROUTE: ${{ steps.cfg.outputs.route }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ "$ROUTE" = "db-url" ]; then
            supabase db push --db-url "$SUPABASE_DB_URL"
          else
            supabase link --project-ref "$PROJECT_REF"
            supabase db push --linked
          fi

      # Deliberately NOT --include-all. That flag applies migrations that sort
      # BEFORE the last one already on the remote, which is the CLI's way of
      # saying the two histories have diverged — usually because someone applied
      # a migration by hand in the SQL editor and the history row was never
      # written. Silently reordering a production schema is not something a
      # deploy job should do on its own; `supabase migration repair` exists for
      # that, and it should be run by a human who has looked at the divergence.
      # A refusal here is the correct outcome, not an inconvenience to flag away.

      # Edge Functions are NOT deployed here. They are a separate blast radius —
      # `db push` applies a reviewed, ordered, append-only migration set, while
      # `functions deploy` swaps running code — and a project may legitimately
      # want the first automatic and the second deliberate. If you want them
      # deployed on merge too, add the step; it is not an oversight.

  ci-ok:
    name: CI OK
    # Just aggregates the needs[] results — no toolchain — so it always runs and
    # always reports. This is the single required status check (branch protection
    # points at "CI OK", not at the check job), so it never gets stuck "pending"
    # on a docs-only PR where the check job skips. Fails only if a required job
    # actually FAILED or was CANCELLED; a skipped job counts as OK.
    runs-on: ubuntu-latest
    needs: [changes, check, lint-database, test-database]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Verify required jobs passed (or were skipped)
        run: |
          echo "changes=${{ needs.changes.result }} check=${{ needs.check.result }} lint-database=${{ needs.lint-database.result }} test-database=${{ needs.test-database.result }}"
          for r in \
            "${{ needs.changes.result }}" \
            "${{ needs.check.result }}" \
            "${{ needs.lint-database.result }}" \
            "${{ needs.test-database.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass (result=$r)"
              exit 1
            fi
          done
          # `drift` is deliberately NOT in the loop above: it is no longer a job.
          # It runs as a step inside `changes` (Actions bills a one-minute
          # MINIMUM per job, so a 24-second job cost a whole billed minute) and
          # reports through an OUTPUT, because failing `changes` outright would
          # skip every job that needs it and suppress the real results on the
          # very PR you need them for. So the verdict is enforced HERE, in the
          # required check, where it blocks the merge and nothing else.
          #
          # Empty means the audit did not need to run — the PR touched no
          # lacquer-managed path — which is a pass. Anything that is not exactly
          # "pass", including a value this job does not recognise, fails.
          drift="${{ needs.changes.outputs.drift }}"
          echo "drift=${drift:-<not run>}"
          if [ -n "$drift" ] && [ "$drift" != "pass" ]; then
            echo "::error::lacquer drift was detected — see the \"Detect changed paths\" job log for what to fix."
            exit 1
          fi
          echo "All required jobs passed or were skipped."
