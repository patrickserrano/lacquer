name: Supabase CI

# Deno backend — runs on a GitHub-hosted runner (no Apple toolchain).

on:
  workflow_dispatch:
  pull_request:
    # No path filter on purpose: the workflow must run on EVERY PR so the single
    # required check (CI OK) always reports. A path-filtered workflow that doesn't
    # run leaves required checks stuck "pending" and blocks docs-only PRs (forcing
    # an admin bypass). The heavy `check` job is instead gated at the job level via
    # the `changes` job's `code` output. Mirrors the iOS profile.
    branches: [main, develop, 'feat/*', 'fix/*']
  push:
    branches: [main]
    paths:
      - "{{COMPONENT_PREFIX}}**"

permissions:
  contents: read

concurrency:
  group: supabase-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    # Pure git diff — no toolchain — so it always runs and lets CI OK report even
    # on docs-only PRs where the heavy check is skipped.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lacquer: ${{ steps.filter.outputs.lacquer }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        name: Check for code changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push / manual dispatch: treat as a code change so the check job
            # runs. `lacquer` is unconditionally true here on purpose — a push to
            # main is the backstop that catches the drift a PR gate cannot see
            # (an exclusion or baseline relaxation whose expiry simply passed).
            {
              echo "code=true"
              echo "lacquer=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Three-dot: against the merge base, not the base branch tip. Two-dot
          # folds in whatever landed on main after the PR opened, so a docs-only
          # PR starts reporting code changes and wakes the heavy Mac jobs.
          changed="$(git diff --name-only "$base...$head")"
          # `code` gates the heavy check job: run it unless the PR is docs-only, so
          # CI OK still reports green on docs PRs (no admin bypass). This is an
          # INVERTED deny-list (any non-docs change -> code=true) on purpose: a path
          # ALLOWLIST anchored on {{COMPONENT_PREFIX}} produces the regex `^(|...)`
          # for a root-layout project (empty prefix) — an empty ERE alternative that
          # some greps reject. The deny-list has no prefix and no empty alternative,
          # so it is layout-independent and fails safe (over-run, not under-run). It
          # is written portably (`-cv` count, no `-qv`) so it behaves the same on
          # this job's ubuntu GNU grep and on the self-hosted runner's ugrep.
          nondocs=$(echo "$changed" | grep -cvE '(\.md$|^docs/|^LICENSE$|^\.gitignore$)' || true)
          if [ "${nondocs:-0}" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # `lacquer` gates the drift job, which clones the lacquer, sets up Go,
          # builds the binary and runs `lacquer audit` — a whole billed minute
          # (Actions bills a one-minute MINIMUM per job) on a PR that cannot
          # possibly have drifted. Unlike `code` above this is an ALLOWLIST: a
          # source-only PR is not docs-only, so the deny-list shape would keep
          # waking this job on nearly every PR, which is the cost being removed.
          # It is deliberately WIDER than the set audit actually reads — a false
          # positive costs one minute, a false negative silently stops detecting
          # drift — and covers all three classes of audit input:
          #   1. every destination `lacquer sync` writes: the skills/commands/
          #      agents dirs (.claude, .codex, .agents), .github/**, scripts/**,
          #      the managed CLAUDE.md / AGENTS.md and .gitignore regions, and each profile's
          #      config files (.swiftlint.yml, biome.json, deno.jsonc, ...), which
          #      land under the component dir rather than the repo root;
          #   2. .lacquer.toml and .lacquer.lock, which drive every token, every
          #      exclusion and every baseline relaxation;
          #   3. the markers `audit` RE-DETECTS stacks from and the pbxproj the
          #      baseline check reads — audit exits 6 (undeclared stack) or 4
          #      (baseline violation) on those with no managed file touched at all.
          # Matched at any depth with `(^|/)` rather than anchored on the
          # component prefix, for the same reason the deny-list above carries no
          # prefix: an empty prefix produces the empty ERE alternative `^(|...)`
          # that some greps reject.
          lacquer_paths='(^|/)\.gitignore$|(^|/)\.lacquer\.(toml|lock)$|(^|/)(CLAUDE|AGENTS)\.md$|(^|/)\.(claude|codex|agents|github)/|(^|/)scripts/|(^|/)(Brewfile|lefthook\.yml|\.mcp\.json|\.pre-commit-config\.yaml)$|(^|/)(\.swiftlint\.yml|\.swiftlint-docs\.yml|\.swiftformat|\.periphery\.yml|Secrets\.xcconfig\.example)$|(^|/)(\.env\.schema|tsconfig\.base\.json|typedoc\.json|biome\.json|deno\.jsonc)$|(^|/)(package\.json|Cargo\.toml|go\.mod|Package\.swift|project\.yml)$|(^|/)supabase/config\.toml$|\.xcodeproj/'
          if echo "$changed" | grep -qE "$lacquer_paths"; then
            echo "lacquer=true" >> "$GITHUB_OUTPUT"
          else
            echo "lacquer=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Format · Lint · Test
    runs-on: ubuntu-latest
    needs: changes
    # Skip on docs-only PRs. Skipped counts as passing for the CI OK aggregator.
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: "{{COMPONENT_PREFIX}}."
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check supabase/functions/*/index.ts

      - name: Test
        # `deno test` exits 1 with "No test modules found" on an empty set, so a
        # supabase component that has not written its first edge-function test
        # yet cannot pass CI at all — a new project has to fail before it can
        # succeed. That is the state momfriend was in; the fmt step happened to
        # fail first, so this one never got the chance to report it.
        #
        # `--permit-no-files` alone would fix that by making zero tests pass
        # silently, which is the "check that cannot fail" defect this profile
        # exists to prevent. So permit the empty set AND say so out loud: the
        # project stays unblocked, and nobody mistakes green for tested.
        run: |
          set -euo pipefail
          count=$(find supabase/functions \
            \( -name '*_test.ts' -o -name '*.test.ts' \) | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::warning::No Deno tests found under supabase/functions/ — edge functions are shipping untested."
          fi
          deno test --allow-all --permit-no-files supabase/functions/

      # Prove the checks above can actually FAIL. Everything else in this job
      # asks "does this project pass?"; doctor asks "would these checks notice
      # if it didn't?" — the question nobody was asking while `swiftlint --path`
      # (a removed flag), `DOCC_FLAGS` (silently ignored) and two npx-resolved
      # web probes all reported green over nothing.
      #
      # It runs HERE, in the job that already has the stack toolchain, because a
      # probe whose tool is missing is reported as a missing tool — correct, but
      # useless as a gate on a runner that was never going to have it.
      #
      # working-directory is pinned to the repo root: this job may default to a
      # component subdirectory, and .lacquer.toml lives at the root.
      - uses: actions/checkout@v7.0.1
        with:
          repository: patrickserrano/lacquer
          path: .lacquer-checkout
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .lacquer-checkout/go.mod
          cache-dependency-path: .lacquer-checkout/go.sum
      - name: Prove the checks can fail
        working-directory: .
        run: |
          set -euo pipefail
          if [ ! -f .lacquer.toml ]; then
            echo "::notice::No .lacquer.toml — this project is not lacquer-managed."
            exit 0
          fi
          (cd .lacquer-checkout && go build -o "$RUNNER_TEMP/lacquer" ./cmd/lacquer)
          LACQUER_ROOT="$PWD/.lacquer-checkout" "$RUNNER_TEMP/lacquer" doctor --profile supabase

  lint-database:
    name: DB Lint (Splinter)
    # CLAUDE.supabase.md calls RLS "the security boundary" — Splinter (supabase db
    # lint) is what actually enforces it in CI, catching missing-RLS and
    # security-definer issues the Edge-Function checks never see.
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "{{COMPONENT_PREFIX}}."
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      # Boots Postgres + applies migrations; a broken migration fails here (desired).
      - name: Start local stack
        run: supabase start

      - name: Lint database schema
        run: supabase db lint --level warning

  test-database:
    name: DB Tests (pgTAP)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "{{COMPONENT_PREFIX}}."
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Start local stack
        run: supabase start

      # This step used to echo "no pgTAP tests yet" and exit 0 on an empty
      # directory, which meant the job booted a full Postgres stack and reported
      # green having asserted nothing — for however many months it took someone
      # to notice. `supabase test db` exits 0 over a matchless glob all by
      # itself, so the emptiness has to be caught here or not at all.
      #
      # An empty suite is therefore a failure, with the same time-boxed escape
      # hatch every other baseline carries for a project that genuinely cannot
      # comply yet. RLS is this profile's security boundary and Splinter only
      # catches a *missing* policy — a wrong one is caught by a test or by
      # nobody, so "no tests" is a real finding rather than a neutral state.
      #
      # No `defaults.working-directory` applies to the relaxation step: the
      # manifest and scripts/ live at the REPO root while supabase/ lives in the
      # component, exactly as in the `docs` job below.
      - name: Read the pgTAP relaxation
        id: relax
        working-directory: "."
        run: |
          set -euo pipefail
          state=$(RELAX_KEY=pgtap scripts/docs-relaxation.sh .lacquer.toml)
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          case "$state" in
            none)    echo "No pgTAP relaxation — an empty suite fails." ;;
            relaxed) echo "::warning::pgTAP tests are relaxed by [baseline.relax] in .lacquer.toml. Write RLS tests before the date passes — an expired relaxation is a hard failure." ;;
            expired) echo "::error::The pgtap relaxation in .lacquer.toml has expired. Add pgTAP tests, or extend the relaxation deliberately."; exit 1 ;;
            malformed)
              echo "::error::The [baseline.relax] pgtap entry in .lacquer.toml is malformed. Both fields are required: pgtap = { until = \"YYYY-MM-DD\", reason = \"why, with a tracking issue\" }."
              exit 1 ;;
            *) echo "::error::Unexpected relaxation state '$state'"; exit 1 ;;
          esac

      - name: Run pgTAP tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The same glob pg_prove is handed, so this counts what would actually
          # run rather than what someone hoped was there.
          tests=(supabase/tests/*.sql)
          if (( ${#tests[@]} == 0 )); then
            if [ "${RELAX_STATE}" = "relaxed" ]; then
              echo "::warning::No pgTAP tests in supabase/tests/ — permitted by the time-boxed pgtap relaxation."
              exit 0
            fi
            echo "::error::No pgTAP tests in supabase/tests/ — this gate would pass vacuously. Add tests asserting RLS denies cross-user access, or add a time-boxed [baseline.relax] pgtap entry to .lacquer.toml."
            exit 1
          fi
          echo "Running ${#tests[@]} pgTAP test file(s)."
          supabase test db
        env:
          RELAX_STATE: ${{ steps.relax.outputs.state }}

  deploy-database:
    name: Deploy migrations
    runs-on: ubuntu-latest
    # Only a merge to main, and only behind the schema jobs. `supabase db push`
    # is the one step here that touches production, so it must not be reachable
    # from a PR, and a migration must never land there without the lint and the
    # pgTAP suite having passed on it first — that ordering is the whole reason
    # this job lives in ci.yml rather than in a deploy workflow of its own,
    # which could not express `needs` across files.
    #
    # Those jobs are themselves gated on `changes`, so a docs-only push skips
    # them and skips this with them. That is correct: no migration, no deploy.
    needs: [check, lint-database, test-database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    # Never two at once. Concurrent pushes would race `db push` against the same
    # project, and a partially applied migration is not something re-running
    # fixes. Never cancel a run in progress either — cancelling mid-push is how
    # you get that half-applied state deliberately.
    concurrency:
      group: supabase-db-push
      cancel-in-progress: false
    defaults:
      run:
        working-directory: "{{COMPONENT_PREFIX}}."
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      # Skip rather than fail when the project has not wired deployment up. A
      # permanently red main is noise that trains you to stop reading the
      # Actions tab, which is precisely how a missing deploy goes unnoticed —
      # so this says so loudly, in the log and the job summary, and stays green.
      # Two ways to reach the remote database, because `db push` needs a real
      # Postgres connection and the two routes need different things:
      #
      #   SUPABASE_DB_URL      one secret, connects directly, no linking step
      #   TOKEN + REF + PASSWORD  links via the Management API, then pushes
      #
      # The db-url route is preferred where present: it is one secret instead of
      # three, and it removes the link step entirely, which is where a missing
      # database password otherwise surfaces as an interactive prompt that hangs
      # a runner rather than failing it.
      - name: Check deploy configuration
        id: cfg
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -n "$DB_URL" ]; then
            echo "route=db-url" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$TOKEN" ] && [ -n "$PROJECT_REF" ] && [ -n "$DB_PASSWORD" ]; then
            echo "route=linked" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "route=none" >> "$GITHUB_OUTPUT"
          echo "::warning::Migrations were NOT deployed — deployment is not configured."
          {
            echo "### Supabase migrations were not deployed"
            echo
            echo 'Set **either** a direct connection string:'
            echo
            echo '```sh'
            echo 'gh secret set SUPABASE_DB_URL -R <owner>/<repo>   # Dashboard -> Settings -> Database -> Connection string'
            echo '```'
            echo
            echo 'or all three of:'
            echo
            echo '```sh'
            echo 'gh secret set SUPABASE_ACCESS_TOKEN -R <owner>/<repo>    # supabase.com/dashboard/account/tokens'
            echo 'gh secret set SUPABASE_DB_PASSWORD -R <owner>/<repo>     # the database password'
            echo 'gh variable set SUPABASE_PROJECT_REF -R <owner>/<repo>   # the ref in your project URL (not a secret)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `--project-ref` is NOT a flag on `db push` — it belongs to `link`, and
      # passing it to push fails with "Unrecognized flag" and a usage dump. The
      # first version of this job used it, copied from a hand-rolled workflow
      # written against an older CLI where it was accepted, and it failed on its
      # first merge to main. `--linked` is how push names an already-linked
      # project.
      - name: Push migrations
        if: steps.cfg.outputs.route != 'none'
        env:
          ROUTE: ${{ steps.cfg.outputs.route }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ "$ROUTE" = "db-url" ]; then
            supabase db push --db-url "$SUPABASE_DB_URL"
          else
            supabase link --project-ref "$PROJECT_REF"
            supabase db push --linked
          fi

      # Deliberately NOT --include-all. That flag applies migrations that sort
      # BEFORE the last one already on the remote, which is the CLI's way of
      # saying the two histories have diverged — usually because someone applied
      # a migration by hand in the SQL editor and the history row was never
      # written. Silently reordering a production schema is not something a
      # deploy job should do on its own; `supabase migration repair` exists for
      # that, and it should be run by a human who has looked at the divergence.
      # A refusal here is the correct outcome, not an inconvenience to flag away.

      # Edge Functions are NOT deployed here. They are a separate blast radius —
      # `db push` applies a reviewed, ordered, append-only migration set, while
      # `functions deploy` swaps running code — and a project may legitimately
      # want the first automatic and the second deliberate. If you want them
      # deployed on merge too, add the step; it is not an oversight.

  drift:
    name: No lacquer drift
    # Pure Go + a git checkout — no stack toolchain — so it runs on a
    # GitHub-hosted runner rather than tying up the dedicated Mac.
    runs-on: ubuntu-latest
    needs: changes
    # Gated on paths, NOT on `code`: a drifted hook or workflow is exactly the
    # kind of change that arrives in an otherwise docs-only PR, so `lacquer`
    # deliberately includes files `code` calls docs (CLAUDE.md, AGENTS.md) and
    # excludes the sources `code` is about. It used to run unconditionally,
    # which was a billed minute per PR (Actions charges a one-minute minimum per
    # job, so cost here is job COUNT) to re-audit a tree the PR never touched.
    # A skipped job counts as OK for the CI OK aggregator, which runs on
    # always() and only fails on failure/cancelled — so skipping this never
    # leaves the required check pending.
    if: needs.changes.outputs.lacquer == 'true'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1

      # lacquer is a public repo, so this needs no token.
      - uses: actions/checkout@v7.0.1
        with:
          repository: patrickserrano/lacquer
          path: .lacquer-checkout

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .lacquer-checkout/go.mod
          # Without this, the module cache restore probes the PROJECT root for
          # go.mod and warns on every run.
          cache-dependency-path: .lacquer-checkout/go.sum

      - name: Audit for drift
        run: |
          set -euo pipefail
          if [ ! -f .lacquer.toml ]; then
            echo "::notice::No .lacquer.toml — this project is not lacquer-managed."
            exit 0
          fi
          if [ ! -f .lacquer.lock ]; then
            # Without a lock baseline, audit cannot tell "the project edited this"
            # from "the lacquer moved on", so every unit reads as untracked and
            # nothing can block. Say so instead of reporting a green pass.
            echo "::warning::No .lacquer.lock — this project has never been synced, so drift cannot be attributed. Run \`lacquer sync\` to establish the baseline."
          fi
          # Build from INSIDE the checkout. `go build ./.lacquer-checkout/cmd/lacquer`
          # from the project root fails with "go.mod file not found in current
          # directory or any parent directory" — a Go package path is resolved
          # against the current MODULE, and a Swift/TS project root is not one.
          # This job therefore failed in every repo, on every PR, for a reason that
          # had nothing to do with drift.
          (cd .lacquer-checkout && go build -o /tmp/lacquer ./cmd/lacquer)

          set +e
          LACQUER_ROOT="$PWD/.lacquer-checkout" /tmp/lacquer audit
          code=$?
          set -e

          case "$code" in
            0) echo "No drift." ;;
            3) echo "::error::A lacquer-managed file was edited in this project. These files are rendered from the lacquer, so a local edit silently diverges from what every other project gets — which is how a pre-commit hook ends up weaker than CI. Fix it in the lacquer repo and re-sync, or, if this project genuinely owns the file, add it to [project].exclude in .lacquer.toml so the lacquer stops managing it."
               exit 1 ;;
            4) echo "::error::The project baseline is not met. See the audit output above."
               exit 1 ;;
            # Detection ran once, at `lacquer init`, and never again — so a
            # project that grew a stack afterwards was unmanaged for it forever,
            # with nothing reporting the gap: no hooks, no CI, no error. `audit`
            # re-detects on every run now, and this is what makes that visible on
            # the PR that introduces the stack rather than a year later.
            6) echo "::error::This project runs a stack .lacquer.toml does not declare, so nothing gates it — no hooks, no CI, no CLAUDE region. Run \`lacquer adopt\` to record it and re-sync, or add the path to [project].exclude if the project deliberately keeps it unmanaged."
               exit 1 ;;
            *) echo "::error::lacquer audit failed (exit $code)."
               exit 1 ;;
          esac

  ci-ok:
    name: CI OK
    # Just aggregates the needs[] results — no toolchain — so it always runs and
    # always reports. This is the single required status check (branch protection
    # points at "CI OK", not at the check job), so it never gets stuck "pending"
    # on a docs-only PR where the check job skips. Fails only if a required job
    # actually FAILED or was CANCELLED; a skipped job counts as OK.
    runs-on: ubuntu-latest
    needs: [changes, check, lint-database, test-database, drift]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Verify required jobs passed (or were skipped)
        run: |
          echo "changes=${{ needs.changes.result }} check=${{ needs.check.result }} lint-database=${{ needs.lint-database.result }} test-database=${{ needs.test-database.result }} drift=${{ needs.drift.result }}"
          for r in \
            "${{ needs.changes.result }}" \
            "${{ needs.check.result }}" \
            "${{ needs.lint-database.result }}" \
            "${{ needs.test-database.result }}" \
            "${{ needs.drift.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass (result=$r)"
              exit 1
            fi
          done
          echo "All required jobs passed or were skipped."
