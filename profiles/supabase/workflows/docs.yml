name: Supabase Docs

# Publishes the Edge Function API reference to
# https://<owner>.github.io/<repo>/db/.
#
# Validation lives in supabase-ci.yml's `Docs` job — branch protection points at
# a single required check (CI OK), and a job in another workflow cannot be one of
# its `needs`. This workflow only publishes what CI already proved is documented.

on:
  workflow_dispatch:
  schedule:
    # Overnight. Publishing docs is never urgent; the work that queues behind it
    # is. 03:00 UTC clears before the 07:00 / 08:00 / 09:00 dailies start.
    - cron: '0 3 * * *'

permissions:
  contents: write # scripts/publish-docs.sh pushes the gh-pages branch

# Shared with every other stack's docs workflow in this repo so two stacks never
# push gh-pages concurrently. Never cancel — a cancelled publish leaves the
# branch without this commit's docs and nothing retries it.
concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  # A cheap gate on a hosted runner, so the expensive job never starts when the
  # published docs already match the source.
  #
  # A job-level `if` rather than per-step conditions: a skipped job never
  # occupies a runner at all. That is the whole point for iOS, where the build
  # takes ~38 minutes on the fleet's ONE self-hosted Mac and everything else —
  # CI, releases — queues behind it.
  check:
    name: Are the published docs stale?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.stale.outputs.needed }}
      sha: ${{ steps.stale.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history. The check asks for the last commit that touched this
          # component, and on a depth-1 clone `git log -- <path>` sees only the
          # single fetched commit — it would report "no commits" and skip
          # forever.
          fetch-depth: 0

      - id: stale
        run: |
          set -euo pipefail
          current=$(git log -1 --format=%H -- "{{COMPONENT_PREFIX}}" || true)
          if [ -z "$current" ]; then
            echo "No commits touching this component — nothing to publish."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          published=""
          if git fetch --quiet --depth 1 origin gh-pages 2>/dev/null; then
            # A missing file, a missing branch and a first-ever run all land here
            # and all mean "publish". That is the safe direction: a spurious
            # build costs runner time, a spurious skip serves stale docs
            # indefinitely with nothing reporting it.
            published=$(git show FETCH_HEAD:db/.docs-source 2>/dev/null || true)
          fi

          if [ "$current" = "$published" ]; then
            echo "Published docs are already built from $current — skipping."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Source at $current, published at ${published:-<none>} — rebuilding."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$current" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish the API reference
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Honour [baseline.relax] documentation, exactly as the CI Docs job and the
      # local hooks do. This workflow did NOT, so a project with a valid,
      # unexpired relaxation went green on its PR and then failed on main the
      # moment it merged — which is precisely the "a lot of failures on main"
      # symptom. Third place this same relaxation had to be taught.
      - name: Read the documentation relaxation
        id: relax
        run: |
          set -euo pipefail
          state=$(scripts/docs-relaxation.sh .lacquer.toml 2>/dev/null || echo none)
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          case "$state" in
            expired)   echo "::error::The documentation relaxation in .lacquer.toml has expired."; exit 1 ;;
            malformed) echo "::error::The [baseline.relax] documentation entry is malformed."; exit 1 ;;
            relaxed)   echo "::warning::Documentation is relaxed — publishing what builds, not gating on completeness." ;;
          esac

      - name: Build documentation
        id: build
        working-directory: "{{COMPONENT_PREFIX}}."
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/functions/_shared/*.ts)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No supabase/functions/_shared/*.ts yet — nothing to publish."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
          # deno doc emits relative asset URLs, so the site works at any depth
          # and needs no base-path setting to match the /db/ subdirectory.
          deno doc --html --name="${GITHUB_REPOSITORY#*/}" --output=docs-site "${files[@]}"

      # Guarded rather than unconditional: a component with no _shared/ yet built
      # nothing above, and publish-docs.sh correctly refuses an empty directory —
      # which would fail the job for a project that has simply not written its
      # first shared helper.
      - name: Publish to gh-pages/db
        if: steps.build.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_SOURCE_SHA: ${{ needs.check.outputs.sha }}
        run: scripts/publish-docs.sh db "{{COMPONENT_PREFIX}}docs-site"

      - name: Link the published site
        if: steps.build.outputs.built == 'true'
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "### Documentation published"
            echo ""
            echo "https://${owner}.github.io/${repo}/db/"
            echo ""
            echo "If that 404s, Pages is not serving this branch yet — set"
            echo "Settings → Pages → Source to *Deploy from a branch*, gh-pages, / (root)."
          } >> "$GITHUB_STEP_SUMMARY"
