# Git hooks (lefthook) for a Supabase / Deno backend. Install once with
# `npx lefthook install` (lefthook is a single binary; no Node/npm required —
# `brew install lefthook`, or run via `deno run npm:lefthook`).
#
# `root: "{{COMPONENT_PREFIX}}"` scopes each command to its component. For a
# nested layout it renders `root: "server/"`: lefthook cds into it (so `deno fmt`
# picks up that component's deno.jsonc) and filters {staged_files} to the subtree,
# so a commit that doesn't touch the component skips these hooks. For a root
# layout it renders `root: ""` — the repo root, with no file filtering. The
# secrets scan is intentionally NOT scoped: the shared script reads the full
# staged set itself. Mirrors profiles/web/root/lefthook.yml.

pre-commit:
  parallel: false
  commands:
    # Format check (no writes) — matches the `deno fmt --check` CI step.
    fmt:
      root: "{{COMPONENT_PREFIX}}"
      run: deno fmt --check
    lint:
      root: "{{COMPONENT_PREFIX}}"
      run: deno lint
    # Mirrors the `Docs` job in supabase-ci.yml — cheap, so it belongs at
    # pre-commit. Scoped to _shared/ for the same reason CI is: a function's
    # index.ts is an HTTP entry point, not an API other code imports.
    #
    # scripts/docs-relaxation.sh and .lacquer.toml are resolved from the
    # REPOSITORY root: `root:` has already cd'd into the component, where
    # neither exists, and a missing one fails loudly rather than reading as
    # "not relaxed". The root is resolved with GIT_DIR cleared, because git
    # exports it to hooks in a linked worktree and `--show-toplevel` then
    # answers the component. See the `docs` command in
    # profiles/web/root/lefthook.yml for both defects.
    docs:
      root: "{{COMPONENT_PREFIX}}"
      glob: "supabase/functions/_shared/*.ts"
      run: |
        top=$(env -u GIT_DIR -u GIT_WORK_TREE git rev-parse --show-toplevel) || exit 1
        for f in scripts/docs-relaxation.sh .lacquer.toml; do
          if [ ! -f "$top/$f" ]; then
            echo "docs: $f is missing from the repository root ($top), so [baseline.relax] cannot be read." >&2
            echo "      Every lacquer-managed repository has it; restore it (lacquer sync writes the script)." >&2
            exit 1
          fi
        done
        if ! state=$(cd "$top" && scripts/docs-relaxation.sh .lacquer.toml); then
          echo "docs: scripts/docs-relaxation.sh failed, so [baseline.relax] cannot be read." >&2
          exit 1
        fi
        if [ "$state" = "relaxed" ]; then
          echo "docs: relaxed by [baseline.relax] in .lacquer.toml — skipping"
        else
          deno doc --lint supabase/functions/_shared/*.ts
        fi
    # Scan every staged file for hardcoded secrets — repo-wide, not component-
    # scoped: check-secrets.sh reads `git diff --cached` itself (no root, no
    # {staged_files}). Mirrors the iOS profile's `no-secrets` pre-commit hook.
    secrets:
      run: scripts/check-secrets.sh

# CI runs `deno check` and `deno test` and nothing local did, so a type error or
# a failing test only surfaced after push. Both are too slow for pre-commit and
# both are exactly what pre-push is for. Mirrors profiles/web/root/lefthook.yml.

    # BRIDGE TO THE iOS PROFILE'S HOOKS. A repo with both an iOS and a
    # web/supabase component carries `.pre-commit-config.yaml` AND this file,
    # and `pre-commit install` and `lefthook install` each overwrite
    # `.git/hooks/pre-commit`. Only one wins, so half the gates silently vanish
    # — and every signal a human checks says the repo is healthy, because a hook
    # exists and commits do get gated. Worse, the answer flips whenever somebody
    # re-runs an install for unrelated reasons.
    #
    # Resolution: lefthook owns `.git/hooks` and calls pre-commit from here, so
    # one installed hook runs both rule sets. Byte-identical in the web and
    # supabase fragments on purpose — the merge keeps one copy of a command two
    # profiles ship the SAME way, so an ios+web+supabase repo bridges once, not
    # twice.
    #
    # `commit-msg` needs no bridge: the iOS `conventional-commit` hook and this
    # file's `conventional` command both run scripts/check-commit-msg.sh, so
    # whichever manager owns that hook runs the identical check.
    #
    # No `root:` — the iOS hooks carry their own `files:` patterns and filter
    # the staged set themselves.
    ios-pre-commit:
      run: |
        # No iOS component here: nothing to bridge, and this must not fail a
        # single-stack web/supabase repo.
        [ -f .pre-commit-config.yaml ] || exit 0
        if ! command -v pre-commit >/dev/null 2>&1; then
          echo "lefthook owns .git/hooks in this mixed repo and bridges to pre-commit," >&2
          echo "but pre-commit is not installed, so the iOS gates (SwiftLint, SwiftFormat," >&2
          echo "secret scan) would run on nothing. Install it: brew install pre-commit" >&2
          exit 1
        fi
        pre-commit run --hook-stage pre-commit --files {staged_files}
pre-push:
  parallel: true
  commands:
    typecheck:
      root: "{{COMPONENT_PREFIX}}"
      run: deno check supabase/functions/*/index.ts
    # `deno test` exits non-zero when it finds no test modules, so a component
    # with edge functions and no tests could never push. `--permit-no-files`
    # alone would make zero tests pass silently — the check that cannot fail —
    # so this mirrors the supabase-ci.yml `Test` step exactly: permit the empty
    # set AND say so. A hook has no ::warning:: annotations, so it prints.
    test:
      root: "{{COMPONENT_PREFIX}}"
      run: |
        count=$(find supabase/functions \( -name '*_test.ts' -o -name '*.test.ts' \) | wc -l | tr -d ' ')
        if [ "$count" -eq 0 ]; then
          echo "warning: No Deno tests found under supabase/functions/ — edge functions are shipping untested." >&2
        fi
        deno test --allow-all --permit-no-files supabase/functions/

commit-msg:
  commands:
    # Conventional Commits — the same shared check the iOS/web profiles use
    # (scripts/check-commit-msg.sh is synced from the lacquer core).
    conventional:
      run: scripts/check-commit-msg.sh {1}
