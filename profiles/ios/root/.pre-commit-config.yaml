# Both hook types are installed, and every hook that doesn't declare its own
# `stages:` is pinned to pre-commit. Adopted from momfriend, and this is very
# likely the origin of "the SwiftLint hook never blocks a commit":
#
#   * Without `default_stages`, a hook runs at ALL installed stages. Every
#     file-filtered hook therefore re-ran during the commit-msg stage, where
#     pre-commit's file list is just the commit-message file — printing
#     "(no files to check) — Skipped" for each one on EVERY commit. Pipe
#     `git commit` through `tail -N`, which is the common agent pattern, and
#     that always-skipping block is the only part still on screen. It reads as
#     "the Swift stages skipped my Swift commit" when they had already run and
#     passed further up.
#   * Without `default_install_hook_types`, `pre-commit install` wires up only
#     the pre-commit hook, so the commit-msg stage — the Conventional Commits
#     check — was never installed at all unless someone knew to pass
#     `--hook-type commit-msg`.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

# Swift stages go through scripts/precommit-swift.sh rather than invoking the
# tools directly. Adopted from momfriend, which had diverged from the lacquer to
# fix three real holes the direct invocation has:
#
#   * Agent shells often lack /opt/homebrew/bin on PATH, so `swiftlint` resolves
#     as "not found" — and pre-commit reports that as a pass. The wrapper
#     resolves the binary itself and ERRORS when it genuinely cannot be found.
#     A check that cannot run must block, never pass.
#   * Zero staged files means the file-list plumbing broke; the wrapper refuses
#     to report success for a check that verified nothing.
#   * It cds into the component so the tools run from their config's directory
#     and never scan DerivedData*, which otherwise produces phantom violations.
#
# `verbose: true` prints its proof-of-run line on every commit, so "the hook ran
# and checked N files" is visible rather than assumed.
repos:
  - repo: local
    hooks:
      - id: swiftformat
        name: SwiftFormat
        entry: scripts/precommit-swift.sh swiftformat
        verbose: true
        language: system
        types: [swift]
        files: ^{{COMPONENT_PREFIX}}

      # --strict, matching CI exactly. Without it the warning-severity rules
      # (line_length, file_length, type_body_length, function_body_length) print
      # and pass locally, then fail the PR — the whole class of "it was fine on
      # my machine". Never add `|| true` here for the same reason: a hook that
      # cannot fail is a hook that is not running.
      - id: swiftlint
        name: SwiftLint
        entry: scripts/precommit-swift.sh swiftlint
        verbose: true
        language: system
        types: [swift]
        files: ^{{COMPONENT_PREFIX}}

      # The other half of the documentation baseline, and the cheap half — the
      # DocC build itself is CI-only (see the note below). Same config and
      # same --strict as the `Docs` job in ios-ci.yml.
      - id: swiftlint-docs
        name: SwiftLint (documentation)
        entry: scripts/docs-hook.sh scripts/precommit-swift.sh swiftlint-docs
        verbose: true
        language: system
        types: [swift]
        files: ^{{COMPONENT_PREFIX}}

      # Deliberately no local `xcodebuild test`/`docbuild` hook. This fleet's
      # self-hosted Mac runner is frequently the same physical machine as the
      # one you're committing from — a local test or doc build doesn't save
      # CI wall-clock the way it would on separate hardware, it just runs the
      # exact same xcodebuild invocation twice on the one shared box. `Test`
      # and `Docs` → DocC-builds-clean are CI-only by design; see CLAUDE.ios.md
      # "Local Checks vs CI". Everything above this line is static analysis
      # (lint/format), never a build, and stays local.

      - id: no-secrets
        name: Check for hardcoded secrets
        entry: scripts/check-secrets.sh
        language: system
        pass_filenames: false

      - id: model-defaults
        name: SwiftData @Model inline defaults (CloudKit)
        # Non-optional @Model stored properties without an inline default crash
        # NSPersistentCloudKitContainer at runtime (Code=134060) — catch it here.
        entry: scripts/check-model-defaults.sh {{COMPONENT_PREFIX}}.
        language: system
        pass_filenames: false
        files: ^{{COMPONENT_PREFIX}}.*\.swift$

      # Conventional Commits — enforced by a LOCAL script (the lacquer keeps every
      # hook local: no remote pre-commit repo runs on every commit = no supply
      # chain to trust).
      - id: conventional-commit
        name: Conventional commit message
        entry: scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
