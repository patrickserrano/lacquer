repos:
  - repo: local
    hooks:
      - id: swiftformat
        name: SwiftFormat
        entry: swiftformat --config {{COMPONENT_PREFIX}}.swiftformat
        language: system
        types: [swift]
        files: ^{{COMPONENT_PREFIX}}

      # --strict, matching CI exactly. Without it the warning-severity rules
      # (line_length, file_length, type_body_length, function_body_length) print
      # and pass locally, then fail the PR — the whole class of "it was fine on
      # my machine". Never add `|| true` here for the same reason: a hook that
      # cannot fail is a hook that is not running.
      - id: swiftlint
        name: SwiftLint
        entry: swiftlint --strict --config {{COMPONENT_PREFIX}}.swiftlint.yml
        language: system
        types: [swift]
        files: ^{{COMPONENT_PREFIX}}

      # The other half of the documentation baseline, and the cheap half — the
      # DocC build is at pre-push below. Same config and same --strict as the
      # `Docs` job in ios-ci.yml.
      - id: swiftlint-docs
        name: SwiftLint (documentation)
        entry: swiftlint --strict --config {{COMPONENT_PREFIX}}.swiftlint-docs.yml
        language: system
        types: [swift]
        files: ^{{COMPONENT_PREFIX}}

      - id: swift-test
        name: Swift Tests
        # -derivedDataPath DerivedData keeps SPM resolution per-checkout,
        # avoiding the default-DerivedData "Couldn't check out revision"
        # corruption when other checkouts/CI race the shared SwiftPM cache.
        # Stderr is intentionally NOT suppressed and there is no fake-device
        # fallback: if the pinned simulator is missing, fail loudly with the
        # real error. `cd {{COMPONENT_PREFIX}}.` is `cd ios/.` for a nested
        # layout and `cd .` for a root layout.
        entry: bash -c 'cd {{COMPONENT_PREFIX}}. && xcodebuild test -scheme {{SCHEME}} -destination "platform=iOS Simulator,name=iPhone 17 Pro" -derivedDataPath DerivedData -only-testing:{{PROJECT_NAME}}Tests -quiet'
        language: system
        pass_filenames: false
        files: ^{{COMPONENT_PREFIX}}

      - id: no-secrets
        name: Check for hardcoded secrets
        entry: scripts/check-secrets.sh
        language: system
        pass_filenames: false

      - id: model-defaults
        name: SwiftData @Model inline defaults (CloudKit)
        # Non-optional @Model stored properties without an inline default crash
        # NSPersistentCloudKitContainer at runtime (Code=134060) — catch it here.
        entry: scripts/check-model-defaults.sh {{COMPONENT_PREFIX}}.
        language: system
        pass_filenames: false
        files: ^{{COMPONENT_PREFIX}}.*\.swift$

      # A full docbuild is far too slow for pre-commit, but it is the only thing
      # that catches a broken ``SymbolLink`` — SwiftLint checks that a doc comment
      # EXISTS, not that it resolves. At pre-push it costs one build on the way
      # out instead of a round trip through CI.
      - id: docs-build
        name: Documentation builds clean
        entry: scripts/build-docs.sh docs-site
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^{{COMPONENT_PREFIX}}.*\.swift$

      # Conventional Commits — enforced by a LOCAL script (the lacquer keeps every
      # hook local: no remote pre-commit repo runs on every commit = no supply
      # chain to trust).
      - id: conventional-commit
        name: Conventional commit message
        entry: scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]
