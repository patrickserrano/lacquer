name: Scheduled Quality Review

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays at 09:00 UTC
  workflow_dispatch:

jobs:
  quality-review:
    runs-on: [self-hosted, macOS, ARM64, dedicated]
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      # See the same guard in dependency-audit.yml for the full reasoning:
      # claude-code-action hard-fails on an empty token, which turns an
      # unattended weekly job into a permanent red X that no repo-side change can
      # fix. `secrets` is not available in a job-level `if`, so this has to be a
      # step that exports an output.
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: claude_token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set — skipping the quality review."
          # Indented code block, not a fenced one — see dependency-audit.yml.
          {
            echo "### Quality review skipped"
            echo ""
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set on this repository."
            echo ""
            echo "    claude setup-token"
            echo "    gh secret set CLAUDE_CODE_OAUTH_TOKEN -R ${GITHUB_REPOSITORY}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select random feature module
        id: module
        run: |
          set -euo pipefail
          # Find any Features/ directory under the component without assuming
          # its parent's name (source dir may be App/, Sources/, etc.), then
          # pick one module portably — stock macOS has no shuf.
          module=$(find {{COMPONENT_PREFIX}}. -type d -name Features -not -path '*/.build/*' -not -path '*/DerivedData*/*' \
            -exec sh -c 'ls -d "$1"/*/ 2>/dev/null' _ {} \; \
            | awk 'BEGIN{srand()} {a[NR]=$0} END{if(NR>0) printf "%s", a[int(rand()*NR)+1]}')
          if [ -z "$module" ]; then
            echo "::notice::No feature modules found under a Features/ directory — skipping quality review."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "found=true"
            echo "module=$module"
          } >> "$GITHUB_OUTPUT"
          echo "Selected module: $module"

      - name: Run Claude Code quality review
        if: steps.module.outputs.found == 'true' && steps.claude_token.outputs.present == 'true'
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Review the SwiftUI code quality for the feature module: ${{ steps.module.outputs.module }}.

            Focus on:
            - SwiftUI best practices and consistency
            - Code smells, duplication, or unnecessary complexity
            - Missing or weak tests (especially ViewModel/service layers)
            - Documentation gaps or unclear intent
            - Performance pitfalls (excessive re-renders, heavy body logic, etc.)

            If you find actionable issues, create GitHub issues with clear titles and repro/steps.
            Apply labels: ios, quality.
            If no issues are found, leave a brief comment in the workflow logs summarizing the review.
