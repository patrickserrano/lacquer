name: Scheduled Dependency Audit

on:
  schedule:
    - cron: "0 10 1,15 * *" # 1st and 15th of each month at 10:00 UTC
  workflow_dispatch:

jobs:
  dependency-audit:
    runs-on: [self-hosted, macOS, ARM64, dedicated]
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      # See "Claude-powered workflows" in profiles/ios/CLAUDE.ios.md.
      # claude-code-action hard-fails when the token is empty ("Environment
      # variable validation failed"), so an unattended scheduled job on a repo
      # that never set the secret is permanently red and says nothing useful.
      # Every repo in this fleet was in exactly that state — 5/5 scheduled audits
      # failed this way — because the documented way to set the secret was an
      # org-level command and these repos live under a personal account, where
      # org secrets do not exist. Skip loudly instead of failing opaquely.
      #
      # This has to be a step, not a job-level `if`: the `secrets` context is not
      # available in `jobs.<id>.if`.
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        id: claude_token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set — collecting the dependency report but skipping the Claude review step."
          # Indented code blocks, not fenced ones: a fence needs backticks, and a
          # backtick inside single quotes trips shellcheck SC2016 for no benefit.
          {
            echo "### Claude review skipped"
            echo ""
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set on this repository, so the audit"
            echo "collected the report below but could not open PRs or issues."
            echo ""
            echo "    claude setup-token"
            echo "    gh secret set CLAUDE_CODE_OAUTH_TOKEN -R ${GITHUB_REPOSITORY}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect dependency update info
        run: |
          set -euo pipefail
          report="dependency-audit.md"
          echo "# Dependency Audit" > "$report"
          echo "" >> "$report"

          echo "## Swift Package Updates" >> "$report"
          if [ -f "Package.swift" ]; then
            swift package update --dry-run >> "$report" 2>&1 || true
          else
            resolved="{{XCODEPROJ}}/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
            if [ -f "$resolved" ]; then
              xcodebuild -resolvePackageDependencies -project "{{XCODEPROJ}}" -scheme "{{SCHEME}}" > /tmp/resolve.log 2>&1 || true
              git diff -- "$resolved" >> "$report" || true
              git checkout -- "$resolved"
            else
              echo "No Package.swift or Package.resolved found." >> "$report"
            fi
          fi

      # The report is the one thing this job produces without Claude, so surface
      # it either way — otherwise a token-less run is indistinguishable from a
      # run that found nothing to update.
      - name: Publish the report to the job summary
        run: |
          set -euo pipefail
          {
            echo "### Dependency report"
            echo ""
            cat dependency-audit.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Claude Code dependency audit
        if: steps.claude_token.outputs.present == 'true'
        uses: anthropics/claude-code-action@24dcd50c0568f0fc9e9211213a4fd2d9eb15c4e0 # v1.0.200
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            Review dependency-audit.md and determine safe Swift package dependency updates.

            Requirements:
            - If updates look safe, open a PR with the changes.
            - If updates are risky or breaking, open GitHub issues describing the risk.
            - Include changelog notes or release links when possible.
            - Apply labels: dependencies, ios as appropriate.

      # This job runs on a dedicated self-hosted runner whose workspace persists
      # between runs, and the report is written into the checkout. Left behind it
      # makes the next run's `git diff`/`git checkout` of Package.resolved happen
      # in an already-dirty tree.
      - name: Clean up the report
        if: always()
        run: rm -f dependency-audit.md
