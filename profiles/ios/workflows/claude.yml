name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: [self-hosted, macOS, ARM64, dedicated]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      # Unlike the scheduled workflows (see dependency-audit.yml), this one is
      # triggered by a person typing @claude and waiting for a reply, so skipping
      # silently is the worst outcome — they'd never learn why nothing happened.
      # Fail, but say why *on the thread* rather than only in a log the mentioner
      # will not open, and replace claude-code-action's opaque "Environment
      # variable validation failed" with the actual remedy.
      - name: Check for CLAUDE_CODE_OAUTH_TOKEN
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is set."
            exit 0
          fi
          if [ -n "${NUMBER:-}" ]; then
            gh issue comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body \
              "Claude can't respond here: this repository has no \`CLAUDE_CODE_OAUTH_TOKEN\` secret. Run \`claude setup-token\`, then \`gh secret set CLAUDE_CODE_OAUTH_TOKEN -R $GITHUB_REPOSITORY\`." || true
          fi
          echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Run \`claude setup-token\`, then \`gh secret set CLAUDE_CODE_OAUTH_TOKEN -R ${GITHUB_REPOSITORY}\`."
          exit 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          additional_permissions: |
            actions: read
