name: iOS Release

on:
  push:
    # Derived from the products' tag prefixes — see IOS_RELEASE_TAGS. A repo
    # tagging `steps-v1.2.3` has no tag starting with `v`, and a fixed 'v*'
    # filter would mean no tag ever starts a release.
    tags:
{{IOS_RELEASE_TAGS}}
  workflow_dispatch:
    inputs:
      skip_testflight:
        description: 'Skip TestFlight upload (build only)'
        required: false
        # Unquoted. The gates below read this as a boolean (`!inputs.…`) rather
        # than comparing it to the string 'true', so a quoted 'false' default is
        # newly load-bearing: GitHub treats any non-empty string as truthy, and
        # `!'false'` is false — which would silently skip the TestFlight upload
        # on a dispatch where nobody asked it to. A release that builds, signs
        # and quietly uploads nothing is the failure this repo hunts.
        default: false
        type: boolean
      whats_new:
        description: "TestFlight 'What's New' notes (blank = auto-generate from commits)"
        required: false
        default: ''
        type: string
      product:
        # `all` is the default because most projects ship one product, where it
        # is the only correct answer. For a repo shipping a paid app and a free
        # sibling, picking one is usually what you want: an App Store version
        # train closes permanently at READY_FOR_SALE, so dispatching `all` after
        # one app has shipped a version fails that leg with error 90186. This
        # exact failure was observed on a real dispatch before this input
        # existed.
        description: 'Which product to release'
        required: false
        default: all
        type: choice
        options:
{{IOS_PRODUCT_CHOICES}}

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  # Decides WHICH products this run releases, before the matrix exists.
  #
  # A job-level `if:` cannot see the `matrix` context — GitHub exposes only
  # github/needs/vars/inputs there — so a leg cannot skip itself. The set has to
  # be computed first and fed in via fromJSON.
  #
  # Runs on ubuntu because it is jq over a JSON literal: no Xcode, and it must
  # not occupy the dedicated Mac.
  select-products:
    name: Select products
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          # The tag name arrives through the environment, never interpolated into
          # the script body, so a tag containing shell metacharacters is inert.
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          # Defaults to `all` for a tag push, where this input does not exist.
          PRODUCT_INPUT: ${{ inputs.product || 'all' }}
        run: |
          set -euo pipefail
          catalog='{{IOS_PRODUCT_CATALOG}}'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # A dispatch says which product it means, so honour it rather than
            # inferring from the ref — a dispatch runs from a branch, whose name
            # carries no product.
            if [ "$PRODUCT_INPUT" = "all" ]; then
              selected="$catalog"
            else
              selected=$(printf '%s' "$catalog" | jq -c --arg p "$PRODUCT_INPUT" \
                '[ .[] | select(.name == $p) ]')
            fi
          else
            # A tag releases exactly ONE product. An App Store version train
            # closes permanently once its version reaches READY_FOR_SALE, so a
            # tag that fanned out to both apps would drag the already-shipped one
            # back through a closed train and fail with error 90186 — every time,
            # for the life of that version.
            #
            # A product with no tag_prefix matches any tag. That is the
            # single-product case, where "which product does this tag mean" has
            # only one answer.
            selected=$(printf '%s' "$catalog" | jq -c --arg ref "$REF_NAME" \
              '[ .[] | select(.tag_prefix as $p | $p == "" or ($ref | startswith($p))) ]')
          fi

          count=$(printf '%s' "$selected" | jq 'length')
          if [ "$count" -eq 0 ]; then
            # Fail closed. Guessing here either signs a product with another
            # app's credentials or pushes at a version train that has closed.
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::No product named '$PRODUCT_INPUT'. Known products:"
            else
              echo "::error::Tag '$REF_NAME' matches no product's tag_prefix. Declare one, or tag with a known prefix."
            fi
            printf '%s' "$catalog" | jq -r '.[] | "  \(.name): tag_prefix=\(if .tag_prefix == "" then "(any)" else .tag_prefix end)"'
            exit 1
          fi

          echo "Releasing: $(printf '%s' "$selected" | jq -r '[.[].name] | join(", ")')"
          printf 'matrix=%s\n' "$(printf '%s' "$selected" | jq -c '{product: .}')" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    name: Build and Deploy ${{ matrix.product.name }} to TestFlight
    runs-on: [self-hosted, macOS, ARM64, dedicated]
    timeout-minutes: 45
    # One leg per shippable app. A project that declares no [[product]] gets a
    # single entry synthesised from [project], so this is the SAME shape it had
    # before a matrix existed — twelve single-app projects see no behaviour
    # change, and there is no second code path to drift.
    #
    # It exists because two projects ship a paid and a free variant from one
    # repository, and both had to fork this workflow to do it. Forking the most
    # complex asset the lacquer ships is how one of them reached 247 versions
    # behind: every improvement after the fork had to be re-applied by hand, so
    # none were.
    #
    # fail-fast: false — one product failing App Store validation must not
    # cancel the other's upload. They are separate submissions with separate
    # review outcomes, and a shared cancel would make a rejection on one look
    # like a build failure on both.
    needs: select-products
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select-products.outputs.matrix) }}
    permissions:
      # action-gh-release creates the GitHub Release (write covers checkout's read).
      contents: write

    env:
      # The matrix product's identity, hoisted once. Shell steps read $PRODUCT_*;
      # `with:`/`name:` blocks read ${{ matrix.product.* }} directly, since env
      # is not in scope there.
      PRODUCT_NAME: ${{ matrix.product.name }}
      PRODUCT_SCHEME: ${{ matrix.product.scheme }}
      PRODUCT_BUNDLE_ID: ${{ matrix.product.bundle_id }}
      PRODUCT_ASC_APP_ID: ${{ matrix.product.asc_app_id }}
      # `secrets` is not available in a step-level `if`, so the presence check is
      # hoisted to a job-level env var that the dSYM-upload step can gate on.
      # Job-level env IS in scope for `steps[*].if`; a var defined in the step's
      # own `env:` block is NOT, which silently skips the step forever.
      HAS_SENTRY_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Codemagic CLI tools
        run: |
          brew install pipx
          pipx install codemagic-cli-tools==0.68.0
          pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # --user-install: the dedicated runner's system gem dir isn't writable
          # (Gem::FilePermissionError otherwise). Put the user gem bin on PATH so
          # the bare `| xcpretty` pipes below resolve it. Mirrors ios-ci.yml.
          gem install xcpretty -v 0.4.1 --user-install --no-document
          ruby -e 'puts File.join(Gem.user_dir, "bin")' >> "$GITHUB_PATH"

      - name: Fetch signing files
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The SHARED, UNIFIED distribution certificate private key. Every app on
          # this team signs with ONE Apple Distribution cert — the account holds
          # exactly one — so this secret MUST be the same shared key across all
          # apps (source of truth: 1Password "iOS CI Signing Credentials"). Using
          # a per-app key mints a second same-named cert and causes xcodebuild to
          # pick the wrong one on the shared runner ("profile doesn't include
          # signing certificate"). fetch-signing-files pairs the key with the
          # fetched cert; without it the step fails "Cannot save Signing
          # Certificates without certificate private key" (at the cert limit,
          # --create alone can't mint a new keypair).
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          # The certificates dir is SHARED across every app's release pipeline on
          # the dedicated runner. Clear stale certs first so `keychain
          # add-certificates` (below) loads ONLY the freshly-fetched unified cert,
          # never a leftover from another app that would create a duplicate,
          # same-named identity and break signing. The p12s are re-downloadable.
          rm -f "$HOME/Library/Developer/Xcode/UserData/Certificates/"*.p12 || true
          # Bundle id is a POSITIONAL arg in codemagic-cli-tools (there is no
          # --bundle-id flag; passing it errors "unrecognized arguments").
          app-store-connect fetch-signing-files "$PRODUCT_BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create

      - name: Unlock login keychain
        env:
          # Org-level secret (always set): the dedicated runner's login-keychain
          # password.
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Use the runner's EXISTING system login keychain — never create a
          # temporary one. A fresh keychain pops an interactive unlock dialog on
          # the dedicated Mac runner that hangs the job; the login keychain already
          # holds the signing identity. The auto-lock timeout must outlast the
          # job (timeout-minutes: 45) but no more — the final "Lock keychain"
          # step re-locks explicitly, so the unlocked window never outlives the run.
          KEYCHAIN=~/Library/Keychains/login.keychain-db

          # Record the machine's EXISTING settings first, so the final step can
          # put them back. Without this the `-lut` below is a permanent change to
          # a keychain this job does not own.
          #
          # It was permanent, and it was felt. A runner Mac that is also somebody's
          # personal machine ended up with `lock-on-sleep timeout=3600s` on its
          # login keychain — macOS defaults to neither — so it began locking every
          # hour and on every sleep, and Messages signed itself out. The setting
          # outlived the job by days, and nothing in the run said it had changed.
          #
          # Note the direction of the harm: the default is NO timeout, so setting
          # one makes the keychain lock MORE often, not less. This step exists to
          # keep the keychain open across a 45-minute job; on a machine that never
          # locks it, it can only make things worse.
          security show-keychain-info "$KEYCHAIN" 2>&1 | tee "$RUNNER_TEMP/keychain-settings-before.txt"

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"

      - name: Add certificates to keychain
        # No `keychain initialize` — so codemagic adds the fetched cert to the
        # system default (login) keychain we just unlocked, not a fresh temporary
        # one.
        run: keychain add-certificates

      - name: Grant codesign access to signing keys
        env:
          # Org-level secret (always set): the dedicated runner's login-keychain
          # password.
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Grant codesign/productsign non-interactive access to the signing
          # keys. Must run AFTER `keychain add-certificates`: the partition-list
          # ACL only covers keys present at the time it is set, so it has to
          # include the freshly added ones.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain-db

      - name: Set Xcode project code signing
        run: |
          # Remove stale automatic "iOS Team Provisioning Profile" entries from the
          # SHARED profiles dir before use-profiles runs. The archive step's
          # -allowProvisioningUpdates creates these development/automatic profiles,
          # and they persist across runs. use-profiles globs this dir and would
          # otherwise pick a DEVELOPMENT Team profile over the freshly-fetched App
          # Store distribution profile — producing a development-signed archive that
          # App Store upload rejects with "Invalid Provisioning Profile … Missing
          # code-signing certificate" (error 90161). Only dev Team profiles are
          # removed; App Store distribution profiles (which concurrent releases on
          # this shared runner rely on) are left untouched.
          PDIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          if [ -d "$PDIR" ]; then
            find "$PDIR" -name '*.mobileprovision' -print0 | while IFS= read -r -d '' p; do
              name=$(security cms -D -i "$p" 2>/dev/null | plutil -extract Name raw - -o - 2>/dev/null)
              case "$name" in
                "iOS Team Provisioning Profile"*) rm -f "$p" ;;
              esac
            done
          fi
          xcode-project use-profiles --export-options-plist {{COMPONENT_PREFIX}}ExportOptions.plist

      - name: Increment build number
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          # Requires the numeric Apple ID (from App Store Connect → App Information).
          # asc_app_id comes from the matrix product (or [project] when only one).
          RAW=$(app-store-connect get-latest-testflight-build-number "$PRODUCT_ASC_APP_ID" 2>&1)
          echo "get-latest-testflight-build-number output: $RAW"
          LATEST=$(echo "$RAW" | grep -E '^[0-9]+$' | tail -1)
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            echo "FATAL: Could not parse build number from output above."
            echo "Ensure asc_app_id ($PRODUCT_ASC_APP_ID) is the numeric Apple ID (not bundle ID) from App Store Connect."
            exit 1
          fi
          NEXT=$((LATEST + 1))
          echo "Build number: $LATEST -> $NEXT"
          cd {{COMPONENT_PREFIX}}. && agvtool new-version -all "$NEXT"

{{IOS_PRODUCT_SECRETS}}
      - name: Clean stale build intermediates
        run: |
          # Gitignored output from a prior run persists between runs on the
          # dedicated runner; stale intermediates cause Swift incremental-
          # compilation exit-65 crashes during archive. Remove the archive/export
          # output dir the workflow creates.
          rm -rf "{{COMPONENT_PREFIX}}build"

      - name: Build and archive
        run: |
          set -o pipefail
          EXIT_CODE=0
          xcodebuild archive \
            -project "{{XCODEPROJ}}" \
            -scheme "$PRODUCT_SCHEME" \
            -configuration Release \
            -archivePath "{{COMPONENT_PREFIX}}build/$PRODUCT_NAME.xcarchive" \
            -allowProvisioningUpdates \
            2>&1 | xcpretty || EXIT_CODE=$?
          # Exit code 65 is a known spurious xcodebuild failure. Treat as success
          # ONLY if the .xcarchive was actually produced; otherwise fail. (pipefail
          # ensures $EXIT_CODE reflects xcodebuild's status, not xcpretty's.)
          if [ $EXIT_CODE -eq 65 ] && [ -d "{{COMPONENT_PREFIX}}build/$PRODUCT_NAME.xcarchive" ]; then
            echo "xcodebuild exited 65 but archive exists — treating as success."
            EXIT_CODE=0
          fi
          exit $EXIT_CODE

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "{{COMPONENT_PREFIX}}build/$PRODUCT_NAME.xcarchive" \
            -exportOptionsPlist {{COMPONENT_PREFIX}}ExportOptions.plist \
            -exportPath {{COMPONENT_PREFIX}}build/ \
            2>&1 | xcpretty

      - name: Prepare TestFlight release notes
        id: whats_new
        # `github.event.inputs` is null on a tag push, so `!= 'true'` used to let
        # this through by coincidence rather than by intent — and would have
        # flipped silently had the input's default changed. Say both halves: a
        # release tag always uploads, and only a manual run may decline.
        # `inputs.skip_testflight` is a real boolean, unlike the string the
        # `github.event.inputs` form yields.
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_testflight }}
        env:
          # Untrusted workflow_dispatch input — passed via env and only ever
          # written to a file with a quoted variable, never interpolated into
          # the script body, so metacharacters cannot inject shell commands.
          WHATS_NEW_INPUT: ${{ inputs.whats_new }}
        run: |
          set -euo pipefail
          notes_file="whats-new.txt"
          if [ -n "${WHATS_NEW_INPUT:-}" ]; then
            # Explicit notes provided — write verbatim (quoted var, no eval).
            printf '%s\n' "$WHATS_NEW_INPUT" > "$notes_file"
          else
            # Auto-generate from conventional-commit feat/fix/perf subjects since
            # the previous tag. git log output is redirected straight to a file —
            # never eval'd — so subjects with shell metacharacters are inert.
            last_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$last_tag" ]; then range="${last_tag}..HEAD"; else range="HEAD"; fi
            git log "$range" --no-merges --format='%s' \
              | grep -iE '^(feat|fix|perf)(\([^)]*\))?!?:' \
              | sed -E 's/^[a-zA-Z]+(\([^)]*\))?!?:[[:space:]]*/- /' \
              | cut -c1-200 \
              > "$notes_file" || true
            if [ ! -s "$notes_file" ]; then
              printf '%s\n' "Bug fixes and performance improvements." > "$notes_file"
            fi
          fi
          # App Store Connect caps "What's New" at 4000 chars — trim with headroom.
          head -c 3900 "$notes_file" > "${notes_file}.capped"
          mv "${notes_file}.capped" "$notes_file"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      # Runs BEFORE the TestFlight upload on purpose: a TestFlight failure
      # (beta-review collision, ASC outage) must not strand the dSYMs, or the
      # crashes from that build arrive unsymbolicated and stay that way.
      # Skipped silently when a project has no Sentry secrets configured.
      - name: Upload dSYMs to Sentry
        if: ${{ env.HAS_SENTRY_TOKEN == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          brew list sentry-cli >/dev/null 2>&1 || brew install getsentry/tools/sentry-cli
          # No --include-sources: it ships source code to Sentry, which is not a
          # default a fleet-wide template should make on a project's behalf. Add
          # it per-project if you want source context in stack traces.
          sentry-cli debug-files upload \
            "{{COMPONENT_PREFIX}}build/$PRODUCT_NAME.xcarchive/dSYMs"

      - name: Upload to TestFlight
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_testflight }}
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_CONTENT }}
          NOTES_FILE: ${{ steps.whats_new.outputs.notes_file }}
        run: |
          # xcodebuild names the exported IPA after the app's DISPLAY name, not
          # the project — so a name derived from the project is only ever right by luck.
          # Any project whose CFBundleDisplayName differs from its project name,
          # or that is ever renamed, archives and signs perfectly and then dies
          # here, at the last step, with the build already paid for. Discover the
          # file instead of reconstructing its name.
          ipa_directory="{{COMPONENT_PREFIX}}build"
          ipa=$(find "$ipa_directory" -maxdepth 1 -type f -name '*.ipa' -print -quit)
          if [ -z "$ipa" ]; then
            echo "::error::No IPA found in $ipa_directory"
            exit 1
          fi
          echo "Publishing $ipa"
          app-store-connect publish \
            --path "$ipa" \
            --whats-new "$(cat "$NOTES_FILE")"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: '${{ matrix.product.name }}-${{ github.ref_name }}.ipa'
          # Glob, for the same reason the publish step discovers its file: the
          # export is named after the app's display name, not the project.
          path: "{{COMPONENT_PREFIX}}build/*.ipa"
          # 1 day, not 30: for a tagged release the same .ipa is attached to the
          # GitHub Release below and kept indefinitely, so the artifact copy is
          # redundant storage. For an untagged manual run it is a 24h safety net
          # — past that, rebuild.
          retention-days: 1
          if-no-files-found: warn

      - name: Upload dSYM artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: '${{ matrix.product.name }}-${{ github.ref_name }}.dSYM'
          path: "{{COMPONENT_PREFIX}}build/${{ matrix.product.name }}.xcarchive/dSYMs/*.dSYM"
          # This said 90, and asserted that dSYMs are kept longer because they
          # are not reproducible from a later build and crash reports arrive for
          # weeks. The reasoning is right; the number was fiction. An
          # organisation (or repository) artifact-retention limit silently
          # truncates any larger value, and this fleet's is 2 days — so the
          # comment promised three months of symbolication that never existed,
          # which is worse than a short retention honestly stated. Someone would
          # only discover it on the day they went looking for a dSYM.
          #
          # 2 is that limit, stated. The DURABLE copy is Sentry: the "Upload
          # dSYMs to Sentry" step above stores them indefinitely, which is what
          # actually symbolicates a crash report weeks later.
          #
          # NOTE: that step skips silently when a project has no Sentry secrets,
          # so a project without Sentry has only what this line says and no
          # more. Raise the org limit AND this number together if that is not
          # acceptable — raising one alone changes nothing.
          retention-days: 2
          if-no-files-found: ignore

      # A .dSYM is a DIRECTORY bundle. upload-artifact zips directories on the
      # way up, so the artifact path above works; a release asset must be a
      # single file, so it has to be zipped explicitly here or the upload
      # silently attaches nothing.
      - name: Package dSYMs for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          dir="{{COMPONENT_PREFIX}}build/$PRODUCT_NAME.xcarchive/dSYMs"
          if [ ! -d "$dir" ] || [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
            echo "::warning::no dSYMs at $dir — the release will carry no symbols"
            exit 0
          fi
          # -r for the bundle contents, and zip from inside so the archive holds
          # App.dSYM rather than a chain of build directories.
          (cd "$dir" && zip -qry "$OLDPWD/$PRODUCT_NAME-${GITHUB_REF_NAME}.dSYMs.zip" .)
          ls -lh "$PRODUCT_NAME-${GITHUB_REF_NAME}.dSYMs.zip"

      # Release assets, not Actions artifacts, are where symbols belong for the
      # long term. They are kept indefinitely, they are NOT metered as Actions
      # storage, and they sit beside the exact .ipa they symbolicate — so
      # retrieving symbols for a shipped build is one download from the release
      # that shipped it, with no second service to remember or pay for.
      #
      # This does not replace the Sentry upload above, which is what
      # symbolicates automatically. It is the copy that survives leaving Sentry,
      # and the one that works for a crash report Sentry never saw (an Apple
      # .ips a user emails you, say).
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            {{COMPONENT_PREFIX}}build/*.ipa
            ${{ matrix.product.name }}-${{ github.ref_name }}.dSYMs.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore keychain settings and lock
        if: always()
        run: |
          set -uo pipefail
          KEYCHAIN=~/Library/Keychains/login.keychain-db

          # Put back whatever this machine had before the job, rather than
          # assuming a default. A dedicated runner and someone's laptop have
          # legitimately different policies, and CI owns neither.
          before="$(cat "$RUNNER_TEMP/keychain-settings-before.txt" 2>/dev/null || true)"
          args=()
          case "$before" in
            *lock-on-sleep*) args+=(-l) ;;
          esac
          secs="$(printf '%s' "$before" | sed -n 's/.*timeout=\([0-9]*\)s.*/\1/p')"
          if [ -n "$secs" ]; then
            args+=(-u -t "$secs")
          fi
          # No flags at all means no timeout and no lock-on-sleep, which is the
          # macOS default and what `no-timeout` in the captured output means.
          security set-keychain-settings "${args[@]+"${args[@]}"}" "$KEYCHAIN" || true
          echo "restored: $(security show-keychain-info "$KEYCHAIN" 2>&1)"

          # Locking is still right: the signing identity must not stay reachable
          # after the job. It is momentary — the next use prompts once — unlike
          # the settings change above, which lasted days.
          security lock-keychain "$KEYCHAIN"

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [select-products, build-and-deploy]
    # `always()` rather than `failure()`, because a failed selection SKIPS
    # build-and-deploy rather than failing it, and a job whose need was skipped
    # is itself skipped. Under `failure()` a tag that matched no product would
    # abort the release and notify nobody — the silent-failure mode this whole
    # job exists to prevent.
    if: always() && contains(needs.*.result, 'failure')
    steps:
      - name: Send failure notification
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Build failed for $REF_NAME"
          # Add Slack/Discord notification here if needed
