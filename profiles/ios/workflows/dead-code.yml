name: Dead Code Analysis

on:
  schedule:
    # Monday. quality-review.yml deliberately sits on Wednesday rather than
    # sharing this slot — see the reasoning there. Both are self-hosted macOS
    # jobs of roughly half an hour and the fleet has one Mac, so the day they
    # run on is what decides how long the queue is.
    #
    # Still the same minute in all ~12 iOS repositories, because the cron is a
    # literal in a shipped template. Spreading them apart from each other needs
    # a per-project token; internal/tokens has none, and this change does not
    # add one.
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # Threshold for warning annotations in workflow output (issues are created regardless of count)
  DEAD_CODE_THRESHOLD: 5

jobs:
  periphery:
    name: iOS - Periphery Scan
    runs-on: [self-hosted, macOS, ARM64, dedicated]
    outputs:
      count: ${{ steps.analyze.outputs.count }}
      has_dead_code: ${{ steps.analyze.outputs.has_dead_code }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run Periphery
        run: |
          set -euo pipefail
          cd {{COMPONENT_PREFIX}}.

          # This step used to end in "|| true", writing straight onto the
          # artifact path. The two together made the whole job unfailable, and
          # core/CLAUDE.core.md bans the first for exactly this: the redirect
          # CREATES periphery-report.json before periphery has run, so a scan
          # that dies still leaves a file behind, the "is the report missing"
          # guard below never fires, and jq on the wreckage reports zero.
          #
          # Measured against periphery 3.8 with the shipped config, all three
          # shapes of a failed scan reported GREEN: an unresolvable project:
          # (exit 1, EMPTY stdout) printed "Found **** unused declarations",
          # and a partial write or a prose error on stdout printed
          # "No dead code found!". Thirty Mac-minutes a week, per repository,
          # to reach a conclusion the scan never supported.
          #
          # So: a separate .part file, an explicit exit code, and no swallowing.
          rm -f periphery-report.json periphery-report.json.part

          # An "if" condition, not "|| true": under set -e this is the one form
          # that reads the status without discarding it.
          if periphery scan --config .periphery.yml --format json > periphery-report.json.part; then
            rc=0
          else
            rc=$?
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::periphery scan exited $rc. This is a FAILED scan, not a clean one — see the log above for what periphery could not do."
            exit "$rc"
          fi

          # Exit 0 is necessary and not sufficient. periphery warns rather than
          # fails on a config key it does not recognise, and a scan that indexed
          # nothing can still exit 0 with output jq cannot read as findings. The
          # only report worth believing is a JSON array, so demand one here
          # rather than letting the counting step interpret rubble.
          if ! jq -e 'type == "array"' periphery-report.json.part > /dev/null; then
            echo "::error::periphery exited 0 but did not emit a JSON array. The scan produced no usable report, which is a failure and must not be read as zero dead code."
            head -c 400 periphery-report.json.part
            exit 1
          fi

          mv periphery-report.json.part periphery-report.json

      - name: Upload Report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: periphery-report
          path: "{{COMPONENT_PREFIX}}periphery-report.json"
          retention-days: 1

      - name: Analyze Results
        id: analyze
        run: |
          set -euo pipefail
          cd {{COMPONENT_PREFIX}}.

          # Fail closed. The scan step only leaves this file behind when the
          # scan SUCCEEDED and emitted a JSON array, so its absence here cannot
          # mean "there is no dead code" — it means something went wrong between
          # the two steps. Answering count=0 to that, which is what this branch
          # used to do, is the same silent green the scan step's "|| true" gave.
          if [ ! -f periphery-report.json ]; then
            echo "::error::periphery-report.json is missing after a scan that reported success. Nothing was counted; this is not a clean result."
            exit 1
          fi

          # No "2>/dev/null || echo 0". That turned every way jq can fail — a
          # truncated report, a schema change, jq missing from the runner — into
          # "no dead code found", and hid the tool's own error message while
          # doing it. core/CLAUDE.core.md calls suppressing stderr the most
          # dangerous of these precisely because it hides the TOOL failing.
          COUNT=$(jq 'length' periphery-report.json)
          case "$COUNT" in
            '' | *[!0-9]*)
              echo "::error::jq reported a count of '$COUNT', which is not a number. The report could not be counted, so no conclusion about dead code is available."
              exit 1
              ;;
          esac
          {
            echo "count=$COUNT"
            if [ "$COUNT" -gt "0" ]; then
              echo "has_dead_code=true"
            else
              echo "has_dead_code=false"
            fi
          } >> "$GITHUB_OUTPUT"

          # Generate detailed summary with one atomic append.
          {
            echo "## iOS Dead Code Analysis"
            echo ""

            if [ "$COUNT" -eq "0" ]; then
              echo "No dead code found!"
              exit 0
            fi

            echo "Found **$COUNT** unused declarations:"
            echo ""

            # Group by kind and show details
            echo "### By Category"
            echo ""
            echo "| Category | Count |"
            echo "|----------|-------|"

            jq -r 'group_by(.kind) | .[] | "\(.[ 0].kind)|\(length)"' periphery-report.json | \
            while IFS='|' read -r kind count; do
              echo "| $kind | $count |"
            done

            echo ""
            echo "### Details"
            echo ""
            echo "<details>"
            echo "<summary>Click to expand full list</summary>"
            echo ""
            echo "| File | Line | Kind | Name |"
            echo "|------|------|------|------|"

            # Show up to 50 items
            jq -r '.[:50] | .[] | "\(.location.file | split("/") | last)|\(.location.line)|\(.kind)|\(.name)"' periphery-report.json | \
            while IFS='|' read -r file line kind name; do
              echo "| \`$file\` | $line | $kind | \`$name\` |"
            done

            if [ "$COUNT" -gt "50" ]; then
              echo ""
              echo "_...and $((COUNT - 50)) more. See full report in artifacts._"
            fi

            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -gt "$DEAD_CODE_THRESHOLD" ]; then
            echo "::warning::Found $COUNT unused iOS code declarations (threshold: $DEAD_CODE_THRESHOLD)"
          fi

  create-issue:
    name: Create Tracking Issue
    runs-on: ubuntu-latest
    needs: [periphery]
    permissions:
      # `gh issue list/comment/create` needs issues; checkout needs contents.
      # `gh label create` needs issues:write too, which this already grants —
      # worth stating, because a missing label is what silently broke this job in
      # every iOS repository until the labels were created here.
      contents: read
      issues: write
    if: >
      always() && (
        needs.periphery.result == 'success' && needs.periphery.outputs.has_dead_code == 'true'
      )
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check for existing issue
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Look for an open issue with the dead-code label
          EXISTING=$(gh issue list --label "dead-code" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            {
              echo "exists=true"
              echo "issue_number=$EXISTING"
            } >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download reports
        uses: actions/download-artifact@v8.0.1
        with:
          path: reports

      - name: Create or update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IOS_COUNT: ${{ needs.periphery.outputs.count }}
          EXISTING_ISSUE: ${{ steps.check.outputs.exists }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Use default values to handle undefined outputs
          TOTAL=${IOS_COUNT:-0}
          DATE=$(date +%Y-%m-%d)

          # Build iOS section with fallback for empty results
          IOS_DETAILS=""
          if [ -f reports/periphery-report/periphery-report.json ]; then
            IOS_DETAILS=$(jq -r '.[:30] | .[] | "- `\(.name)` (\(.kind)) in `\(.location.file | split("/") | last)`:\(.location.line)"' reports/periphery-report/periphery-report.json 2>/dev/null || echo "")
          fi
          if [ -z "$IOS_DETAILS" ]; then
            IOS_DETAILS="No iOS dead code found."
          fi

          if [ "$EXISTING_ISSUE" == "true" ]; then
            # Update existing issue with a comment
            gh issue comment "$ISSUE_NUMBER" --body "## Update - $DATE

          Latest scan found **$TOTAL** dead code items:
          - iOS: $IOS_COUNT

          <details>
          <summary>iOS Details</summary>

          $IOS_DETAILS

          </details>

          See [workflow run](https://github.com/$REPOSITORY/actions/runs/$RUN_ID) for full details."

            echo "Updated existing issue #$ISSUE_NUMBER"
          else
            # Create the labels first. `gh issue create --label` FAILS on a label
            # the repository does not have — "could not add label: 'dead-code'
            # not found" — and that killed this job in all nine iOS repositories,
            # every one of which was missing both. The scan itself had been
            # working; nothing ever filed the issue it produced.
            #
            # `|| true` because "already exists" is a success condition here, and
            # this runs on every scan. Creating them here rather than documenting
            # a manual step keeps a fresh repository working on its first run.
            gh label create dead-code --color ededed \
              --description "Unused declarations found by Periphery" 2>/dev/null || true
            gh label create maintenance --color ededed \
              --description "Housekeeping, not a user-facing change" 2>/dev/null || true

            # Create new issue
            gh issue create \
              --title "Dead Code Cleanup - $DATE ($TOTAL items)" \
              --label "dead-code,maintenance" \
              --body "## Dead Code Analysis - $DATE

          Automated scan found potential dead code that should be investigated and removed.

          ### Summary

          | Platform | Issues Found |
          |----------|--------------|
          | iOS (Periphery) | $IOS_COUNT |
          | **Total** | **$TOTAL** |

          ### iOS Dead Code

          <details>
          <summary>Click to expand iOS issues ($IOS_COUNT items)</summary>

          $IOS_DETAILS

          </details>

          ### Action Items

          - [ ] Review each item to confirm it's truly unused
          - [ ] Remove confirmed dead code
          - [ ] Run tests to ensure nothing breaks
          - [ ] Close this issue when resolved

          ---
          *This issue was automatically created by the [Dead Code Analysis](https://github.com/$REPOSITORY/actions/runs/$RUN_ID) workflow.*"

            echo "Created new issue"
          fi
