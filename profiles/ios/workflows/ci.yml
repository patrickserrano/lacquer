name: iOS CI

on:
  workflow_dispatch:
  pull_request:
    # No path filter on purpose: the workflow must run on EVERY PR so the single
    # required check (CI OK) always reports. A path-filtered workflow that doesn't
    # run leaves required checks stuck "pending" and blocks docs-only PRs (forcing
    # an admin bypass). Heavy jobs are instead path-gated at the job level via the
    # `changes` job's `code` output.
    branches: [main, develop, 'feat/*', 'fix/*']
  push:
    branches: [main]
    paths:
      - '{{COMPONENT_PREFIX}}**'

# No job talks to the GitHub API (caches/artifacts/step summaries use the
# Actions runtime token, not GITHUB_TOKEN) — checkout is all the token does.
# Pinned explicitly rather than inherited from `xcode-select`. On a shared
# self-hosted host, whatever xcode-select points at is host state that changes
# without a PR — see the "Verify the toolchain" step for the incident this
# addresses. This names the path; the step asserts the VERSION, because these
# runners carry one Xcode upgraded in place and a versioned path would not exist.
env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    # A diff, plus (only when the `lacquer` filter fires) the drift audit folded
    # in at the end. No Xcode either way, so it runs on Blacksmith rather than
    # tying up the dedicated Mac (see CLAUDE.md "CI Runners").
    #
    # 2vcpu-arm, not 4vcpu-x64, and the reason is billing rather than speed.
    # Blacksmith bills vCPU-weighted minutes with a ONE-MINUTE MINIMUM per job:
    # a 4-vCPU job that finishes in 23s still bills 4 minutes. Measured over a
    # week, this job ran 67 times at a 23s average and accounted for 288 billable
    # minutes -- more than every test, lint and build job on the fleet combined,
    # while doing nothing but `git diff` and `grep`. Halving the vCPUs halves the
    # weighting, and ARM carries a x0.625 rate multiplier on top, so the same
    # work bills 1.25 minutes instead of 4.
    #
    # ARM is safe here specifically because the drift audit already resolves its
    # tarball by `uname -m` (aarch64|arm64 -> arm64) and lacquer publishes a
    # linux_arm64 build. A job that downloaded an amd64-only binary must NOT be
    # moved without adding that mapping first -- the failure is a binary that
    # will not execute, discovered on someone's PR.
    #
    # The supabase profile is deliberately left on 4vcpu-x64: its jobs drive
    # Postgres, pgTAP and the Supabase CLI, and the saving is not worth
    # revalidating that stack on a different architecture.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Bounded because this job now downloads a lacquer release and runs
    # `lacquer audit` when the `lacquer` filter fires; it used to be a diff and
    # nothing else.
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lacquer: ${{ steps.filter.outputs.lacquer }}
      # Empty when the drift audit below did not run; `pass` or `fail` when it did.
      drift: ${{ steps.drift.outputs.result }}
      xcodeproj: ${{ steps.filter.outputs.xcodeproj }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        name: Check for code / view changes
        run: |
          # `xcodeproj` gates Test/Build (Release): a component declared per the
          # archetype rule before any code exists (e.g. a Phase-0 backend-first
          # project) has neither {{XCODEPROJ}} committed nor a project.yml to
          # regenerate it from, so `xcodebuild` has nothing to build or test yet.
          # project.yml counts as "present" too — the Generate Xcode project step
          # in each job regenerates {{XCODEPROJ}} from it before anything else
          # runs, so this stays true for the common gitignored-xcodeproj case.
          # Independent of event type (unlike code/lacquer below), since
          # it reads the checked-out tree directly rather than a diff.
          xcodeproj_present=false
          if [ -d "{{XCODEPROJ}}" ] || [ -f "{{COMPONENT_PREFIX}}project.yml" ]; then
            xcodeproj_present=true
          fi
          echo "xcodeproj=$xcodeproj_present" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push / manual dispatch: treat as a code change so the build/test
            # jobs run. `lacquer` is unconditionally true here on purpose — a push
            # to main is the backstop that catches the drift a PR gate cannot see
            # (an exclusion or baseline relaxation whose expiry simply passed).
            # Grouped rather than three separate `>>` appends, which shellcheck
            # flags as SC2129 once there are three of them.
            {
              echo "code=true"
              echo "lacquer=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Three-dot: against the merge base, not the base branch tip. Two-dot
          # folds in whatever landed on main after the PR opened, so a docs-only
          # PR starts reporting code changes and wakes the heavy Mac jobs.
          changed="$(git diff --name-only "$base...$head")"
          # `code` gates the heavy build/lint/test jobs: run them unless the PR is
          # docs-only, so CI OK still reports green on docs PRs (no admin bypass).
          # This is an INVERTED test (any non-docs change -> code=true) on purpose:
          # a path ALLOWLIST anchored on {{COMPONENT_PREFIX}} produces the regex
          # `^(|...)` for a root-layout project (empty prefix) — an empty ERE
          # alternative that some greps reject. The deny-list below has no prefix
          # and no empty alternative, so it is layout-independent and fails safe
          # (over-run, not under-run). It is written portably (`-cv` count, no
          # `-qv`) so it behaves the same on this job's ubuntu GNU grep and on the
          # self-hosted runner's ugrep, which mis-reports `grep -q -v`.
          nondocs=$(echo "$changed" | grep -cvE '(\.md$|^docs/|^LICENSE$|^\.gitignore$)' || true)
          if [ "${nondocs:-0}" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # `lacquer` gates the drift audit at the end of this job, which clones
          # the lacquer at its latest release tag, downloads the released binary
          # built from that same tag, and runs `lacquer audit`.
          # That used to be a job of its own and so cost a whole billed minute
          # (Actions bills a one-minute MINIMUM per job) on a PR that cannot
          # possibly have drifted; it is now three steps here, and this filter is
          # what keeps them from running at all. Unlike `code` above this is an
          # ALLOWLIST: a source-only PR is not docs-only, so the deny-list shape
          # would keep waking the audit on nearly every PR, which is the cost
          # being removed.
          # It is deliberately WIDER than the set audit actually reads — a false
          # positive costs one minute, a false negative silently stops detecting
          # drift — and covers all three classes of audit input:
          #   1. every destination `lacquer sync` writes: the skills/commands/
          #      agents dirs (.claude, .codex, .agents), .github/**, scripts/**,
          #      the managed CLAUDE.md / AGENTS.md and .gitignore regions, and each profile's
          #      config files (.swiftlint.yml, biome.json, deno.jsonc, ...), which
          #      land under the component dir rather than the repo root;
          #   2. .lacquer.toml and .lacquer.lock, which drive every token, every
          #      exclusion and every baseline relaxation;
          #   3. the markers `audit` RE-DETECTS stacks from and the pbxproj the
          #      baseline check reads — audit exits 6 (undeclared stack) or 4
          #      (baseline violation) on those with no managed file touched at all.
          # Matched at any depth with `(^|/)` rather than anchored on the
          # component prefix, for the same reason the deny-list above carries no
          # prefix: an empty prefix produces the empty ERE alternative `^(|...)`
          # that some greps reject.
          lacquer_paths='(^|/)\.gitignore$|(^|/)\.lacquer\.(toml|lock)$|(^|/)(CLAUDE|AGENTS)\.md$|(^|/)\.(claude|codex|agents|github)/|(^|/)scripts/|(^|/)(Brewfile|lefthook\.yml|\.mcp\.json|\.pre-commit-config\.yaml)$|(^|/)(\.swiftlint\.yml|\.swiftlint-docs\.yml|\.swiftformat|Secrets\.xcconfig\.example)$|(^|/)(\.env\.schema|tsconfig\.base\.json|typedoc\.json|biome\.json|deno\.jsonc)$|(^|/)(package\.json|Cargo\.toml|go\.mod|Package\.swift|project\.yml)$|(^|/)supabase/config\.toml$|\.xcodeproj/'
          if echo "$changed" | grep -qE "$lacquer_paths"; then
            echo "lacquer=true" >> "$GITHUB_OUTPUT"
          else
            echo "lacquer=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- lacquer drift ----
      #
      # This used to be a separate `No lacquer drift` job. It is one checkout, a
      # binary download and one `lacquer audit` — a measured ~24s median across
      # the fleet back when it still COMPILED lacquer — and Actions bills a
      # MINIMUM OF ONE MINUTE PER JOB, so as its own job it spent a whole billed
      # minute on 24 seconds of work every time it fired. Cost here is job COUNT,
      # not job duration, so the only way to make it cheaper is to stop it being
      # a job. Folded in, it costs nothing at all when `lacquer` is false, and
      # shares this job's already-billed minute when it is true — this job's own
      # median is 13s, so the pair still lands inside one minute on the large
      # majority of runs.
      #
      # The trade-off, stated plainly: drift is no longer a separately-named
      # status check. That is safe only while no repo requires it BY NAME in
      # branch protection. Re-measured across all 17 non-archived repos: 14
      # require exactly "CI OK"; dailybread requires "Build (Release), Lint +
      # Test"; Windsock and dailybread-image-proxy require NOTHING AT ALL. None
      # requires "No lacquer drift", and there are no rulesets at repo or org
      # level. If a repo ever does require it by name, this has to go back to
      # being its own job.
      #
      # The three exceptions are not a footnote — they are the reason `lacquer
      # protection` exists. GitHub counts a `skipped` conclusion as SATISFYING a
      # required check, so requiring anything but the always-running aggregate
      # is requiring something a skip can satisfy: on dailybread PR #482 both
      # required checks were skips, and nothing ran. Run `lacquer protection
      # --roster ...` to re-measure rather than trusting this paragraph, which
      # is a snapshot and will age.
      #
      # The verdict leaves via an OUTPUT rather than by failing this job. Failing
      # `changes` would skip every job that `needs` it, so a drift finding would
      # suppress the lint/test results on the very PR you need them for. The
      # audit therefore never exits non-zero; `ci-ok` — the required check —
      # reads the output and fails on it.

      # Resolve the lacquer version from THIS PROJECT'S LOCK, not from the newest
      # release. `.lacquer.lock` records the version the project actually synced
      # with, and that is the only version whose output can meaningfully be
      # compared against these files.
      #
      # Resolving `releases/latest` instead — which this used to do — made every
      # lacquer release retroactively "drift" all sixteen repos at once, so a
      # one-line comment fix upstream turned into a fleet-wide re-sync just to
      # get CI green again. That inverted what the check is for: drift is
      # supposed to mean "someone hand-edited a file the lacquer owns", not "the
      # lacquer moved on and this project has not been re-synced yet". Being
      # BEHIND is not drift; it is a normal, deliberate state that `lacquer
      # audit` reports as its own category and that a sync resolves when someone
      # chooses to run one.
      #
      # It is also free: no network call, no redirect to parse, and none of
      # api.github.com's 60-requests-per-hour unauthenticated budget, which every
      # runner behind one NAT address shares.
      - name: Resolve the lacquer version this project synced with
        id: lacquerrel
        # Pinned to the repo root. .lacquer.lock lives there, and this job may
        # DEFAULT to a component subdirectory -- momfriend's web component is
        # "admin/.", its supabase one "server/". Without this the lookup reads
        # admin/.lacquer.lock, finds nothing, and reports the project as never
        # synced. The "Prove the checks can fail" step below already carried
        # this pin, with a comment saying why; the version-resolve step added
        # beside it did not, and broke every MULTI-COMPONENT project in the
        # fleet at once while single-component ones stayed green.
        working-directory: "."
        if: steps.filter.outputs.lacquer == 'true'
        run: |
          set -uo pipefail
          # No lock means the project has never been synced, so there is no
          # baseline to attribute drift against. The audit step below says so and
          # reports a FAILURE rather than a silent pass.
          [ -f .lacquer.lock ] || exit 0
          # Plain grep rather than jq: jq is not guaranteed on the self-hosted
          # Mac, and this is one well-known scalar field.
          version=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' .lacquer.lock \
            | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          # Publish the tag only when the version LOOKS like one. A truncated or
          # reshaped lock would otherwise be handed to `ref:` verbatim and then
          # into a download URL.
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) echo "tag=v$version" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::Could not read a lacquer version from .lacquer.lock (got '$version')." ;;
          esac
        # continue-on-error on the two SETUP steps, not on the audit. Now that
        # this shares a job with the path filter, a hiccup resolving the version
        # or fetching the lacquer must not take the whole workflow down with it.
        # The audit step below detects the gap and reports a drift FAILURE —
        # never a silent pass.
        continue-on-error: true

      - name: Fetch the lacquer
        # lacquer is a public repo, so this needs no token.
        #
        # PINNED TO THE RELEASE TAG rather than left on the default branch,
        # because the audit below runs the RELEASE BINARY for that tag against
        # this checkout. lacquer compares the VERSION embedded in the binary at
        # compile time against the VERSION under LACQUER_ROOT and treats a
        # mismatch as a STALE BINARY (internal/rootcheck): today's profiles
        # rendered with whatever day's logic the binary happens to hold, reported
        # as success either way — which is how a 1.3.0 binary rewrote a project's
        # lefthook.yml from 135 lines to 60. Checking out `main` while
        # downloading the last TAG would manufacture exactly that mismatch for
        # the whole window between a merge and its release publishing, and that
        # window is real: release.yml fires on any push touching VERSION and
        # every merge to main bumps it, so main is ahead of the tag for as long
        # as the release job takes. Pinning both to one tag removes the window
        # rather than racing it.
        if: steps.filter.outputs.lacquer == 'true' && steps.lacquerrel.outputs.tag != ''
        uses: actions/checkout@v7
        with:
          repository: patrickserrano/lacquer
          path: .lacquer-checkout
          ref: ${{ steps.lacquerrel.outputs.tag }}
        # Same reasoning as the step above.
        continue-on-error: true

      - name: Audit for drift
        id: drift
        if: steps.filter.outputs.lacquer == 'true'
        env:
          # Through the environment rather than inline `${{ }}`: this value is a
          # redirect target read off the network, and it ends up in a URL.
          LACQUER_TAG: ${{ steps.lacquerrel.outputs.tag }}
        run: |
          # `-e` is deliberately absent: this step must never exit non-zero (see
          # the block comment above). `result` starts at `fail` and the EXIT trap
          # publishes whatever it holds, so every path that leaves this script
          # early is reported as a failure rather than as a silent pass.
          set -uo pipefail
          result=fail
          publish() { echo "result=$result" >> "$GITHUB_OUTPUT"; }
          trap publish EXIT

          if [ ! -f .lacquer.toml ]; then
            echo "::notice::No .lacquer.toml — this project is not lacquer-managed."
            result=pass
            exit 0
          fi
          if [ -z "${LACQUER_TAG:-}" ] || [ ! -f .lacquer-checkout/VERSION ]; then
            echo "::error::The drift audit could not be set up — the lacquer release did not resolve, or its checkout is missing, so drift was NOT checked on this PR."
            exit 0
          fi
          if [ ! -f .lacquer.lock ]; then
            # Without a lock baseline, audit cannot tell "the project edited this"
            # from "the lacquer moved on", so every unit reads as untracked and
            # nothing can block. Say so instead of reporting a green pass.
            echo "::warning::No .lacquer.lock — this project has never been synced, so drift cannot be attributed. Run \`lacquer sync\` to establish the baseline."
          fi
          # DOWNLOAD the released binary; do not compile one. This step used to
          # install a Go toolchain and compile lacquer from source on every audit
          # that fired — 122 times in the six days after the fleet moved back to
          # billed runners. v1.15.0 publishes static (CGO_ENABLED=0) linux
          # amd64/arm64 tarballs, so there is no toolchain to install, no module
          # cache to restore and nothing left to compile.
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            # Deliberately no default guess: the wrong tarball is a binary that
            # cannot execute, and a binary that cannot execute must never be the
            # thing that reports "no drift".
            *) echo "::error::Unsupported runner architecture $(uname -m) — drift was NOT checked on this PR."; exit 0 ;;
          esac
          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            *) echo "::error::Unsupported runner OS $(uname -s) — drift was NOT checked on this PR."; exit 0 ;;
          esac
          version="${LACQUER_TAG#v}"
          # Prove the tag pin actually held before trusting either half of it.
          # release.yml derives the tag from VERSION, so these agree by
          # construction — which is exactly why a disagreement means something
          # went wrong upstream of here and the audit's answer is worthless.
          checkout_version="$(tr -d '[:space:]' < .lacquer-checkout/VERSION)"
          if [ "$checkout_version" != "$version" ]; then
            echo "::error::The lacquer checkout is $checkout_version but the release binary is $version — that is the STALE BINARY case, so drift was NOT checked on this PR."
            exit 0
          fi
          asset="lacquer_${version}_${os}_${arch}.tar.gz"
          base="https://github.com/patrickserrano/lacquer/releases/download/${LACQUER_TAG}"
          if ! curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$base/$asset" ||
             ! curl -fsSL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"; then
            echo "::error::Downloading the lacquer ${LACQUER_TAG} release failed, so drift was NOT checked on this PR."
            exit 0
          fi
          # Verify BEFORE unpacking. A truncated or substituted tarball must not
          # be able to produce the binary that says "no drift" — a silent pass is
          # the one outcome this whole step is built to make impossible.
          verify() (
            cd "$RUNNER_TEMP" || return 1
            # Narrowed to this one asset's line. `sha256sum -c checksums.txt`
            # whole fails on the other archives, which were never downloaded, so
            # a one-line file is the only usable form — and grep failing to
            # produce that line is itself an error, which is what stops a MISSING
            # checksum entry from passing as a verified one.
            grep -E "[[:space:]]\*?${asset}\$" checksums.txt > lacquer.sha256 || return 1
            [ -s lacquer.sha256 ] || return 1
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum -c lacquer.sha256
            else
              shasum -a 256 -c lacquer.sha256
            fi
          )
          if ! verify; then
            echo "::error::Checksum verification failed for ${asset} — the download is corrupt or substituted, so drift was NOT checked on this PR."
            exit 0
          fi
          if ! tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" lacquer; then
            echo "::error::Unpacking ${asset} failed, so drift was NOT checked on this PR."
            exit 0
          fi
          chmod +x "$RUNNER_TEMP/lacquer"

          LACQUER_ROOT="$PWD/.lacquer-checkout" "$RUNNER_TEMP/lacquer" audit
          code=$?

          case "$code" in
            0) echo "No drift."; result=pass ;;
            3) echo "::error::A lacquer-managed file was edited in this project. These files are rendered from the lacquer, so a local edit silently diverges from what every other project gets — which is how a pre-commit hook ends up weaker than CI. Fix it in the lacquer repo and re-sync, or, if this project genuinely owns the file, add it to [project].exclude in .lacquer.toml so the lacquer stops managing it." ;;
            4) echo "::error::The project baseline is not met. See the audit output above." ;;
            # Detection ran once, at `lacquer init`, and never again — so a
            # project that grew a stack afterwards was unmanaged for it forever,
            # with nothing reporting the gap: no hooks, no CI, no error. `audit`
            # re-detects on every run now, and this is what makes that visible on
            # the PR that introduces the stack rather than a year later.
            6) echo "::error::This project runs a stack .lacquer.toml does not declare, so nothing gates it — no hooks, no CI, no CLAUDE region. Run \`lacquer adopt\` to record it and re-sync, or add the path to [project].exclude if the project deliberately keeps it unmanaged." ;;
            *) echo "::error::lacquer audit failed (exit $code)." ;;
          esac
          exit 0

  lint:
    name: Lint
    runs-on: [self-hosted, macOS, ARM64, dedicated]
    needs: changes
    # Skip on docs-only PRs (no Swift / lint-config change). Skipped counts as
    # passing for the CI OK aggregator.
    # SECURITY: never run untrusted fork-PR code on the self-hosted runner — the
    # same-repo guard skips this job for fork PRs (also enable repo setting
    # "Require approval for all fork PRs" for defense-in-depth).
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.code == 'true'
    steps:
      # FIRST, before any xcodebuild. A toolchain change on a shared self-hosted
      # host arrives with no PR and no warning, and its first symptom is a red
      # `main` on an unrelated merge. This turns that into a named failure.
      #
      # The licence check is the load-bearing half. An unaccepted Xcode licence
      # does not report itself as a licence problem — the observed first symptom
      # was `unable to spawn process '.../embeddedBinaryValidationUtility' (No
      # such file or directory)` for a file that was sitting on disk, which sends
      # you looking for a corrupted install. `-checkFirstLaunchStatus` exits
      # non-zero for exactly this state and costs nothing.
      - name: Verify the toolchain
        run: |
          set -uo pipefail
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-<unset, inheriting xcode-select>}"
          if ! xcodebuild -checkFirstLaunchStatus >/dev/null 2>&1; then
            echo "::error::Xcode's first-launch tasks are not complete on this runner — most often an unaccepted licence after an upgrade. Every xcodebuild and simctl call will fail, and NOT with a message that says so. Run: sudo xcodebuild -license accept && sudo xcodebuild -runFirstLaunch"
            exit 1
          fi
          have="$(xcodebuild -version 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g; s/ $//')"
          echo "Toolchain: $have"
          echo "Toolchain: \`$have\`" >> "$GITHUB_STEP_SUMMARY"
          # Echoed unconditionally, asserted only when the project declares an
          # expectation. Most of the fleet declares none and must keep building
          # on whatever the host has; for them the echo above is the whole point,
          # because it makes a silent upgrade visible in the log.
          want="{{IOS_XCODE_EXPECTED}}"
          if [ -n "$want" ] && ! printf '%s' "$have" | grep -qF "$want"; then
            echo "::error::This project expects Xcode $want; the runner has: $have. A toolchain moved under CI without a PR. Either install/select the expected Xcode on the host, or change xcode_version in .lacquer.toml deliberately — as a change that runs CI before it lands."
            exit 1
          fi
      - uses: actions/checkout@v7

      - name: Detect Swift sources
        id: swiftsrc
        run: |
          # A genuinely pre-code component (declared per the archetype rule
          # before any Swift exists, e.g. a Phase-0 backend-first project) has
          # nothing for SwiftLint or SwiftFormat to check yet. swiftlint itself
          # exits 1 with "No lintable files found" for a path with zero Swift
          # files anywhere under it (distinct from the mis-scoped-config case
          # below, which matches zero files despite Swift existing elsewhere
          # and exits 0) — so without this gate, Lint always fails outright for
          # a pre-code component regardless of what's actually wrong.
          has_swift=$(find {{COMPONENT_PREFIX}}. -name '*.swift' \
            -not -path '*/.build/*' -not -path '*/DerivedData*/*' -print -quit)
          if [ -n "$has_swift" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Swift sources under {{COMPONENT_PREFIX}} yet — nothing for Lint to check."
          fi

      - name: Run SwiftLint
        if: steps.swiftsrc.outputs.present == 'true'
        run: |
          set -o pipefail
          out=$(swiftlint --strict --config {{COMPONENT_PREFIX}}.swiftlint.yml {{COMPONENT_PREFIX}}. 2>&1); rc=$?
          printf '%s\n' "$out"
          # Guard: a mis-scoped config that matches NO files exits 0 and silently
          # enforces nothing. Swift sources are known to exist at this point (the
          # zero-Swift case above already skipped this step) — so "No lintable
          # files" here always means the config is mis-scoped, never that there's
          # legitimately nothing to lint.
          if printf '%s' "$out" | grep -q "No lintable files"; then
            echo "::error::Swift sources exist but SwiftLint matched none — the .swiftlint.yml is mis-scoped (lint is silently doing nothing)."
            exit 1
          fi
          exit $rc

      - name: Check SwiftFormat
        if: steps.swiftsrc.outputs.present == 'true'
        run: swiftformat --lint --config {{COMPONENT_PREFIX}}.swiftformat {{COMPONENT_PREFIX}}.

      # Prove the checks above can actually FAIL. Everything else in this job
      # asks "does this project pass?"; doctor asks "would these checks notice
      # if it didn't?" — the question nobody was asking while `swiftlint --path`
      # (a removed flag), `DOCC_FLAGS` (silently ignored) and two npx-resolved
      # web probes all reported green over nothing.
      #
      # It runs HERE, in the job that already has the stack toolchain, because a
      # probe whose tool is missing is reported as a missing tool — correct, but
      # useless as a gate on a runner that was never going to have it.
      #
      # working-directory is pinned to the repo root: this job may default to a
      # component subdirectory, and .lacquer.toml lives at the root.
      #
      # Same release pair as the drift audit in the `changes` job: the tag pins
      # the checkout, and the binary for THAT tag is downloaded, never compiled.
      # See that job for why the two halves must be one tag (STALE BINARY) and
      # why the checksum is not optional. The difference here is `set -e` — the
      # audit must never fail its job, this one MUST, because a doctor probe
      # that silently did not run is the exact failure it exists to catch.
      # Same rule as the drift audit: the version comes from THIS PROJECT'S
      # `.lacquer.lock`, not from the newest release. The probes assert things
      # about the config this project actually has, so running a NEWER lacquer's
      # probes against an older synced config tests a pairing that exists
      # nowhere — and that is not hypothetical: merging a new probe upstream
      # once turned every project's CI red at once, because each was still
      # carrying the config the previous version had shipped.
      - name: Resolve the lacquer version this project synced with
        id: doctorrel
        # Pinned to the repo root. .lacquer.lock lives there, and this job may
        # DEFAULT to a component subdirectory -- momfriend's web component is
        # "admin/.", its supabase one "server/". Without this the lookup reads
        # admin/.lacquer.lock, finds nothing, and reports the project as never
        # synced. The "Prove the checks can fail" step below already carried
        # this pin, with a comment saying why; the version-resolve step added
        # beside it did not, and broke every MULTI-COMPONENT project in the
        # fleet at once while single-component ones stayed green.
        working-directory: "."
        run: |
          set -euo pipefail
          if [ ! -f .lacquer.lock ]; then
            echo "::error::.lacquer.lock is missing, so there is no synced version to prove the checks against. Run \`lacquer sync\` to establish the baseline."
            exit 1
          fi
          # Plain grep rather than jq: jq is not guaranteed on the self-hosted
          # Mac, and this is one well-known scalar field.
          version=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' .lacquer.lock \
            | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Could not read a lacquer version from .lacquer.lock (got '$version')."; exit 1 ;;
          esac
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: patrickserrano/lacquer
          path: .lacquer-checkout
          ref: ${{ steps.doctorrel.outputs.tag }}
      - name: Prove the checks can fail
        working-directory: "."
        env:
          LACQUER_TAG: ${{ steps.doctorrel.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -f .lacquer.toml ]; then
            echo "::notice::No .lacquer.toml — this project is not lacquer-managed."
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::Unsupported runner architecture $(uname -m)."; exit 1 ;;
          esac
          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            *) echo "::error::Unsupported runner OS $(uname -s)."; exit 1 ;;
          esac
          version="${LACQUER_TAG#v}"
          asset="lacquer_${version}_${os}_${arch}.tar.gz"
          base="https://github.com/patrickserrano/lacquer/releases/download/${LACQUER_TAG}"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
          (cd "$RUNNER_TEMP" && grep -E "[[:space:]]\*?${asset}\$" checksums.txt > lacquer.sha256)
          [ -s "$RUNNER_TEMP/lacquer.sha256" ]
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$RUNNER_TEMP" && sha256sum -c lacquer.sha256)
          else
            (cd "$RUNNER_TEMP" && shasum -a 256 -c lacquer.sha256)
          fi
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" lacquer
          chmod +x "$RUNNER_TEMP/lacquer"
          LACQUER_ROOT="$PWD/.lacquer-checkout" "$RUNNER_TEMP/lacquer" doctor --profile ios

  build-release:
    name: Build (Release){{IOS_CI_PRODUCT_SUFFIX}}
    runs-on: [self-hosted, macOS, ARM64, dedicated]
    needs: [lint, changes]
    # Runs on every main push and on every pull request that touches code.
    #
    # It used to additionally require a path filter on PRs that matched only
    # SwiftUI view directories, on the theory that the bug Release uniquely
    # catches -- a DEBUG-only-in-Release leak, e.g. an un-gated #Preview using a
    # #if DEBUG-only helper -- is view-shaped. That is right about THAT bug and
    # wrong about the gate, because it assumes we can predict which changes can
    # break a Release build.
    #
    # Measured: six pull requests setting SWIFT_TREAT_WARNINGS_AS_ERRORS at the
    # project level reported `Build (Release)` as `skipping` on five of them.
    # That setting changes which diagnostics are fatal in EVERY target and
    # touches no view file, and Release is precisely where `#if DEBUG` code is
    # excluded and a different set of warnings appears. The one build that would
    # have tested the change was the one the filter skipped.
    #
    # It compounds with branch protection: a skipped required check and a passing
    # one are indistinguishable to GitHub, so an absent Release build and a green
    # one look identical on the pull request. That is the same defect class as a
    # `-only-testing:` whitelist matching nothing, which this profile already
    # guards against -- the principle was established here and simply had not
    # been applied to this gate.
    #
    # The cost is one Release build on pull requests that touch code but not
    # views. On a dedicated Mac runner that is real, and it is still the cheaper
    # side: without it, agents build Release locally on that same machine to get
    # the signal CI is not producing -- the same minutes with none of the
    # visibility. See the SwiftLint comment near the custom rules for the fast
    # local guard.
    # SECURITY: same-repo guard — fork-PR code must not build on the self-hosted runner.
    # `needs.changes.outputs.xcodeproj`: a pre-code component (no {{XCODEPROJ}}
    # committed and no project.yml to regenerate it) has nothing to build yet —
    # see the `changes` job's `xcodeproj` output for the full reasoning.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.code == 'true' && needs.changes.outputs.xcodeproj == 'true'
    timeout-minutes: 25{{IOS_CI_BUILD_STRATEGY}}
    steps:
      # FIRST, before any xcodebuild. A toolchain change on a shared self-hosted
      # host arrives with no PR and no warning, and its first symptom is a red
      # `main` on an unrelated merge. This turns that into a named failure.
      #
      # The licence check is the load-bearing half. An unaccepted Xcode licence
      # does not report itself as a licence problem — the observed first symptom
      # was `unable to spawn process '.../embeddedBinaryValidationUtility' (No
      # such file or directory)` for a file that was sitting on disk, which sends
      # you looking for a corrupted install. `-checkFirstLaunchStatus` exits
      # non-zero for exactly this state and costs nothing.
      - name: Verify the toolchain
        run: |
          set -uo pipefail
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-<unset, inheriting xcode-select>}"
          if ! xcodebuild -checkFirstLaunchStatus >/dev/null 2>&1; then
            echo "::error::Xcode's first-launch tasks are not complete on this runner — most often an unaccepted licence after an upgrade. Every xcodebuild and simctl call will fail, and NOT with a message that says so. Run: sudo xcodebuild -license accept && sudo xcodebuild -runFirstLaunch"
            exit 1
          fi
          have="$(xcodebuild -version 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g; s/ $//')"
          echo "Toolchain: $have"
          echo "Toolchain: \`$have\`" >> "$GITHUB_STEP_SUMMARY"
          # Echoed unconditionally, asserted only when the project declares an
          # expectation. Most of the fleet declares none and must keep building
          # on whatever the host has; for them the echo above is the whole point,
          # because it makes a silent upgrade visible in the log.
          want="{{IOS_XCODE_EXPECTED}}"
          if [ -n "$want" ] && ! printf '%s' "$have" | grep -qF "$want"; then
            echo "::error::This project expects Xcode $want; the runner has: $have. A toolchain moved under CI without a PR. Either install/select the expected Xcode on the host, or change xcode_version in .lacquer.toml deliberately — as a change that runs CI before it lands."
            exit 1
          fi
      - uses: actions/checkout@v7
        # Without this, actions/checkout leaves Git LFS-tracked assets (app
        # icons, launch screens, ...) as their tiny pointer-file stand-ins
        # instead of the real binary content -- the asset catalog compiler
        # then reports the icon set has "no applicable content", not that a
        # file is missing, which reads like a project mistake rather than a
        # checkout gap. Only these two jobs actually compile the app (and
        # its asset catalogs); Lint/Baseline/Drift never build, so leaving
        # their checkouts at the default costs nothing.
        with:
          lfs: true{{IOS_WATCH_SIMULATOR_SETUP}}

      - name: Materialise LFS assets
        # `lfs: true` above FETCHES the objects; it does not guarantee they are
        # SMUDGED into the working tree. On a persistent self-hosted runner the
        # files are already present from a previous checkout as their pointer
        # stand-ins, so git sees them as unchanged and never runs the smudge
        # filter on them. The objects land in .git/lfs/objects and the tree keeps
        # the 130-byte pointers.
        #
        # Measured on the fleet's own runner: a watch app icon was a 130-byte
        # pointer in the tree while its 1.1 MB object sat in the cache, and
        # `git lfs checkout` in that same workspace materialised 56 objects /
        # 63 MB and turned the failing run green with no other change.
        #
        # The symptom is misattributed by design: actool reports the icon set
        # "did not have any applicable content" rather than naming a pointer
        # file, which sends you to the asset catalog instead of the checkout.
        #
        # Idempotent and effectively free when everything is already
        # materialised, so it is unconditional rather than guarded on a check.
        run: git lfs checkout

      - name: Create Secrets.xcconfig (build-time placeholder)
        run: |
          # project.yml may reference a gitignored Secrets.xcconfig as its base
          # config; a clean checkout has no such file and xcodebuild fails before
          # compiling. Seed it from the committed example. Guarded so projects
          # without a Secrets.xcconfig.example (no runtime keys) are a no-op.
          # Seed EVERY Secrets.xcconfig.example under the component, each beside
          # itself — not just the one at the component root.
          #
          # kit keeps its example at BOTH ./Secrets.xcconfig.example and
          # Kit/Kit/Secrets.xcconfig.example, and the Xcode project reads the
          # nested one. The old single-path copy seeded only the root, "succeeded",
          # and the Release build then died with:
          #   could not find included file 'Kit/Kit/Secrets.xcconfig'
          # — an error that points nowhere near the step that caused it. The
          # guard made it worse: a project with no example at the root was a
          # silent no-op rather than a signal.
          find {{COMPONENT_PREFIX}}. -name 'Secrets.xcconfig.example' \
            -not -path '*/DerivedData*' -not -path '*/build/*' -not -path '*/.build/*' \
            -print0 2>/dev/null | while IFS= read -r -d '' ex; do
              target="${ex%.example}"
              [ -f "$target" ] || cp "$ex" "$target"
            done

          # An example and the file the PROJECT READS are not always in the same
          # directory, and seeding beside the example cannot notice when they are not.
          # `lacquer` writes Secrets.xcconfig.example at the COMPONENT ROOT — that is
          # the path internal/shipped's assertComponentLayout asserts — while an Xcode
          # project resolves its baseConfigurationReference against the app target's
          # OWN folder, {{COMPONENT_PREFIX}}<Scheme>/. A project shaped that way got
          # {{COMPONENT_PREFIX}}Secrets.xcconfig out of the loop above, which exited 0
          # having seeded nothing the build could use, and the build died fifteen
          # seconds later on a path no step had mentioned:
          #   ios/App.xcodeproj:1:1: error: Unable to open base configuration
          #   reference file '.../ios/App/Secrets.xcconfig'
          # That is #109's silent success arriving from the other direction. kit's
          # example was nested and its ROOT copy was the useless one; here the root
          # copy is the only one and the NESTED path is what the project reads. One
          # project's Docs job was red every night for a week on exactly this, and
          # nothing reported it because Docs runs on a schedule and never on a PR.
          #
          # Only when the root example is the ONLY one. A project that also keeps an
          # example in a source directory has already said it colocates the two, and
          # the loop above already served it — seeding the scheme directory as well
          # would leave a placeholder there that nothing reads.
          nexamples=$(find {{COMPONENT_PREFIX}}. -name 'Secrets.xcconfig.example' \
            -not -path '*/DerivedData*' -not -path '*/build/*' -not -path '*/.build/*' \
            2>/dev/null | wc -l | tr -d ' ')
          scheme_dir="{{COMPONENT_PREFIX}}{{IOS_CI_SCHEME}}"
          if [ "$nexamples" = "1" ] && [ -f "{{COMPONENT_PREFIX}}Secrets.xcconfig.example" ] \
            && [ -d "$scheme_dir" ] && [ ! -f "$scheme_dir/Secrets.xcconfig" ]; then
            cp "{{COMPONENT_PREFIX}}Secrets.xcconfig.example" "$scheme_dir/Secrets.xcconfig"
          fi

      - name: Generate Xcode project (XcodeGen)
        run: |
          # project.yml at the component root means the project is generated by
          # XcodeGen. Most of this fleet commits the generated .xcodeproj as a
          # build artifact (see profiles/ios/CLAUDE.ios.md) -- regenerating it
          # here is then a no-op. A project that instead gitignores it (a real,
          # deliberate choice: the pbxproj is merge-hostile and nobody reviews
          # it) has no .xcodeproj in a clean checkout at all, and every step
          # below that references {{XCODEPROJ}} fails before it can even open
          # the project. Guarded on project.yml so a project with no XcodeGen
          # spec (xcodeproj committed with no generator) is unaffected.
          if [ -f "{{COMPONENT_PREFIX}}project.yml" ]; then
            (cd {{COMPONENT_PREFIX}}. && xcodegen generate)
          fi

      # Keep Spotlight out of the build output, before anything creates it.
      #
      # `.metadata_never_index` in a directory tells Spotlight to skip the whole
      # tree. Without it mds_stores indexes every object file, module cache and
      # simulator container this build produces, on a machine where DerivedData
      # DELIBERATELY PERSISTS between runs (see the SPM cache step below).
      #
      # Measured on the dedicated runner, 2026-09-11: ~215GB of regenerable build
      # output was being indexed -- 133G of CoreSimulator devices, 59G of shared
      # DerivedData, 22G across ten per-project trees -- with `mdbulkimport`
      # running a full reindex and load average at 99. Excluding it took mds from
      # 34% CPU across nine processes to 12%.
      #
      # Cheap and idempotent: an empty marker file, created before xcodebuild so
      # the tree is never indexed even once. It deletes nothing, and removing the
      # marker re-enables indexing.
      - name: Keep Spotlight out of DerivedData
        run: |
          set -euo pipefail
          for dd in {{COMPONENT_PREFIX}}DerivedData {{COMPONENT_PREFIX}}WatchDerivedData; do
            mkdir -p "$dd"
            : > "$dd/.metadata_never_index"
          done

      - name: Check for a valid local SPM cache
        id: local-spm
        run: |
          # {{COMPONENT_PREFIX}}DerivedData persists on this dedicated runner's
          # local disk between runs (see "Clean stale build intermediates" below,
          # which exists precisely because it does) — actions/cache is redundant
          # whenever local disk already has a valid SPM cache from the prior run,
          # and it isn't free: it still tars/uploads/downloads through GitHub's
          # cache backend on every invocation. Check local disk first; only fall
          # back to actions/cache when it's cold (first run on this box, or after
          # a disk wipe/runner replacement).
          DIR="{{COMPONENT_PREFIX}}DerivedData/SourcePackages"
          if [ ! -d "$DIR/artifacts" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Validate every binary package has at least one xcframework with inner
          # arch-specific .framework bundles — local disk can be left corrupted by
          # a prior run that was cancelled mid-download, same risk as a cache hit.
          CORRUPT=""
          for pkg_dir in "$DIR"/artifacts/*/; do
            [ -d "$pkg_dir" ] || continue
            xcfw_count=$(find "$pkg_dir" -name '*.xcframework' -type d -maxdepth 5 2>/dev/null | wc -l | tr -d ' ')
            if [ "$xcfw_count" -eq 0 ]; then
              CORRUPT="$pkg_dir (no xcframework found)"
              break
            fi
            while IFS= read -r xcfw; do
              if [ -z "$(find "$xcfw" -name '*.framework' -type d -maxdepth 3 2>/dev/null | head -1)" ]; then
                CORRUPT="$xcfw (no inner framework bundle)"
                break 2
              fi
            done < <(find "$pkg_dir" -name '*.xcframework' -type d -maxdepth 5 2>/dev/null)
          done
          if [ -n "$CORRUPT" ]; then
            echo "Corrupt local SPM cache: $CORRUPT — clearing, falling back to actions/cache."
            rm -rf "$DIR"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "Local SPM cache looks valid — skipping actions/cache."
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache SPM packages (cold-start fallback)
        id: spm-cache
        if: steps.local-spm.outputs.valid != 'true'
        uses: actions/cache@v6
        with:
          path: "{{COMPONENT_PREFIX}}DerivedData/SourcePackages"
          key: ${{ runner.os }}-spm-${{ hashFiles('{{XCODEPROJ}}/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Validate restored SPM cache
        if: steps.local-spm.outputs.valid != 'true'
        run: |
          if [ ! -d "{{COMPONENT_PREFIX}}DerivedData/SourcePackages/artifacts" ]; then
            exit 0
          fi
          # On a restore-keys hit the packages may differ from Package.resolved — clear.
          if [ "${{ steps.spm-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Stale cache (restore-keys hit): clearing SourcePackages."
            rm -rf {{COMPONENT_PREFIX}}DerivedData/SourcePackages
            exit 0
          fi
          # Exact hit: same corruption check as the local-disk case above — a
          # cache can be saved in a corrupted state if a prior run was cancelled
          # mid-download.
          CORRUPT=""
          for pkg_dir in {{COMPONENT_PREFIX}}DerivedData/SourcePackages/artifacts/*/; do
            [ -d "$pkg_dir" ] || continue
            xcfw_count=$(find "$pkg_dir" -name '*.xcframework' -type d -maxdepth 5 2>/dev/null | wc -l | tr -d ' ')
            if [ "$xcfw_count" -eq 0 ]; then
              CORRUPT="$pkg_dir (no xcframework found)"
              break
            fi
            while IFS= read -r xcfw; do
              if [ -z "$(find "$xcfw" -name '*.framework' -type d -maxdepth 3 2>/dev/null | head -1)" ]; then
                CORRUPT="$xcfw (no inner framework bundle)"
                break 2
              fi
            done < <(find "$pkg_dir" -name '*.xcframework' -type d -maxdepth 5 2>/dev/null)
          done
          if [ -n "$CORRUPT" ]; then
            echo "Corrupt SPM cache: $CORRUPT — clearing SourcePackages."
            rm -rf {{COMPONENT_PREFIX}}DerivedData/SourcePackages
          fi

      # xcbeautify, not xcpretty. Three reasons, in order of how much they cost:
      #
      # 1. xcpretty is a RUBY GEM, and that alone caused a CI failure: three jobs
      #    installed it into one shared ~/.gem on the persistent Mac runner, and
      #    overlapping installs tripped RubyGems' own path-traversal check --
      #    failing a test job before any test ran. Isolating GEM_HOME per job
      #    worked around that; a single Homebrew binary removes the shared
      #    resource entirely, which is the better fix.
      # 2. --renderer github-actions emits `::error file=...::` lines, so compile
      #    errors land as ANNOTATIONS ON THE PR DIFF instead of being buried in a
      #    log. Three separate investigations in one evening had to read raw logs
      #    to find errors this would have surfaced inline.
      # 3. xcpretty is 0.4.1 and effectively unmaintained; xcbeautify is 3.2.1 and
      #    tracks current Xcode output. On Xcode 27 xcpretty has been observed
      #    swallowing output entirely on this runner, which is why the `tee` below
      #    is load-bearing -- it is kept regardless, because a formatter that
      #    drops a line must never be the only copy of it.
      #
      # NOT a fix for exit codes. Both tools are filters and both exit 0; the
      # `set -o pipefail` above each pipe is what carries xcodebuild's status,
      # and that is unchanged.
      - name: Install xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Build Release
        run: |
          set -o pipefail
          # A FORMATTER can print nothing for project-level failures
          # (link/actool/codesign) — an opaque red X. Measured on xcpretty, which
          # this profile no longer uses; the tee stays because the rule
          # generalises: a formatter that can drop a line must never be the only
          # copy of it. Tee the raw log and dump the error tail on failure.
          xcodebuild build \
            -project "{{XCODEPROJ}}" \
            -scheme "{{IOS_CI_SCHEME}}" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath {{COMPONENT_PREFIX}}DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee xcodebuild-release.log | xcbeautify --renderer github-actions || {
            echo "::error::Release build failed — raw xcodebuild tail:"
            grep -iE 'error:|fatal|failed|ld:|actool|CodeSign' xcodebuild-release.log | tail -60
            exit 1
          }

  test:
    name: Test{{IOS_CI_PRODUCT_SUFFIX}}
    runs-on: [self-hosted, macOS, ARM64, dedicated]
    needs: [lint, changes]
    # Runs on push-to-main as well as on PRs, and skips only docs-only changes.
    #
    # It used to skip pushes entirely, on the reasoning that a squash-merged tree
    # equals the tree already tested — with the caveat, written right here, that
    # this is "airtight only when PRs are up-to-date with main before the
    # squash-merge". That caveat was branch protection's `strict` setting doing
    # load-bearing work from the other side of the fence.
    #
    # `strict` turned out to cost far more than it protected. It invalidates
    # every other open PR on every merge, so on a fleet sharing ONE self-hosted
    # Mac each PR re-queues a full run per merge that lands ahead of it: measured
    # at NINE runs for a single sync PR in one afternoon, none of which merged.
    #
    # Testing the merged tree once is strictly cheaper than re-testing every open
    # PR against every merge, and it closes the hole rather than relying on a
    # setting in a different system to keep it shut. Build (Release) remains the
    # compile backstop; this makes tests one too.
    #
    # SECURITY: same-repo guard — fork-PR code must not build/test on the self-hosted runner.
    # `needs.changes.outputs.xcodeproj`: a pre-code component (no {{XCODEPROJ}}
    # committed and no project.yml to regenerate it) has nothing to test yet —
    # see the `changes` job's `xcodeproj` output for the full reasoning.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.code == 'true' && needs.changes.outputs.xcodeproj == 'true'
    # Per-step fail-fast timeouts below catch silent hangs; this is the generous
    # backstop with headroom for a cold, cache-cold build.
    timeout-minutes: 20{{IOS_CI_TEST_STRATEGY}}
    steps:
      # FIRST, before any xcodebuild. A toolchain change on a shared self-hosted
      # host arrives with no PR and no warning, and its first symptom is a red
      # `main` on an unrelated merge. This turns that into a named failure.
      #
      # The licence check is the load-bearing half. An unaccepted Xcode licence
      # does not report itself as a licence problem — the observed first symptom
      # was `unable to spawn process '.../embeddedBinaryValidationUtility' (No
      # such file or directory)` for a file that was sitting on disk, which sends
      # you looking for a corrupted install. `-checkFirstLaunchStatus` exits
      # non-zero for exactly this state and costs nothing.
      - name: Verify the toolchain
        run: |
          set -uo pipefail
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-<unset, inheriting xcode-select>}"
          if ! xcodebuild -checkFirstLaunchStatus >/dev/null 2>&1; then
            echo "::error::Xcode's first-launch tasks are not complete on this runner — most often an unaccepted licence after an upgrade. Every xcodebuild and simctl call will fail, and NOT with a message that says so. Run: sudo xcodebuild -license accept && sudo xcodebuild -runFirstLaunch"
            exit 1
          fi
          have="$(xcodebuild -version 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g; s/ $//')"
          echo "Toolchain: $have"
          echo "Toolchain: \`$have\`" >> "$GITHUB_STEP_SUMMARY"
          # Echoed unconditionally, asserted only when the project declares an
          # expectation. Most of the fleet declares none and must keep building
          # on whatever the host has; for them the echo above is the whole point,
          # because it makes a silent upgrade visible in the log.
          want="{{IOS_XCODE_EXPECTED}}"
          if [ -n "$want" ] && ! printf '%s' "$have" | grep -qF "$want"; then
            echo "::error::This project expects Xcode $want; the runner has: $have. A toolchain moved under CI without a PR. Either install/select the expected Xcode on the host, or change xcode_version in .lacquer.toml deliberately — as a change that runs CI before it lands."
            exit 1
          fi
      - uses: actions/checkout@v7
        # Without this, actions/checkout leaves Git LFS-tracked assets (app
        # icons, launch screens, ...) as their tiny pointer-file stand-ins
        # instead of the real binary content -- the asset catalog compiler
        # then reports the icon set has "no applicable content", not that a
        # file is missing, which reads like a project mistake rather than a
        # checkout gap. Only these two jobs actually compile the app (and
        # its asset catalogs); Lint/Baseline/Drift never build, so leaving
        # their checkouts at the default costs nothing.
        with:
          lfs: true{{IOS_WATCH_SIMULATOR_SETUP}}

      - name: Materialise LFS assets
        # `lfs: true` above FETCHES the objects; it does not guarantee they are
        # SMUDGED into the working tree. On a persistent self-hosted runner the
        # files are already present from a previous checkout as their pointer
        # stand-ins, so git sees them as unchanged and never runs the smudge
        # filter on them. The objects land in .git/lfs/objects and the tree keeps
        # the 130-byte pointers.
        #
        # Measured on the fleet's own runner: a watch app icon was a 130-byte
        # pointer in the tree while its 1.1 MB object sat in the cache, and
        # `git lfs checkout` in that same workspace materialised 56 objects /
        # 63 MB and turned the failing run green with no other change.
        #
        # The symptom is misattributed by design: actool reports the icon set
        # "did not have any applicable content" rather than naming a pointer
        # file, which sends you to the asset catalog instead of the checkout.
        #
        # Idempotent and effectively free when everything is already
        # materialised, so it is unconditional rather than guarded on a check.
        run: git lfs checkout

      - name: Create Secrets.xcconfig (build-time placeholder)
        run: |
          # project.yml may reference a gitignored Secrets.xcconfig as its base
          # config; a clean checkout has no such file and xcodebuild fails before
          # compiling. Seed it from the committed example. Guarded so projects
          # without a Secrets.xcconfig.example (no runtime keys) are a no-op.
          # Seed EVERY Secrets.xcconfig.example under the component, each beside
          # itself — not just the one at the component root.
          #
          # kit keeps its example at BOTH ./Secrets.xcconfig.example and
          # Kit/Kit/Secrets.xcconfig.example, and the Xcode project reads the
          # nested one. The old single-path copy seeded only the root, "succeeded",
          # and the Release build then died with:
          #   could not find included file 'Kit/Kit/Secrets.xcconfig'
          # — an error that points nowhere near the step that caused it. The
          # guard made it worse: a project with no example at the root was a
          # silent no-op rather than a signal.
          find {{COMPONENT_PREFIX}}. -name 'Secrets.xcconfig.example' \
            -not -path '*/DerivedData*' -not -path '*/build/*' -not -path '*/.build/*' \
            -print0 2>/dev/null | while IFS= read -r -d '' ex; do
              target="${ex%.example}"
              [ -f "$target" ] || cp "$ex" "$target"
            done

          # And the scheme's own directory, when the component root holds the only
          # example: an Xcode project resolves baseConfigurationReference against the
          # app target's folder, not the component root, so seeding beside the example
          # alone exits 0 having seeded nothing the build can open. See the Build
          # (Release) job above for the failure this reproduces.
          nexamples=$(find {{COMPONENT_PREFIX}}. -name 'Secrets.xcconfig.example' \
            -not -path '*/DerivedData*' -not -path '*/build/*' -not -path '*/.build/*' \
            2>/dev/null | wc -l | tr -d ' ')
          scheme_dir="{{COMPONENT_PREFIX}}{{IOS_CI_SCHEME}}"
          if [ "$nexamples" = "1" ] && [ -f "{{COMPONENT_PREFIX}}Secrets.xcconfig.example" ] \
            && [ -d "$scheme_dir" ] && [ ! -f "$scheme_dir/Secrets.xcconfig" ]; then
            cp "{{COMPONENT_PREFIX}}Secrets.xcconfig.example" "$scheme_dir/Secrets.xcconfig"
          fi

      - name: Generate Xcode project (XcodeGen)
        run: |
          # project.yml at the component root means the project is generated by
          # XcodeGen. Most of this fleet commits the generated .xcodeproj as a
          # build artifact (see profiles/ios/CLAUDE.ios.md) -- regenerating it
          # here is then a no-op. A project that instead gitignores it (a real,
          # deliberate choice: the pbxproj is merge-hostile and nobody reviews
          # it) has no .xcodeproj in a clean checkout at all, and every step
          # below that references {{XCODEPROJ}} fails before it can even open
          # the project. Guarded on project.yml so a project with no XcodeGen
          # spec (xcodeproj committed with no generator) is unaffected.
          if [ -f "{{COMPONENT_PREFIX}}project.yml" ]; then
            (cd {{COMPONENT_PREFIX}}. && xcodegen generate)
          fi

      # Keep Spotlight out of the build output, before anything creates it.
      #
      # `.metadata_never_index` in a directory tells Spotlight to skip the whole
      # tree. Without it mds_stores indexes every object file, module cache and
      # simulator container this build produces, on a machine where DerivedData
      # DELIBERATELY PERSISTS between runs (see the SPM cache step below).
      #
      # Measured on the dedicated runner, 2026-09-11: ~215GB of regenerable build
      # output was being indexed -- 133G of CoreSimulator devices, 59G of shared
      # DerivedData, 22G across ten per-project trees -- with `mdbulkimport`
      # running a full reindex and load average at 99. Excluding it took mds from
      # 34% CPU across nine processes to 12%.
      #
      # Cheap and idempotent: an empty marker file, created before xcodebuild so
      # the tree is never indexed even once. It deletes nothing, and removing the
      # marker re-enables indexing.
      - name: Keep Spotlight out of DerivedData
        run: |
          set -euo pipefail
          for dd in {{COMPONENT_PREFIX}}DerivedData {{COMPONENT_PREFIX}}WatchDerivedData; do
            mkdir -p "$dd"
            : > "$dd/.metadata_never_index"
          done

      - name: Check for a valid local SPM cache
        id: local-spm
        run: |
          # {{COMPONENT_PREFIX}}DerivedData persists on this dedicated runner's
          # local disk between runs (see "Clean stale build intermediates" below,
          # which exists precisely because it does) — actions/cache is redundant
          # whenever local disk already has a valid SPM cache from the prior run,
          # and it isn't free: it still tars/uploads/downloads through GitHub's
          # cache backend on every invocation. Check local disk first; only fall
          # back to actions/cache when it's cold (first run on this box, or after
          # a disk wipe/runner replacement).
          DIR="{{COMPONENT_PREFIX}}DerivedData/SourcePackages"
          if [ ! -d "$DIR/artifacts" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Validate every binary package has at least one xcframework with inner
          # arch-specific .framework bundles — local disk can be left corrupted by
          # a prior run that was cancelled mid-download, same risk as a cache hit.
          CORRUPT=""
          for pkg_dir in "$DIR"/artifacts/*/; do
            [ -d "$pkg_dir" ] || continue
            xcfw_count=$(find "$pkg_dir" -name '*.xcframework' -type d -maxdepth 5 2>/dev/null | wc -l | tr -d ' ')
            if [ "$xcfw_count" -eq 0 ]; then
              CORRUPT="$pkg_dir (no xcframework found)"
              break
            fi
            while IFS= read -r xcfw; do
              if [ -z "$(find "$xcfw" -name '*.framework' -type d -maxdepth 3 2>/dev/null | head -1)" ]; then
                CORRUPT="$xcfw (no inner framework bundle)"
                break 2
              fi
            done < <(find "$pkg_dir" -name '*.xcframework' -type d -maxdepth 5 2>/dev/null)
          done
          if [ -n "$CORRUPT" ]; then
            echo "Corrupt local SPM cache: $CORRUPT — clearing, falling back to actions/cache."
            rm -rf "$DIR"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "Local SPM cache looks valid — skipping actions/cache."
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache SPM packages (cold-start fallback)
        id: spm-cache
        if: steps.local-spm.outputs.valid != 'true'
        uses: actions/cache@v6
        with:
          path: "{{COMPONENT_PREFIX}}DerivedData/SourcePackages"
          key: ${{ runner.os }}-spm-${{ hashFiles('{{XCODEPROJ}}/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Validate restored SPM cache
        if: steps.local-spm.outputs.valid != 'true'
        run: |
          if [ ! -d "{{COMPONENT_PREFIX}}DerivedData/SourcePackages/artifacts" ]; then
            exit 0
          fi
          # On a restore-keys hit the packages may differ from Package.resolved — clear.
          if [ "${{ steps.spm-cache.outputs.cache-hit }}" != "true" ]; then
            echo "Stale cache (restore-keys hit): clearing SourcePackages."
            rm -rf {{COMPONENT_PREFIX}}DerivedData/SourcePackages
            exit 0
          fi
          # Exact hit: same corruption check as the local-disk case above — a
          # cache can be saved in a corrupted state if a prior run was cancelled
          # mid-download.
          CORRUPT=""
          for pkg_dir in {{COMPONENT_PREFIX}}DerivedData/SourcePackages/artifacts/*/; do
            [ -d "$pkg_dir" ] || continue
            xcfw_count=$(find "$pkg_dir" -name '*.xcframework' -type d -maxdepth 5 2>/dev/null | wc -l | tr -d ' ')
            if [ "$xcfw_count" -eq 0 ]; then
              CORRUPT="$pkg_dir (no xcframework found)"
              break
            fi
            while IFS= read -r xcfw; do
              if [ -z "$(find "$xcfw" -name '*.framework' -type d -maxdepth 3 2>/dev/null | head -1)" ]; then
                CORRUPT="$xcfw (no inner framework bundle)"
                break 2
              fi
            done < <(find "$pkg_dir" -name '*.xcframework' -type d -maxdepth 5 2>/dev/null)
          done
          if [ -n "$CORRUPT" ]; then
            echo "Corrupt SPM cache: $CORRUPT — clearing SourcePackages."
            rm -rf {{COMPONENT_PREFIX}}DerivedData/SourcePackages
          fi

      # xcbeautify, not xcpretty. Three reasons, in order of how much they cost:
      #
      # 1. xcpretty is a RUBY GEM, and that alone caused a CI failure: three jobs
      #    installed it into one shared ~/.gem on the persistent Mac runner, and
      #    overlapping installs tripped RubyGems' own path-traversal check --
      #    failing a test job before any test ran. Isolating GEM_HOME per job
      #    worked around that; a single Homebrew binary removes the shared
      #    resource entirely, which is the better fix.
      # 2. --renderer github-actions emits `::error file=...::` lines, so compile
      #    errors land as ANNOTATIONS ON THE PR DIFF instead of being buried in a
      #    log. Three separate investigations in one evening had to read raw logs
      #    to find errors this would have surfaced inline.
      # 3. xcpretty is 0.4.1 and effectively unmaintained; xcbeautify is 3.2.1 and
      #    tracks current Xcode output. On Xcode 27 xcpretty has been observed
      #    swallowing output entirely on this runner, which is why the `tee` below
      #    is load-bearing -- it is kept regardless, because a formatter that
      #    drops a line must never be the only copy of it.
      #
      # NOT a fix for exit codes. Both tools are filters and both exit 0; the
      # `set -o pipefail` above each pipe is what carries xcodebuild's status,
      # and that is unchanged.
      - name: Install xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Clean stale build intermediates
        run: |
          # Gitignored dirs persist between runs on a dedicated runner. Stale .o
          # files from a prior failed build cause Swift incremental compilation
          # crashes (exit 65). SPM packages are cached separately.
          rm -rf {{COMPONENT_PREFIX}}DerivedData/Build

      - name: Setup Simulator
        id: simulator
        # simctl boot / bootstatus can hang silently if CoreSimulator wedges
        # (the step kills zombies first, but boot itself can still stall).
        # Normal ~1 min; fail fast well before the job backstop.
        timeout-minutes: 6
        run: |
          # Kill host-side test infrastructure left by THIS repository's prior
          # runs. When a job times out, GitHub kills the shell but leaves zombie
          # xctest processes holding CoreSimulator XPC connections; new test
          # sessions block on those and hang silently.
          #
          # Scoped to $GITHUB_WORKSPACE, and that is the whole point. This used
          # to be `pkill -9 -f xctest` plus `killall -9 testmanagerd`, `Simulator`
          # and `com.apple.CoreSimulator.CoreSimulatorService` — every one of
          # them machine-wide. On a Mac shared by fourteen repositories, a job
          # starting up killed the running tests of every other job on the box,
          # and killing CoreSimulatorService took out the daemon their simulators
          # depended on. The victim reported
          #
          #     Test crashed with signal trap before establishing connection
          #
          # which looks like an application bug and is not one. Two projects were
          # killed this way in a single batch; the same batch passed when run
          # alone minutes later, which is what proved it.
          #
          # Every test process carries its workspace path in argv, so this
          # matches exactly this repository's strays and nothing else. The
          # machine-wide hammer still exists in the scheduled cleanup workflow,
          # which is the right place for it: it runs when nothing else does.
          pkill -9 -f "$GITHUB_WORKSPACE" 2>/dev/null || true
          sleep 3

          # Pin to a specific iOS runtime so every repository tests against the
          # same one. Update this when the host Xcode moves.
          PINNED_RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-27-0"

          if ! xcrun simctl list runtimes | grep -q "$PINNED_RUNTIME"; then
            FALLBACK=$(xcrun simctl list runtimes | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS[0-9-]*' | sort -V | tail -1)
            if [ -z "$FALLBACK" ]; then
              echo "::error::No iOS simulator runtimes installed"
              xcrun simctl list runtimes
              exit 1
            fi
            echo "::warning::Pinned runtime $PINNED_RUNTIME not found, falling back to $FALLBACK"
            PINNED_RUNTIME="$FALLBACK"
          fi

          # WARN WHEN THE PIN HAS FALLEN BEHIND THE HOST.
          #
          # The fallback above only fires when the pinned runtime is ABSENT. An
          # installed-but-old runtime therefore holds forever: the host upgrades
          # Xcode, the pin does not move, and nothing says so. That is not
          # hypothetical -- the pin sat at iOS-26-2 while the host ran Xcode 27,
          # two majors behind, and the fallback never fired because 26.2 was
          # still installed.
          #
          # It cost a real failure that looked like a product bug. FoundationModels
          # proxies simulator inference to the HOST's modelmanagerd, and the host's
          # instruct_300m.safety adapter stopped carrying the prompt template in
          # the shape an iOS 26.x runtime asks for. Measured across three runtimes
          # on one host: 26.2 failed, 26.5 failed, 27.0 skipped cleanly. Most
          # frameworks do not care about this pairing; the ones that do fail in
          # ways that read as your code being broken.
          #
          # A warning, not an error: a lagging pin is usually fine and a hard
          # failure here would block every repository the day Apple ships a major.
          # What it must not do is stay silent, which is the behaviour being fixed.
          HOST_SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null | cut -d. -f1)
          PIN_MAJOR=$(echo "$PINNED_RUNTIME" | grep -oE 'iOS-[0-9]+' | cut -d- -f2)
          if [ -n "$HOST_SDK_MAJOR" ] && [ -n "$PIN_MAJOR" ] && [ "$PIN_MAJOR" -lt "$HOST_SDK_MAJOR" ]; then
            echo "::warning::Simulator runtime pin is iOS $PIN_MAJOR.x but this host's SDK is iOS $HOST_SDK_MAJOR.x. Frameworks that proxy to the host (FoundationModels among them) can fail in ways that look like product bugs. Update PINNED_RUNTIME in the lacquer's ios profile."
          fi
          echo "Using runtime: $PINNED_RUNTIME (host SDK iOS ${HOST_SDK_MAJOR:-unknown}.x)"

          # The simulator name is scoped to THIS REPOSITORY, and the cleanup
          # below only ever touches names carrying that scope.
          #
          # It used to be the bare string "CI-iPhone" in every project, and the
          # cleanup deleted every simulator matching it. On a self-hosted Mac
          # shared by fourteen repositories that is a race with teeth: job B
          # starts, deletes "CI-iPhone", and job A — mid-test on the simulator
          # that name pointed at — dies with
          #
          #     Early unexpected exit, operation never finished bootstrapping
          #     The test runner crashed before establishing connection
          #
          # which reads like an app crash and is not one. It stayed hidden while
          # projects were pushed to one at a time. Opening nine sync pull
          # requests at once put six iOS jobs on the box inside ninety seconds,
          # and two of them were killed by a neighbour's cleanup.
          #
          # Scoping the name rather than taking a lock keeps jobs independent: a
          # runner-level mutex would serialise the whole fleet behind the slowest
          # test suite, and GitHub's `concurrency` cannot span repositories.
          #
          # Keyed on the RUN, not the repository. Per-repository was not enough:
          # two runs of the SAME repository overlap constantly — a push landing
          # while a pull request is still testing, or two pull requests updated
          # together — and both would build a device of the same name and delete
          # each other's mid-test. One project hit exactly that and fixed it
          # locally; this is that fix promoted, so every project gets it.
          #
          # GITHUB_RUN_ID is shared by matrix legs of one run, so the product
          # suffix still has to be there: run-id alone would collide between a
          # paid and a free leg.
          SIM_NAME="CI-iPhone-${GITHUB_RUN_ID}{{IOS_CI_SIM_SUFFIX}}"

          # Stale simulators from THIS repository's earlier runs, and no others.
          # The carryover this guards against (residual xctestd / CoreSimulator
          # state) is per-project anyway, so the narrower net loses nothing.
          #
          # `|| true` is load-bearing: Actions runs `run:` under `bash -e`, and
          # with no leftover simulator the grep pipeline exits 1, which aborts the
          # assignment and kills the step. That is the CLEAN-runner case — a
          # fresh machine, or the run right after the cleanup workflow.
          STALE_IDS=$(xcrun simctl list devices | grep "$SIM_NAME{{IOS_CI_SIM_MATCH}}" | grep -oE '[A-F0-9-]{36}' || true)
          for id in $STALE_IDS; do
            echo "Deleting stale simulator: $id"
            xcrun simctl shutdown "$id" 2>/dev/null || true
            xcrun simctl delete "$id" 2>/dev/null || true
          done

          echo "Creating $SIM_NAME simulator..."
          DEVICE_ID=$(xcrun simctl create "$SIM_NAME" "iPhone 17 Pro" "$PINNED_RUNTIME")
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Created new simulator: $SIM_NAME ($DEVICE_ID)"

          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

          # bootstatus -b confirms the kernel is up but SpringBoard finishes
          # several seconds later — poll for it (up to 60s).
          echo "Polling for SpringBoard readiness (up to 60s)..."
          for i in $(seq 1 20); do
            if xcrun simctl spawn "$DEVICE_ID" launchctl list 2>/dev/null | grep -qi "springboard"; then
              echo "SpringBoard ready after $((i*3))s"
              break
            fi
            sleep 3
            if [ "$i" -eq 20 ]; then
              echo "::warning::SpringBoard readiness poll timed out after 60s, proceeding anyway"
            fi
          done

          echo "Simulator ready: $SIM_NAME ($DEVICE_ID)"

      - name: Suppress crash-reporter dialogs
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          # A crashing test can pop a macOS CrashReporter modal that wedges the
          # dedicated Mac until someone dismisses it. Disable the dialogs host-
          # side and inside the booted simulator (last line is best-effort).
          defaults write com.apple.CrashReporter DialogType none
          defaults write com.apple.iphonesimulator ShowCrashReporter -bool NO
          xcrun simctl spawn "$DEVICE_ID" defaults write com.apple.CrashReporter DialogType none || true

      - name: Run Tests
        id: tests
        # The hang-prone step: `xcodebuild test` drives a simulator test session
        # that can stall silently (hence the heartbeat watchdog below). Normal
        # ~1-2 min; ~5x that as a fail-fast ceiling so a hung session frees the
        # runner instead of squatting it for the job max.
        timeout-minutes: 10
        run: |
          set -o pipefail
          DEVICE_ID="${{ steps.simulator.outputs.device_id }}"

          # Kill zombie test processes that may have spawned during simulator
          # boot or survived as orphans from a prior cancelled job — this
          # repository's only. See the Setup Simulator step for why the
          # machine-wide form of this was destroying concurrent jobs.
          pkill -9 -f "$GITHUB_WORKSPACE" 2>/dev/null || true
          sleep 2

          # Clean up stale results from previous runs
          rm -rf TestResults.xcresult

          # Heartbeat watchdog: prints every 60s so GitHub doesn't treat this as a silent/stuck step
          ( while true; do sleep 60; echo "[watchdog $(date -u +%H:%M:%S)] xcodebuild still running..."; done ) &
          WATCHDOG_PID=$!{{IOS_CI_EXTRA_TEST_SETUP}}

          # Run tests and capture exit code, also save output for fallback parsing
          EXIT_CODE=0
          xcodebuild test \
            -project "{{XCODEPROJ}}" \
            -scheme "{{IOS_CI_SCHEME}}" \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath {{COMPONENT_PREFIX}}DerivedData \
            {{IOS_CI_ONLY_TESTING}} \
            -parallel-testing-enabled NO \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_REQUIRED=NO \
          2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions || EXIT_CODE=$?

          kill $WATCHDOG_PID 2>/dev/null || true

          # Handle exit code 65 - known Swift Testing spurious failure
          # Only apply this workaround for exit code 65, not other errors
          if [ $EXIT_CODE -eq 65 ]; then
            echo "xcodebuild exited with code 65, checking for actual test failures..."

            # Verify xcresult exists
            if [ ! -d "TestResults.xcresult" ]; then
              echo "::error::No test results found - tests may not have run"
              exit 1
            fi

            # Parse the xcresult with the MODERN `get test-results summary`
            # subcommand, and fail closed if that parse is inconclusive.
            #
            # What was here before did neither, and the combination produced a
            # green PR on a run with a real, confirmed test failure.
            #
            #   1. The primary parser called `xcresulttool get --format json`.
            #      That form is deprecated: current Xcode refuses it outright
            #      ("--legacy flag is required to use it") and exits non-zero
            #      with EMPTY stdout. With 2>/dev/null swallowing the message,
            #      the step saw only a silent empty result — so the parser this
            #      job was designed around had not run AT ALL on any modern
            #      Xcode, on any repo in the fleet, for as long as that toolchain
            #      has been installed.
            #   2. Every run therefore reached the log-scraping fallback, which
            #      hunted xcodebuild.log for the literal text "N failed" — text
            #      Swift Testing's reporter never actually emits (its real line
            #      reads "... failed after Xs with N issue(s)"). Past "correct"
            #      detections were coincidental matches on unrelated numbers
            #      elsewhere in the log.
            #   3. When that regex found nothing, the fallback concluded "All
            #      tests passed. Exit code 65 was spurious." and exited 0.
            #
            # So the failure mode was: designed defence dead, backup defence
            # matching text that does not exist, and the default branch a PASS.
            # Exit 65 is precisely the "tests failed" signal, so this only ever
            # ran on the runs that mattered.
            #
            # `get test-results summary` reports `.result` and `.failedTests`
            # directly, with no text-scraping. Verified against real bundles:
            # `.result` is one of Passed/Failed/Skipped/Expected Failure/unknown
            # (Apple's own schema) and `.failedTests` is a number.
            echo "Parsing test results from xcresult..."
            set +e
            SUMMARY_JSON=$(xcrun xcresulttool get test-results summary --path TestResults.xcresult 2>/dev/null)
            SUMMARY_EXIT=$?
            set -e

            if [ $SUMMARY_EXIT -eq 0 ] && [ -n "$SUMMARY_JSON" ]; then
              RESULT=$(echo "$SUMMARY_JSON" | jq -r '.result // empty' 2>/dev/null)
              FAILED_COUNT=$(echo "$SUMMARY_JSON" | jq -r '.failedTests // empty' 2>/dev/null)

              if [ "$RESULT" = "Passed" ] && [ "$FAILED_COUNT" = "0" ]; then
                echo "All tests passed (0 failed). Exit code 65 was spurious."
                echo "test_result=passed" >> "$GITHUB_OUTPUT"
                exit 0
              # "Failed" is the only value that means a real, attributed test
              # failure. `.result` can also legitimately read "unknown" (Apple's
              # own schema lists it alongside Passed/Failed/Skipped/Expected
              # Failure) — that is xcresulttool saying it could not reach a
              # verdict, not "0 tests failed". Folding it into this branch
              # produced the exact misleading message that hid a real
              # zero-tests-executed failure: "0 failed (result: unknown)" reads
              # like a pass with stray formatting, not the ambiguous non-verdict
              # it actually is. Route it to FAIL CLOSED below instead.
              elif [ "$RESULT" = "Failed" ] && [ -n "$FAILED_COUNT" ]; then
                echo "Test failures detected via xcresulttool: $FAILED_COUNT failed (result: $RESULT)"

                # NAME THE FAILURES, IN THE LOG. The same JSON already parsed
                # above carries `testFailures[]` with `targetName`, `testName`
                # and `failureText`; this branch used to read the count off it
                # and throw the rest away. A bare count is the weakest useful
                # signal a CI job can emit: enough to block, not enough to act
                # on, and just enough to make re-running feel reasonable.
                #
                # That is not hypothetical. A DailyBread PR failed 1 of 738 on
                # CI after passing locally, and the first instinct was "flake,
                # re-run it" -- which would have merged a genuinely broken test
                # into a release branch on a green retry. The name is what
                # reframed it: the failure was in one of the four tests just
                # added, and the defect was real (an unawaited Task made the
                # write unobservable, so the test could only poll for it).
                # Reading it required downloading a 68 MB artifact.
                #
                # The step summary already listed NAMES via `get test-results
                # tests`. It never carried the failure TEXT, and neither
                # reached the log, which is where someone opening a red job
                # looks first.
                #
                # Capped at 20 so a suite-wide breakage does not bury the step.
                echo "$SUMMARY_JSON" | jq -r '
                  def indent: gsub("\n"; "\n            ");
                  (.testFailures // []) as $f
                  | ($f[0:20][] | "  FAILED: \(.targetName // "?")/\(.testName // "?")\n            \(.failureText // "(no failure text)" | indent)"),
                    (if ($f|length) > 20 then "  ... and \(($f|length) - 20) more" else empty end)
                ' 2>/dev/null || echo "  (could not parse testFailures[] out of the summary JSON)"

                {
                  echo "test_result=failed"
                  echo "failure_count=$FAILED_COUNT"
                } >> "$GITHUB_OUTPUT"
                exit 65
              fi
            fi

            # FAIL CLOSED. A parse that could not reach a verdict is not a pass.
            # Only `.result == "Passed"` with zero failures exits 0 above; every
            # other path — tool missing, schema changed, bundle unreadable,
            # `.result == "unknown"` — lands here and fails the job. Treating "I
            # could not tell" as "it passed" is the exact assumption that shipped
            # the false green.
            TOTAL_COUNT=$(echo "$SUMMARY_JSON" | jq -r '.totalTestCount // empty' 2>/dev/null)
            echo "::error::Could not reliably determine test results from xcresult (xcresulttool exit=$SUMMARY_EXIT, result=${RESULT:-<none>}, totalTestCount=${TOTAL_COUNT:-<none>})."
            # A run that produced this ambiguity is almost never silent — xcodebuild
            # said SOMETHING on the way here, and a formatter can swallow it whole
            # rather than pass it through — measured on xcpretty, since replaced,
            # but the tee is kept for any formatter. Surface the
            # raw tee'd log's tail directly so the actual cause is visible in the
            # step output instead of leaving only "unknown" behind. tail rather than
            # cat: some builds fill this with megabytes of compiler output that
            # would only bury the one that matters.
            if [ -f xcodebuild.log ]; then
              echo "::group::xcodebuild.log (last 200 lines)"
              tail -200 xcodebuild.log
              echo "::endgroup::"
            fi
            echo "test_result=unknown" >> "$GITHUB_OUTPUT"
            exit 1

          elif [ $EXIT_CODE -ne 0 ]; then
            echo "::error::xcodebuild failed with exit code $EXIT_CODE"
            echo "test_result=failed" >> "$GITHUB_OUTPUT"
            exit $EXIT_CODE
          else
            echo "test_result=passed" >> "$GITHUB_OUTPUT"
          fi{{IOS_CI_VERIFY_SELECTORS}}

      - name: Collect Simulator Diagnostics
        if: failure()
        run: |
          echo "=== Simulator devices ==="
          xcrun simctl list devices | grep -E "(CI-iPhone|Booted)" || true
          echo "=== Relevant processes ==="
          pgrep -la "xcodebuild|testmanagerd|xctest|XCTestRunner" || echo "None found"
          echo "=== Disk space ==="
          df -h ~

      - name: Generate Test Summary
        if: always() && steps.tests.outputs.test_result != ''
        run: |
          echo "## iOS Test Results" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.tests.outputs.test_result }}" = "passed" ]; then
            echo "All tests passed" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.tests.outputs.test_result }}" = "failed" ]; then
            echo "Tests failed" >> "$GITHUB_STEP_SUMMARY"

            if [ -d "TestResults.xcresult" ]; then
              {
                echo ""
                echo "### Failed Tests"
              } >> "$GITHUB_STEP_SUMMARY"

              # `get test-results summary`, not `... tests`. Both work — the
              # `... tests` selector was verified to return nodeIdentifier
              # correctly — but it yields the NAME only, and a name does not say
              # whether a test timed out, crashed, or asserted. The summary's
              # testFailures[] carries failureText alongside targetName and
              # testName, which is the difference between "go download the
              # artifact" and "you already know".
              DETAIL=$(xcrun xcresulttool get test-results summary --path TestResults.xcresult 2>/dev/null | \
                jq -r '
                  (.testFailures // []) as $f
                  | ($f[0:20][] | "**\(.targetName // "?")/\(.testName // "?")**\n\n~~~\n\(.failureText // "(no failure text)")\n~~~\n"),
                    (if ($f|length) > 20 then "_… and \(($f|length) - 20) more_" else empty end)
                ' 2>/dev/null)

              if [ -n "$DETAIL" ]; then
                echo "$DETAIL" >> "$GITHUB_STEP_SUMMARY"
              else
                # NOT a grep of xcodebuild.log. The previous fallback hunted for
                # `Test Case .* failed`, which is XCTest's old console format and
                # which Swift Testing NEVER emits — so on a Swift Testing project
                # it matched nothing and wrote an empty section under a "Failed
                # Tests" heading. That is the same dead text-scraping the "Run
                # Tests" step documents at length, in the one place a reader
                # would go to find out what broke.
                #
                # Say plainly that the names could not be read, and give the one
                # command that gets them, so an empty section is never ambiguous
                # between "no detail available" and "no failures".
                {
                  echo "Could not read failed test names from TestResults.xcresult."
                  echo ""
                  echo "Download the ios-test-results artifact and run:"
                  echo "~~~"
                  echo "xcrun xcresulttool get test-results summary --path TestResults.xcresult"
                  echo "~~~"
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else
            echo "Test result unknown - check logs" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check Coverage
        # Gated on the tests having PASSED, not merely on the bundle existing.
        #
        # A .xcresult is written even for a build that never compiled, so
        # `hashFiles()` alone let this step run after a failure. `xccov` then
        # printed `Error: Error Domain=XCCovErrorDomain` where JSON belongs, jq
        # answered `Parse error: bad token`, and because this step runs AFTER the
        # real failure that became the LAST error-shaped line in the whole log.
        #
        # Measured cost: two separate investigations, in two different repos,
        # both grepped the failing log for `error:` and got back only `bad
        # token` — a jq message about an empty pipe, pointing at nothing. The
        # real diagnostics (a SwiftUI `@Entry` macro error in one, three Swift
        # 6.4 diagnostics in the other) were sitting further up in the
        # `Testing failed:` block, unreferenced. A step that runs after a failure
        # and emits a louder, emptier error than the failure itself is a
        # diagnostic hazard, however correct its own logic is.
        #
        # `always()` is kept so coverage still reports when the suite passes but
        # a LATER step fails.
        if: always() && steps.tests.outputs.test_result == 'passed' && hashFiles('TestResults.xcresult') != ''
        run: |
          # Calculate coverage for {{IOS_CI_APP_TARGET}} only (excludes third-party dependencies)
          #
          # Read xccov's output ONCE and check it before it reaches jq. Piping
          # straight into jq means any xccov failure surfaces as a jq parse error
          # about stdin, which names neither the tool that failed nor the reason.
          set -o pipefail
          COV_JSON=$(xcrun xccov view --report --json TestResults.xcresult 2>&1) || COV_EXIT=$?
          if [ "${COV_EXIT:-0}" -ne 0 ] || [ -z "$COV_JSON" ] || ! printf '%s' "$COV_JSON" | jq -e . >/dev/null 2>&1; then
            echo "::error::Could not read a coverage report from TestResults.xcresult (xccov exit=${COV_EXIT:-0}). This is the COVERAGE step failing, not the tests — check the Test job's own output for the real failure. xccov said:"
            printf '%s\n' "$COV_JSON" | head -5
            exit 1
          fi
          APP_COVERAGE=$(printf '%s' "$COV_JSON" | \
            jq {{IOS_CI_COVERAGE_JQ}} | \
            xargs printf "%.1f")

          {
            echo "## iOS Test Coverage: ${APP_COVERAGE}%"
            echo ""
            echo "_Coverage calculated for {{IOS_CI_APP_TARGET}} target only (excludes third-party dependencies)_"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "### Coverage by Target"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          xcrun xccov view --report --json TestResults.xcresult | \
            jq -r '.targets[] | "\(.lineCoverage * 100 | floor)% \(.name)"' | \
            sort -rn >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if (( $(echo "$APP_COVERAGE < 80" | bc -l) )); then
            echo "::warning::App coverage ${APP_COVERAGE}% is below 80% threshold"
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: ios-test-results{{IOS_CI_ARTIFACT_SUFFIX}}
          # xcodebuild.log alongside the xcresult bundle: a formatter has been seen
          # to swallow xcodebuild's own output silently (measured on xcpretty, since
          # replaced by xcbeautify — the raw log is kept regardless)
          # against newer Xcode versions, and the step output above only ever
          # showed the last 200 lines. The full tee'd log is what actually
          # settles a "result: unknown" run whose cause wasn't in that tail.
          path: |
            TestResults.xcresult
            xcodebuild.log
          if-no-files-found: ignore
          retention-days: 1

      # Delete the devices this run created.
      #
      # Naming them per run removed the implicit cleanup the old fixed name had,
      # where the next run reclaimed the previous one's device by recreating it.
      # Without this every run leaks a simulator until the nightly cleanup
      # workflow, and a busy day fills the disk on the one shared Mac.
      #
      # always(), so cancelled and failed runs clean up too — those are exactly
      # the runs that would otherwise leak, and cancellation is common here
      # because same-ref runs cancel each other by design.
      #
      # LAST in the job, deliberately: placed before "Collect Simulator
      # Diagnostics" it would delete the simulator that step exists to inspect.
      - name: Delete this run's simulators
        if: always()
        run: |
          set -uo pipefail
          # SCOPED PER PRODUCT, exactly like the stale-device sweep in "Setup
          # Simulator" above. `GITHUB_RUN_ID` is shared by every matrix leg of
          # one run, so a selector keyed on it alone matches SIBLING legs' live
          # devices: whichever product finished first deleted the other's
          # simulator mid-test, and the slower product failed with "Failed to
          # prepare device ... No matching device in set" plus whichever test
          # happened to be executing. Setup already carried the suffix; this
          # step did not, which is the whole bug.
          ids=$(xcrun simctl list devices | grep "CI-iPhone-${GITHUB_RUN_ID}{{IOS_CI_SIM_SUFFIX}}{{IOS_CI_SIM_MATCH}}" | grep -oE '[A-F0-9-]{36}' || true)
          for id in $ids; do
            echo "Deleting this run's simulator: $id"
            xcrun simctl shutdown "$id" 2>/dev/null || true
            xcrun simctl delete "$id" 2>/dev/null || true
          done

  baseline:
    name: Baseline
    runs-on: [self-hosted, macOS, ARM64, dedicated]
    needs: changes
    # Skip on docs-only PRs, same gate as Lint. A skipped job counts as passing
    # for the CI OK aggregator.
    # SECURITY: same-repo guard — fork-PR code must not run on the self-hosted runner.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      # FIRST, before any xcodebuild. A toolchain change on a shared self-hosted
      # host arrives with no PR and no warning, and its first symptom is a red
      # `main` on an unrelated merge. This turns that into a named failure.
      #
      # The licence check is the load-bearing half. An unaccepted Xcode licence
      # does not report itself as a licence problem — the observed first symptom
      # was `unable to spawn process '.../embeddedBinaryValidationUtility' (No
      # such file or directory)` for a file that was sitting on disk, which sends
      # you looking for a corrupted install. `-checkFirstLaunchStatus` exits
      # non-zero for exactly this state and costs nothing.
      - name: Verify the toolchain
        run: |
          set -uo pipefail
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-<unset, inheriting xcode-select>}"
          if ! xcodebuild -checkFirstLaunchStatus >/dev/null 2>&1; then
            echo "::error::Xcode's first-launch tasks are not complete on this runner — most often an unaccepted licence after an upgrade. Every xcodebuild and simctl call will fail, and NOT with a message that says so. Run: sudo xcodebuild -license accept && sudo xcodebuild -runFirstLaunch"
            exit 1
          fi
          have="$(xcodebuild -version 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g; s/ $//')"
          echo "Toolchain: $have"
          echo "Toolchain: \`$have\`" >> "$GITHUB_STEP_SUMMARY"
          # Echoed unconditionally, asserted only when the project declares an
          # expectation. Most of the fleet declares none and must keep building
          # on whatever the host has; for them the echo above is the whole point,
          # because it makes a silent upgrade visible in the log.
          want="{{IOS_XCODE_EXPECTED}}"
          if [ -n "$want" ] && ! printf '%s' "$have" | grep -qF "$want"; then
            echo "::error::This project expects Xcode $want; the runner has: $have. A toolchain moved under CI without a PR. Either install/select the expected Xcode on the host, or change xcode_version in .lacquer.toml deliberately — as a change that runs CI before it lands."
            exit 1
          fi
      - uses: actions/checkout@v7

      - name: Create Secrets.xcconfig (build-time placeholder)
        run: |
          # -showBuildSettings evaluates the project the same way a build does, so
          # a missing base config fails it exactly as it fails the build jobs.
          # Seed EVERY Secrets.xcconfig.example under the component, each beside
          # itself — not just the one at the component root.
          #
          # kit keeps its example at BOTH ./Secrets.xcconfig.example and
          # Kit/Kit/Secrets.xcconfig.example, and the Xcode project reads the
          # nested one. The old single-path copy seeded only the root, "succeeded",
          # and the Release build then died with:
          #   could not find included file 'Kit/Kit/Secrets.xcconfig'
          # — an error that points nowhere near the step that caused it. The
          # guard made it worse: a project with no example at the root was a
          # silent no-op rather than a signal.
          find {{COMPONENT_PREFIX}}. -name 'Secrets.xcconfig.example' \
            -not -path '*/DerivedData*' -not -path '*/build/*' -not -path '*/.build/*' \
            -print0 2>/dev/null | while IFS= read -r -d '' ex; do
              target="${ex%.example}"
              [ -f "$target" ] || cp "$ex" "$target"
            done

          # And the scheme's own directory, when the component root holds the only
          # example: an Xcode project resolves baseConfigurationReference against the
          # app target's folder, not the component root, so seeding beside the example
          # alone exits 0 having seeded nothing the build can open. See the Build
          # (Release) job above for the failure this reproduces.
          nexamples=$(find {{COMPONENT_PREFIX}}. -name 'Secrets.xcconfig.example' \
            -not -path '*/DerivedData*' -not -path '*/build/*' -not -path '*/.build/*' \
            2>/dev/null | wc -l | tr -d ' ')
          scheme_dir="{{COMPONENT_PREFIX}}{{SCHEME}}"
          if [ "$nexamples" = "1" ] && [ -f "{{COMPONENT_PREFIX}}Secrets.xcconfig.example" ] \
            && [ -d "$scheme_dir" ] && [ ! -f "$scheme_dir/Secrets.xcconfig" ]; then
            cp "{{COMPONENT_PREFIX}}Secrets.xcconfig.example" "$scheme_dir/Secrets.xcconfig"
          fi

      - name: Generate Xcode project (XcodeGen)
        run: |
          # project.yml at the component root means the project is generated by
          # XcodeGen. Most of this fleet commits the generated .xcodeproj as a
          # build artifact (see profiles/ios/CLAUDE.ios.md) -- regenerating it
          # here is then a no-op. A project that instead gitignores it (a real,
          # deliberate choice: the pbxproj is merge-hostile and nobody reviews
          # it) has no .xcodeproj in a clean checkout at all, and every step
          # below that references {{XCODEPROJ}} fails before it can even open
          # the project. Guarded on project.yml so a project with no XcodeGen
          # spec (xcodeproj committed with no generator) is unaffected.
          if [ -f "{{COMPONENT_PREFIX}}project.yml" ]; then
            (cd {{COMPONENT_PREFIX}}. && xcodegen generate)
          fi

      # A declared xcodeproj that doesn't exist on disk yet is expected for a
      # component declared per the archetype rule before any code exists (e.g.
      # a Phase-0 backend-first project) — `lacquer audit`'s baseline check
      # already treats that as Unchecked, not an error, when the component has
      # no Swift sources either. This job's own `xcodebuild -showBuildSettings`
      # call below has no equivalent exemption and previously failed outright
      # for exactly that case, with an error that points at Xcode rather than
      # at the real (expected, pre-code) cause.
      - name: Detect Xcode project
        id: xcodeproj
        run: |
          if [ -d "{{XCODEPROJ}}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          has_swift=$(find {{COMPONENT_PREFIX}}. -name '*.swift' \
            -not -path '*/.build/*' -not -path '*/DerivedData*/*' -print -quit)
          if [ -z "$has_swift" ]; then
            echo "::notice::{{XCODEPROJ}} does not exist and {{COMPONENT_PREFIX}} has no Swift sources yet — nothing to baseline-check (pre-code component)."
            exit 0
          fi
          echo "::error::{{XCODEPROJ}} does not exist, but Swift sources are present under {{COMPONENT_PREFIX}}. Commit the generated .xcodeproj, or add a project.yml so XcodeGen can regenerate it."
          exit 1

      # The relaxation mechanism is only as good as the checks that honour it.
      # `lacquer audit` reads [baseline.relax]; THIS job did not — so a project
      # with a valid, unexpired warnings_as_errors relaxation passed audit and
      # failed CI on the same key. kit and port-of-entry both hit that.
      #
      # Reads the manifest directly rather than via docs-relaxation.sh, which is
      # hardcoded to the `documentation` key.
      - name: Read the baseline relaxations
        id: baserelax
        if: steps.xcodeproj.outputs.present == 'true'
        run: |
          set -euo pipefail
          for key in swift_version warnings_as_errors strict_concurrency; do
            line=$(awk -v k="$key" '
              /^\[baseline\.relax\][[:space:]]*$/ { inblock = 1; next }
              /^\[/                                 { inblock = 0 }
              inblock && $0 ~ "^[[:space:]]*"k"[[:space:]]*=" { print; exit }
            ' .lacquer.toml 2>/dev/null || true)
            [ -n "$line" ] || continue
            until_date=$(printf '%s' "$line" | sed -n 's/.*until[[:space:]]*=[[:space:]]*"\([0-9-]\{10\}\)".*/\1/p')
            [ -n "$until_date" ] || { echo "::error::[baseline.relax].$key needs an until date"; exit 1; }
            if [ "$(date -u +%Y-%m-%d)" \> "$until_date" ]; then
              echo "::error::The [baseline.relax] $key entry expired on ${until_date}. Meet the baseline or extend it deliberately."
              exit 1
            fi
            echo "::warning::${key} is relaxed until ${until_date} — checked and reported, but not blocking."
            echo "relax_${key}=1" >> "$GITHUB_OUTPUT"
          done

      - name: Assert the project baseline
        if: steps.xcodeproj.outputs.present == 'true'
        env:
          RELAX_SWIFT_VERSION: ${{ steps.baserelax.outputs.relax_swift_version }}
          RELAX_WARNINGS_AS_ERRORS: ${{ steps.baserelax.outputs.relax_warnings_as_errors }}
        run: |
          set -o pipefail
          # This checks the EFFECTIVE build settings, deliberately a different
          # fidelity from `lacquer audit`, which reads the pbxproj statically.
          # xcconfig layering and inherited values are invisible to a static read;
          # they are visible here. Two independent checks at different fidelity —
          # the same shape as the SPM cache validation above.
          #
          # -showBuildSettings resolves per target for every target in the
          # scheme's build action — so a half-finished migration where the app is
          # compliant but a widget or watch target is not shows up here. Targets
          # OUTSIDE the scheme are not covered by this job; `lacquer audit`'s
          # static read walks every build configuration in the project and covers
          # exactly that gap. Neither check subsumes the other, which is the point
          # of running both.
          # Capture stderr instead of discarding it — a prior version routed it to
          # /dev/null, so when this failed for a reason OTHER than "no baseline
          # violations" (a provisioning/scheme/destination error, say), the real
          # cause was thrown away and only the generic error below ever surfaced.
          settings_err=$(mktemp)
          settings=$(xcodebuild -showBuildSettings \
            -project "{{XCODEPROJ}}" \
            -scheme "{{SCHEME}}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            2>"$settings_err") || {
            echo "::error::xcodebuild -showBuildSettings failed; cannot verify the baseline."
            cat "$settings_err" >&2
            rm -f "$settings_err"
            exit 1
          }
          rm -f "$settings_err"

          fail=0

          # Guard: if the grep below matches nothing, an absent setting would read
          # as "no violations" — the silent-pass failure mode the SwiftLint step
          # guards against too. Require at least one SWIFT_VERSION line.
          #
          # A here-string, not `printf ... | grep -q`: `-q` exits the instant it
          # finds a match, and $settings regularly exceeds the ~64KB pipe buffer.
          # Under `set -o pipefail`, the still-writing printf's resulting SIGPIPE
          # outranks grep's real (successful) match, so the pipeline reports
          # failure even though the line was right there — reproduced directly:
          # a >64KB payload with an early match reliably exits 141 through the
          # pipe form and 0 through the here-string. Every other grep in this
          # step already reads through a full-consuming stage (sort -u) first,
          # so this is the only spot that needed it.
          if ! grep -q 'SWIFT_VERSION' <<<"$settings"; then
            echo "::error::No SWIFT_VERSION in -showBuildSettings output — the baseline check is silently doing nothing."
            exit 1
          fi

          # Every resolved SWIFT_VERSION must be 6 or newer.
          # $1+0 forces a numeric comparison: a bare string compare would make an
          # empty or non-numeric value sort below "6" and fail spuriously.
          bad=$(printf '%s\n' "$settings" | grep 'SWIFT_VERSION = ' \
            | sed 's/.*SWIFT_VERSION = //' | tr -d ' ' | sort -u \
            | awk -F. 'NF && $1+0 < 6 { print }')
          if [ -n "$bad" ]; then
            if [ -n "${RELAX_SWIFT_VERSION:-}" ]; then
              echo "::warning::SWIFT_VERSION below 6 in at least one target: $(printf '%s' "$bad" | tr '\n' ' ') (relaxed)"
            else
              echo "::error::SWIFT_VERSION below 6 in at least one target: $(printf '%s' "$bad" | tr '\n' ' ')"
              fail=1
            fi
          fi

          # Warnings-as-errors must be on everywhere Swift is compiled. A target
          # that never sets it resolves to NO, which is exactly the gap this job
          # exists to catch.
          wae_bad=0
          if printf '%s\n' "$settings" | grep 'SWIFT_TREAT_WARNINGS_AS_ERRORS = ' \
            | sed 's/.*= //' | tr -d ' ' | sort -u | grep -qv '^YES$'; then
            wae_bad=1
          fi
          # Here-string, not `printf ... | grep -q` -- see the SWIFT_VERSION guard
          # above for why: a bare pipe into `-q` risks a pipefail-amplified
          # SIGPIPE false failure once $settings passes the pipe buffer size.
          if ! grep -q 'SWIFT_TREAT_WARNINGS_AS_ERRORS' <<<"$settings"; then
            wae_bad=1
          fi
          if [ "$wae_bad" -ne 0 ]; then
            if [ -n "${RELAX_WARNINGS_AS_ERRORS:-}" ]; then
              echo "::warning::SWIFT_TREAT_WARNINGS_AS_ERRORS is not YES for every target (relaxed)."
            else
              echo "::error::SWIFT_TREAT_WARNINGS_AS_ERRORS is not YES for every target."
              fail=1
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Project baseline not met. See profiles/ios/baseline.toml in the lacquer, or add a time-boxed [baseline.relax] entry to .lacquer.toml."
            exit 1
          fi
          echo "Project baseline met."{{IOS_CI_WATCH_TEST_JOB}}

  ci-ok:
    name: CI OK
    # Just aggregates the needs[] results — no toolchain of any kind. It is
    # `if: always()`, so it starts on EVERY run, and GitHub bills a ONE-MINUTE
    # MINIMUM PER JOB: on a billed runner this gate spent a whole minute to do
    # four seconds of reading `needs.*.result`. `pi-gate` is a ROLE label
    # carried by runners on two separate boxes, so it costs nothing and still
    # fails over (see CLAUDE.md "CI Runners").
    runs-on: [self-hosted, Linux, pi-gate]
    # The check branch protection is MEANT to point at — "CI OK", not Lint /
    # Build / Test directly. It ALWAYS runs, so it always reports — even on
    # docs-only PRs where every heavy job skips — so branch protection never
    # gets stuck "pending" and docs PRs merge without an admin bypass. Fails
    # only if a required job actually FAILED or was CANCELLED; a skipped job
    # counts as OK.
    #
    # "Meant to", not "does": this file cannot make it so. Branch protection is
    # a repository setting, lives in no file here, and needs ADMIN to even read
    # — a workflow's GITHUB_TOKEN cannot. Measured, 3 of 17 repos point
    # elsewhere or nowhere (see the paragraph in `changes` above). That gap is
    # checked by `lacquer protection`, deliberately from an operator's machine:
    # a repo whose protection requires nothing real cannot be the thing that
    # reports so, because the report would not be required either.
    #
    # Why THIS job rather than the real ones: a skipped check SATISFIES a
    # required status check on GitHub. Every job below is skippable by
    # construction (path filters, `needs` short-circuits, matrix legs that do
    # not render), so requiring any of them by name buys a gate that a skip can
    # satisfy. This one is `if: always()` and reads `needs.*.result`, which is
    # why it is the only name worth requiring.
    needs: [changes, lint, baseline, build-release, test{{IOS_CI_WATCH_NEED}}]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Verify required jobs passed (or were skipped)
        run: |
          echo "changes=${{ needs.changes.result }} lint=${{ needs.lint.result }} baseline=${{ needs.baseline.result }} build-release=${{ needs.build-release.result }} test=${{ needs.test.result }}{{IOS_CI_WATCH_ECHO}}"
          for r in \
            "${{ needs.changes.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.baseline.result }}" \
            "${{ needs.build-release.result }}" \
            "${{ needs.test.result }}"{{IOS_CI_WATCH_RESULT}}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job did not pass (result=$r)"
              exit 1
            fi
          done
          # `drift` is deliberately NOT in the loop above: it is no longer a job.
          # It runs as a step inside `changes` (Actions bills a one-minute
          # MINIMUM per job, so a 24-second job cost a whole billed minute) and
          # reports through an OUTPUT, because failing `changes` outright would
          # skip every job that needs it and suppress the real results on the
          # very PR you need them for. So the verdict is enforced HERE, in the
          # required check, where it blocks the merge and nothing else.
          #
          # Empty means the audit did not need to run — the PR touched no
          # lacquer-managed path — which is a pass. Anything that is not exactly
          # "pass", including a value this job does not recognise, fails.
          drift="${{ needs.changes.outputs.drift }}"
          echo "drift=${drift:-<not run>}"
          if [ -n "$drift" ] && [ "$drift" != "pass" ]; then
            echo "::error::lacquer drift was detected — see the \"Detect changed paths\" job log for what to fix."
            exit 1
          fi
          echo "All required jobs passed or were skipped."
