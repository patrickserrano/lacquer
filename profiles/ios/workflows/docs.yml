name: iOS Docs

# Publishes the DocC archive to https://<owner>.github.io/<repo>/swift/.
#
# Validation lives in ios-ci.yml's `Docs` job, not here, because branch
# protection points at a single required check (CI OK) and a job in another
# workflow cannot be one of its `needs`. This workflow only publishes what CI
# already proved builds clean.
#
# SCHEDULED, not on push. The DocC build takes ~38 minutes and this fleet has ONE
# self-hosted Mac, so every merge put a 38-minute job at the head of a queue that
# CI and releases then sat behind. Publishing docs is not urgent; the work
# waiting behind it is.

on:
  workflow_dispatch:
  schedule:
    # Overnight. Publishing docs is never urgent; the work that queues behind it
    # is. 03:00 UTC clears before the 07:00 / 08:00 / 09:00 dailies start.
    - cron: '0 3 * * *'

permissions:
  contents: write # scripts/publish-docs.sh pushes the gh-pages branch

# Deliberately NOT keyed on the workflow or ref: this group is shared with every
# other stack's docs workflow in the repo (web-docs.yml, supabase-docs.yml), so
# two stacks never push gh-pages concurrently. Never cancel — a cancelled publish
# leaves the branch without this commit's docs and nothing retries it.
concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  # A cheap gate on a hosted runner, so the expensive job never starts when the
  # published docs already match the source.
  #
  # A job-level `if` rather than per-step conditions: a skipped job never
  # occupies a runner at all. That is the whole point for iOS, where the build
  # takes ~38 minutes on the fleet's ONE self-hosted Mac and everything else —
  # CI, releases — queues behind it.
  publish:
    name: Build and publish DocC
    runs-on: [self-hosted, macOS, ARM64, dedicated]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: the staleness check below asks for the last commit
          # that touched this component; a depth-1 clone reports none and
          # would skip forever.
          fetch-depth: 0

      - id: stale
        run: |
          set -euo pipefail
          current=$(git log -1 --format=%H -- "{{COMPONENT_PREFIX}}" || true)
          if [ -z "$current" ]; then
            echo "No commits touching this component — nothing to publish."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          published=""
          if git fetch --quiet --depth 1 origin gh-pages 2>/dev/null; then
            # A missing file, a missing branch and a first-ever run all land here
            # and all mean "publish". That is the safe direction: a spurious
            # build costs runner time, a spurious skip serves stale docs
            # indefinitely with nothing reporting it.
            published=$(git show FETCH_HEAD:swift/.docs-source 2>/dev/null || true)
          fi

          if [ "$current" = "$published" ]; then
            echo "Published docs are already built from $current — skipping."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Source at $current, published at ${published:-<none>} — rebuilding."
            {
              echo "needed=true"
              echo "sha=$current"
            } >> "$GITHUB_OUTPUT"
          fi

      # The hosting base path is baked into every asset URL in the archive, so it
      # has to match where the site is actually served from — `<repo>/swift`, one
      # level down from the Pages root because each stack owns a subdirectory.
      # Get this wrong and the site loads but renders unstyled: every CSS and JS
      # request 404s.
      # Honour [baseline.relax] documentation, exactly as the CI Docs job and the
      # local hooks do. This workflow did NOT, so a project with a valid,
      # unexpired relaxation went green on its PR and then failed on main the
      # moment it merged — which is precisely the "a lot of failures on main"
      # symptom. Third place this same relaxation had to be taught.
      - name: Read the documentation relaxation
        if: steps.stale.outputs.needed == 'true'
        id: relax
        run: |
          set -euo pipefail
          state=$(scripts/docs-relaxation.sh .lacquer.toml 2>/dev/null || echo none)
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          case "$state" in
            expired)   echo "::error::The documentation relaxation in .lacquer.toml has expired."; exit 1 ;;
            malformed) echo "::error::The [baseline.relax] documentation entry is malformed."; exit 1 ;;
            relaxed)   echo "::warning::Documentation is relaxed — publishing what builds, not gating on completeness." ;;
          esac

      - name: Build documentation
        if: steps.stale.outputs.needed == 'true'
        # NOT continue-on-error: that marks a FAILED build as successful, so the
        # archive is never staged and the publish step below dies with
        # "'docs-site' is not a directory". DOCS_RELAXED tells build-docs.sh to
        # report its warnings instead of aborting, so the site still gets built.
        env:
          DOCS_RELAXED: ${{ steps.relax.outputs.state == 'relaxed' && '1' || '' }}
        run: scripts/build-docs.sh docs-site "${GITHUB_REPOSITORY#*/}/swift"

      - name: Publish to gh-pages/swift
        if: steps.stale.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCS_SOURCE_SHA: ${{ steps.stale.outputs.sha }}
        run: scripts/publish-docs.sh swift docs-site

      # This runner's workspace persists between runs; see ios-ci.yml's Docs job.
      - name: Clean up the staged site
        if: always()
        run: rm -rf docs-site

      - name: Link the published site
        if: steps.stale.outputs.needed == 'true'
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "### Documentation published"
            echo ""
            echo "https://${owner}.github.io/${repo}/swift/"
            echo ""
            echo "That URL only resolves if GitHub Pages is enabled. On a PRIVATE"
            echo "repository, do NOT enable it: a Pages site is served publicly even"
            echo "when the repository is not, so it would publish these API docs — and"
            echo "the internal type and module names in them — to anyone with the URL."
            echo "Read the docs by checking out the gh-pages branch instead."
          } >> "$GITHUB_STEP_SUMMARY"
