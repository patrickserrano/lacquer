# No `included` allowlist on purpose. SwiftLint intersects `included` with the
# path passed on the command line, so a GUESSED source-dir name (e.g.
# "{{PROJECT_NAME}}/") that doesn't match the project's actual layout (App/,
# nested, package sources, …) makes SwiftLint find "No lintable files" and
# silently enforce NOTHING. The CI/pre-commit invocations already pass the
# component path, so lint everything under it and just exclude build output and
# generated code — that works for any layout.
excluded:
  - "**/Generated"
  - "**/.build"
  - "**/.swiftpm"
  - "**/DerivedData"
  - "**/DerivedData-*"
  - "**/Package.swift"
  # Git worktrees. `.worktrees/<feature>/` is this fleet's own convention (see
  # profiles/ios's "Working in worktrees" guidance) and `.claude/worktrees/` is
  # where agents put theirs — both are FULL checkouts of the project, so
  # linting them reports every violation twice and attributes half of them to
  # paths that vanish when the worktree is removed. skein surfaced this: 12
  # violations, of which 5 were duplicates from `.worktrees/`.
  - "**/.worktrees"
  - "**/.claude"

opt_in_rules:
  - closure_body_length
  - contains_over_filter_count
  - empty_collection_literal
  - empty_count
  - empty_string
  - force_unwrapping
  - implicit_return
  - modifier_order
  - multiline_arguments
  - sorted_imports
  - trailing_closure
  - type_contents_order

disabled_rules:
  - todo
  - opening_brace
  - trailing_whitespace
  - trailing_comma

# Apple's swift-format enables AlwaysUseLowerCamelCase; this is the equivalent,
# and it was the ONE rule in this file switched off with no reason recorded.
#
# The reason was almost certainly SwiftLint's length opinion rather than the
# naming rule: with stock settings it fires 381 times in one repo, and the top
# offenders are `i` (81), `fm` (46), `v` (22), `ex` (17) — loop counters and
# local bindings, not naming problems. Apple's rule has no length component at
# all; min_length 1 drops it and keeps the camelCase enforcement, which is the
# part worth having.
#
# Measured across underfoot, skein, kit, rail, flare and shelflife before
# enabling: ZERO violations. This costs nothing today and catches the next
# `SENTRY_PACKAGE_INFO` or `mainThread_isActive` on the PR that introduces it.
identifier_name:
  min_length: 1
  max_length: 60
  allowed_symbols: ["_"]
  # Swift Testing lets a test be named as a sentence:
  #
  #     @Test func `Verifier is at least 43 characters`() {}
  #
  # which is idiomatic, is what shows up in the test navigator, and starts with
  # a capital because it is prose. This rule flagged every one of them the day
  # it was enabled, and the breakage only surfaced when a project that used the
  # style was synced weeks later — it was not in the sample the rule was
  # measured against.
  #
  # The exclusion is anchored on the backticks rather than turning off
  # validates_start_with_lowercase, which would also stop catching a plain
  # `func DoTheThing()`. Measured on a fixture carrying both: with this,
  # DoTheThing is still the only violation; with the rule off, neither is.
  # A backtick-quoted identifier is the only kind that can hold a space, so the
  # pattern cannot silence an ordinary name by accident.
  excluded: ["^`.*`$"]

line_length:
  warning: 120
  error: 150
  ignores_comments: true

file_length:
  warning: 400
  error: 500
  ignore_comment_only_lines: true

type_body_length:
  warning: 300
  error: 350

function_body_length:
  warning: 40
  error: 60

force_unwrapping:
  severity: error

type_contents_order:
  order:
    - case
    - associated_type
    - type_alias
    - subtype
    - type_property
    - instance_property
    - initializer
    - deinitializer
    - type_method
    - view_life_cycle_method
    - subscript
    - other_method

# NOTE: a related Release-only hazard worth a project-specific rule — an
# un-gated `#Preview` that references a helper defined only inside `#if DEBUG`
# compiles fine in Debug and passes the Test job, but breaks the Release
# archive. If you add such DEBUG-only preview helpers, add a custom rule that
# requires their containing files to have an `#if DEBUG`, and lean on the
# CI "Build (Release)" job as the backstop.
custom_rules:
  no_singleton_abuse:
    name: "Avoid .shared singletons"
    # Negative lookbehinds exempt framework-mandated singletons that have no DI
    # alternative. UIApplication/NSApplication/URLSession are fully general.
    # WidgetCenter, MusicLibrary, Aptabase and DCAppAttestService were added
    # after onboarding found
    # them unsatisfiable: verified against the iOS 26.5 SDK .swiftinterface, both
    # WidgetCenter and MusicLibrary expose `public static let shared` and NO
    # public initializer, so no amount of DI removes the token from source — a
    # protocol seam only relocates the one acquisition site, and this rule is
    # repo-wide. Bare app-level `.shared` is still flagged.
    regex: "(?<!UIApplication)(?<!NSApplication)(?<!URLSession)(?<!WidgetCenter)(?<!MusicLibrary)(?<!Aptabase)(?<!DCAppAttestService)\\.shared(?!Container|Instance\\(\\)|\\(\\))"
    message: "Prefer dependency injection over singletons"
    severity: warning
    # To exempt ONE sanctioned DI-seam file that wraps a vendor `.shared`
    # (RevenueCat's Purchases.shared, Firebase, etc.), scope it rather than
    # disabling the rule inline:
    #   excluded: ".*MyVendorGateway\\.swift$"

  sendable_protocol:
    name: "Protocols should require Sendable"
    regex: "protocol\\s+(\\w+)(Fetching|Repository|Service|Provider|Managing)\\s*(?!:.*Sendable)"
    message: "Service/Repository protocols should require Sendable"
    severity: warning

  no_print_statements:
    name: "No print statements"
    regex: "\\bprint\\s*\\("
    message: "Use Logger instead of print()"
    severity: warning
    excluded: ".*Tests\\.swift$"

  no_task_sleep_in_tests:
    name: "No Task.sleep in tests"
    regex: "Task\\.sleep\\s*\\("
    message: "Use condition-based waiting instead of Task.sleep() - arbitrary delays cause flaky tests"
    severity: error
    included: ".*Tests\\.swift$"

  no_new_xctest_files:
    name: "Prefer Swift Testing over XCTest"
    regex: "^import XCTest$"
    match_kinds: identifier
    message: "Use Swift Testing (@Test, @Suite) for new test files - XCTest is legacy"
    severity: warning
    included: ".*Tests\\.swift$"

  one_suite_per_file:
    name: "One @Suite per file"
    regex: "(?s)@Suite\\b.*@Suite\\b"
    message: "Each test file must contain at most one @Suite declaration"
    severity: error
    included: ".*Tests\\.swift$"

  prefer_polling_over_sleep_loops:
    name: "No sleep-based polling loops in tests"
    regex: "while\\s+.*\\{[^}]*Task\\.sleep"
    message: "Poll the condition directly instead of looping with Task.sleep"
    severity: warning
    included: ".*Tests\\.swift$"
    excluded: ".*TestHelpers\\.swift$"

  excessive_call_tracking:
    name: "Avoid excessive call tracking in mocks"
    regex: "(?:^\\s*(?:private\\(set\\)\\s+)?(?:var|let)\\s+\\w+Called\\s*[:=][^\\n]*\\n){3,}"
    message: "Excessive call tracking (3+ *Called properties) - prefer testing observable behavior over method calls"
    severity: warning
    included: ".*Mock.*\\.swift$"
    multiline: true

  no_failed_in_test_names:
    name: "Avoid 'failed' in test names"
    regex: "@Test\\s*\\(\"[^\"]*[Ff]ailed[^\"]*\"|@Test\\s*(?:\\([^)]*\\))?\\s*(?:@\\w+\\s+)*func\\s+(?:`[^`]*[Ff]ailed[^`]*`|\\w*[Ff]ailed\\w*)\\s*\\(|func\\s+test\\w*[Ff]ailed\\w*\\s*\\(|func\\s+`test[^`]*[Ff]ailed[^`]*`"
    message: "Avoid 'failed' in test names — test tooling misidentifies them as failures. Use 'errored', 'errors', or 'throws' instead."
    severity: error
    included: ".*Tests\\.swift$"
    multiline: true

# REMOVED: no_repository_in_viewmodel. It was harvested from one app and applied
# fleet-wide as a --strict (blocking) rule, and NOT ONE of the five apps audited
# during onboarding followed it: flare had 30 violations, kit 50. Satisfying it
# in flare alone meant a Service layer across 7 ViewModels, 3 protocols, 11
# methods and 42 construction sites — an architecture migration, arriving as a
# lint error, on a branch whose job was to install shared config.
#
# A rule that no project follows is not a standard; it is one project's
# preference. The layering guidance stays in CLAUDE.ios.md where it can inform a
# deliberate decision, rather than blocking every future onboarding on a
# refactor nobody scoped.
