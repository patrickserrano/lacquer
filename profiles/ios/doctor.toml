# Self-tests for the ios profile, run by `lacquer doctor`.
#
# Each probe writes KNOWN-BAD code and asserts the check REJECTS it, and names
# the diagnostic that rejection produces. That is the opposite of what CI does,
# and it is the only way to catch a check that has stopped checking. Every probe
# here exists because something in this list actually broke and nothing noticed.
#
# `expect_output` is the second half of the contract and it is not optional for
# an expect="fail" probe: a non-zero exit is also what SwiftLint prints for an
# unreadable config (exit 134), a removed flag (exit 64, "Unknown option"), or a
# binary that is not there. Each probe below asserts the rule id it means to
# trip, so "the check rejected the fixture" cannot be confused with "the check
# could not start".

[[probe]]
name = "SwiftLint rejects a warning-severity violation under --strict"
why = """
line_length, file_length, type_body_length and function_body_length are all
WARNING severity. Without --strict they print and pass locally, then fail the
PR. A hook that drops --strict, or carries `|| true`, reports green forever.
"""
file = "Probe.swift"
# The fixture must land in the WARNING band and nowhere else. line_length warns
# at 120 and errors at 150, so an over-150 line fails with or WITHOUT --strict
# and proves nothing about it. This line is 130 characters: rejected only
# when --strict promotes warnings to errors. The first version of this probe was
# over 150 and silently tested nothing — found by simulating the very regression
# it exists to catch.
content = """
/// A type with a line in the warning band only.
struct DoctorProbeType {
    /// A value.
    let value = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
}
"""
argv = ["swiftlint", "--strict", "--config", "{component}/.swiftlint.yml", "{dir}"]
expect = "fail"
# `error:` is the whole point. line_length is WARNING severity in this band, so
# the word only appears because --strict promoted it; without the flag SwiftLint
# prints `warning:` and exits 0. Asserting the promoted severity is what makes
# this a test of --strict rather than of line_length.
expect_output = '(?s)Probe\.swift:[0-9]+:[0-9]+: error: Line Length Violation:.*\(line_length\)'

[[probe]]
name = "SwiftLint is invoked in a form it still accepts"
why = """
The editor hook called `swiftlint lint --path FILE`. --path had been removed
from SwiftLint, so the command errored on every write and `2>/dev/null || true`
swallowed it — nothing was linted for months. This probe fails if the modern
positional-path invocation stops working.

Two things about it were wrong until now, and they were the same thing twice.
It ran against .swiftlint-docs.yml on an undocumented member, so it was
satisfied by the missing_docs violation the probe below already tests — and,
worse, equally satisfied by SwiftLint refusing the command line, by an
unreadable config, or by exit 127. A probe for an INVOCATION FORM that passes
when the invocation is rejected is inside out.

It now runs the hook's own command line (see the PostToolUse hook in
profiles/ios/root/.claude/settings.json: `swiftlint lint --strict --config
<.swiftlint.yml> --quiet <file>`) against a force_unwrapping fixture, and
asserts that specific rule. force_unwrapping is an opt-in rule this
.swiftlint.yml enables and a warning that only --strict promotes, so the
assertion covers the config, the flag and the argument shape at once. Restore
`--path` and SwiftLint answers "Unknown option '--path'" at exit 64, which is
non-zero and matches nothing here.
"""
file = "Probe.swift"
content = """
/// A type the editor hook's own command line must still reject.
struct DoctorProbeType {
    /// Force-unwraps, which .swiftlint.yml opts in to via force_unwrapping.
    func value(_ input: Int?) -> Int { input! }
}
"""
argv = ["swiftlint", "lint", "--strict", "--quiet", "--config", "{component}/.swiftlint.yml", "{dir}/Probe.swift"]
expect = "fail"
expect_output = '(?s)Probe\.swift:[0-9]+:[0-9]+: error: Force Unwrapping Violation:.*\(force_unwrapping\)'

[[probe]]
name = "SwiftFormat --lint rejects unformatted code"
why = "A formatter check that accepts anything is indistinguishable from no check."
file = "Probe.swift"
content = """
/// Badly indented on purpose.
struct DoctorProbeType {
      let value  =  1
}
"""
argv = ["swiftformat", "--lint", "--config", "{component}/.swiftformat", "{dir}"]
expect = "fail"
# Naming the rule proves SwiftFormat parsed the file and produced a diff. An
# unreadable --config, or a rule name the running version no longer knows, also
# exits non-zero and prints nothing of the sort.
expect_output = '(?s)Probe\.swift:[0-9]+:[0-9]+: error: \(indent\).*Source input did not pass lint check\.'

[[probe]]
name = "missing_docs rejects an undocumented declaration"
why = """
The documentation baseline is enforced by .swiftlint-docs.yml. If that config is
mis-scoped it matches no files, exits 0, and the whole standard silently stops
applying — the same silent-pass shape the CI lint job guards against.
"""
file = "Probe.swift"
content = """
struct DoctorProbeUndocumented {
    func alsoUndocumented() {}
}
"""
argv = ["swiftlint", "--strict", "--config", "{component}/.swiftlint-docs.yml", "{dir}"]
expect = "fail"
# The failure mode this guards is the config matching NO files and exiting 0, so
# the assertion has to be that missing_docs actually fired on the fixture — not
# that swiftlint had some opinion or other.
expect_output = '(?s)Probe\.swift:[0-9]+:[0-9]+: error: Missing Docs Violation:.*\(missing_docs\)'

[[probe]]
name = "the formatter and the linter agree on member order"
why = """
SwiftFormat's organizeDeclarations is what makes type_contents_order fixable.
When --type-order drifts from .swiftlint.yml's order the two fight: the
formatter rewrites, the linter rejects the rewrite, and no amount of running
either converges. That drift shipped once already and cost 48 violations in one
app. This probe formats a fixture and then lints the FORMATTER'S OWN OUTPUT,
which must be clean.
"""
file = "Probe.swift"
content = """
import SwiftUI

/// A view whose members start out in the wrong order.
struct DoctorProbeView: View {
    /// The body.
    var body: some View { helper() }
    /// A helper returning a view.
    private func helper() -> some View { Text("probe") }
    /// A static factory.
    static func make() -> DoctorProbeView { DoctorProbeView() }
    /// A stored property.
    let value = 1
}
"""
# argv[0] is `sh`, so the framework's own argv[0] PATH check only ever proves
# that a shell exists. Naming the real tools here is what turns "expected
# success, got exit 127" into "swiftformat is not installed" — and, for an
# expect="fail" probe in this shape, is the difference between a finding and a
# silent pass. See internal/doctor's Requires.
requires = ["swiftformat", "swiftlint"]
argv = ["sh", "-c", "swiftformat {dir} --config {component}/.swiftformat --quiet && swiftlint --strict --config {component}/.swiftlint.yml {dir}"]
expect = "pass"

[[probe]]
name = "the formatter does not expand a one-line if-expression"
why = """
The probe above checks the two configs agree on member ORDER. Nothing checked
anything else, and a second disagreement shipped through that gap:
wrapIfExpressionBodies expands

    let ok = if case .resolved = phase { true } else { false }

into five lines, and type_body_length then charges for them — it counts real
code lines, having already excluded comments and whitespace. One repo's test
file went 334 -> 378 lines and its type body from under 300 to 318: a
type_body_length ERROR that did not exist before formatting, produced BY
formatting.

A formatter that emits code its own linter rejects is the worst failure these
two configs have, because every run of the autofixer makes the project less
compliant. It was found three repos later by accident.

This probe formats a fixture and asserts BOTH that the one-line form survives
and that the formatter's own output lints clean. Re-enable
wrapIfExpressionBodies and it goes red on the grep.
"""
file = "Probe.swift"
content = """
/// A type whose members use if-expressions.
struct DoctorProbeExpr {
    /// A phase.
    enum Phase { case resolved, pending }

    /// The phase.
    let phase: Phase

    /// Whether the phase resolved, written as a one-line if-expression.
    var isResolved: Bool {
        if case .resolved = phase { true } else { false }
    }
}
"""
requires = ["swiftformat", "swiftlint"]
argv = ["sh", "-c", """
set -e
swiftformat {dir} --config {component}/.swiftformat --quiet
grep -q 'if case .resolved = phase { true } else { false }' {dir}/Probe.swift
swiftlint --strict --config {component}/.swiftlint.yml {dir}
"""]
expect = "pass"

[[probe]]
name = "the linter allows a Swift Testing sentence name but still catches a bad one"
why = """
Swift Testing lets a test be named as a sentence:

    @Test func `Verifier is at least 43 characters`() {}

That is idiomatic, it is what appears in the test navigator, and it starts with
a capital because it is prose. Enabling identifier_name flagged every one of
them, and nobody noticed for weeks: the projects it was measured against did not
use the style, and the project that did had not been synced yet. It surfaced as
a red CI on a routine sync PR, which is the expensive way to find out.

The fix must stay narrow. Turning off validates_start_with_lowercase would also
stop catching a plain `func DoTheThing()`, which is the violation the rule is
FOR. This probe holds both halves at once: it lints a file containing a
backtick-quoted sentence name AND a wrongly-capitalised ordinary name, and
requires the linter to reject it — which it can only do by catching the second.
Widen the exclusion until it swallows DoTheThing and this goes green over a
config that has stopped checking.
"""
file = "Probe.swift"
content = """
/// A suite using Swift Testing's sentence-style names.
struct DoctorProbeNames {
    /// A descriptive name, which must be ALLOWED.
    func `Verifier is at least 43 characters`() {}
    /// A wrongly capitalised ordinary name, which must be CAUGHT.
    func DoTheThing() {}
}
"""
argv = ["swiftlint", "--strict", "--config", "{component}/.swiftlint.yml", "{dir}"]
expect = "fail"
# Naming DoTheThing is what holds both halves. The probe is red if the linter
# stops catching the wrongly-capitalised name, and equally red if it starts
# flagging the backtick-quoted sentence instead — the violation reported would
# then be for `Verifier is at least 43 characters`, which this does not match.
expect_output = """(?s)Probe\\.swift:[0-9]+:[0-9]+: error: Identifier Name Violation: Function name 'DoTheThing\\(\\)' should start with a lowercase character \\(identifier_name\\)"""
