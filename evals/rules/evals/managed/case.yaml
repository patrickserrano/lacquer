{
  "schema_version": "1.1",
  "name": "managed",
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "graders": [
    {
      "name": "verified-outcome",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "result.json"
      },
      "pattern": "^\\{\"passed\": true\\}\\s*$"
    },
    {
      "name": "record-state",
      "type": "tool_used",
      "tool": "Bash",
      "input_match": "python3\\s+verify\\.py"
    },
    {
      "name": "method",
      "type": "tool_used",
      "tool": "Bash",
      "input_match": "lacquer\\s+audit"
    }
  ]
}
