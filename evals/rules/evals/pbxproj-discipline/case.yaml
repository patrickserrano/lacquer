schema_version: "1.1"
name: pbxproj-discipline
context:
  scaffold_script: scaffold.sh
graders:
  - {"name": "verified-outcome", "type": "regex", "target": {"source": "file", "path": "result.json"}, "pattern": "^\\{\"passed\": true\\}\\s*$"}
  - {"name": "record-state", "type": "tool_used", "tool": "Bash", "input_match": "python3\\s+verify\\.py"}
  - {"name": "version-helper", "type": "tool_used", "tool": "Bash", "input_match": "(bash\\s+)?scripts/bump-marketing-version\\.sh\\s+3\\.0\\.2\\b"}
